id: strategy-doubled-pawns
track: strategy
order: 5
access: free
piece: p
title: Сдвоенные пешки
summary: Две пешки на одной вертикали слабее, чем две пешки рядом.
minutes: 6
steps:
  - type: text
    title: Две пешки друг за другом
    body: >-
      Сдвоенными называют пешки, стоящие на одной вертикали. Обычно это слабость, ведь задняя
      пешка не может защитить переднюю, и их труднее двигать. Сдвоенные пешки получаются после
      взятия: когда пешка берёт фигуру и оказывается рядом со своей же.
    pointsTitle: Почему сдвоенные пешки слабее
    points:
      - Они не защищают друг друга
      - Передняя пешка мешает задней двигаться
      - Они хуже контролируют клетки впереди
    board:
      fen: 4k3/pp3ppp/8/8/8/2P5/2P2PPP/4K3 w - - 0 1
      caption: Белые пешки c2 и c3 сдвоены
    remember: Если можно, не разбивай свои пешки, а соперника лучше заставь это сделать.

  - type: find-squares
    title: Найди сдвоенные пешки
    prompt: Отметь обе белые пешки, стоящие на одной вертикали.
    fen: 4k3/pp3ppp/8/8/8/2P5/2P2PPP/4K3 w - - 0 1
    squares: [c2, c3]
    success: Верно! Пешки c2 и c3 стоят на одной вертикали, это сдвоенные пешки.
    oops: Ищи две белые пешки, одна из которых стоит прямо за другой.
    hint: Это две пешки на вертикали c.

  - type: quiz
    question: Почему сдвоенные пешки считаются слабостью?
    options:
      - text: Они не могут защищать друг друга и плохо двигаются
        correct: true
        explanation: Да! Задняя пешка не защищает переднюю, и обе меньше полезны.
      - text: Потому что их нельзя взять
        correct: false
        explanation: Их можно взять так же, как любые другие пешки.
      - text: Потому что они всегда ходят назад
        correct: false
        explanation: Пешки назад не ходят. Дело в том, что они плохо защищают друг друга.

  - type: quiz
    question: Бывает ли польза от сдвоенных пешек?
    options:
      - text: Да, иногда они открывают линию для ладьи
        correct: true
        explanation: Да! Взяв фигуру пешкой, ты можешь получить полуоткрытую линию и сильную позицию, даже со сдвоенными пешками.
      - text: Нет, это всегда плохо
        correct: false
        explanation: Не всегда. Иногда открытая линия или пара слонов компенсируют слабость.
      - text: Да, они двигаются вдвое быстрее
        correct: false
        explanation: Они двигаются как обычные пешки, быстрее не становятся.
