title: Испанская партия
summary: Слон давит на коня, который защищает пешку e5.
minutes: 6
steps:
  - type: text
    title: Слон давит на коня
    body: >-
      Испанская партия начинается ходами 1.e4 e5 2.Кf3 Кc6 3.Сb5. Слон не нападает на пешку
      сразу, а давит на коня c6. Конь защищает пешку e5, так что белые ослабляют защиту
      центра.
    pointsTitle: Идеи белых
    points:
      - Давить на коня c6, защитника пешки e5
      - Рокироваться и выстроить центр
      - Играть спокойно и без спешки
    board:
      fen: r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3
      arrows:
        - { from: b5, to: c6, color: sun }
        - { from: c6, to: e5, color: sky }
      caption: Слон b5 давит на коня c6, а конь защищает e5
    remember: Слон на b5 давит на защитника пешки e5.

  - type: demo
    title: Гамбит показывает дебют
    body: Смотри, как белые приходят в испанскую партию.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, f1b5]

  - type: move
    title: Выведи слона
    prompt: Сыграй третий ход испанской партии и выведи слона на b5.
    fen: r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3
    answers: [f1b5]
    hints:
      piece: Ходи слоном, он стоит на f1.
      idea: Слон идёт по диагонали на b5 и нацеливается на коня c6.
    success: Испанская партия! Слон давит на защитника центра.
    oops: Слон пока не там, где нужно. Выведи его на диагональ, которая упирается в коня c6.
    successArrows:
      - { from: f1, to: b5, color: sun }

  - type: move
    title: Отступи слоном
    prompt: Чёрные сыграли a6 и нападают на слона. Отступи слоном на a4, оставив давление на коня.
    fen: r1bqkbnr/1ppp1ppp/p1n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 4
    answers: [b5a4]
    hints:
      piece: Ходи слоном, он стоит на b5.
      idea: Слону нужно уйти по той же диагонали, не теряя давления. Отступи на a4.
    success: Слон ушёл на a4 и по-прежнему смотрит на коня.
    oops: Слон под ударом пешки, надо отступить. Лучше всего оставить его на той же диагонали, на a4.
    successArrows:
      - { from: b5, to: a4, color: sun }

  - type: quiz
    question: Как называется дебют 1.e4 e5 2.Кf3 Кc6 3.Сb5?
    options:
      - text: Испанская партия
        correct: true
        explanation: Да! Слон на b5 и есть главный признак этого дебюта.
      - text: Итальянская партия
        correct: false
        explanation: Почти! В итальянской партии слон идёт на c4, а не на b5.
      - text: Ферзевый гамбит
        correct: false
        explanation: Он начинается с хода ферзевой пешки, а тут играют королевской, e4.
