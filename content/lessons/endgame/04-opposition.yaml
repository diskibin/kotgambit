id: endgame-opposition
track: endgame
order: 4
access: free
piece: k
title: Оппозиция
summary: Короли стоят друг против друга, и тому, чей ход, приходится уступить дорогу.
minutes: 7
steps:
  - type: text
    title: Короли друг против друга
    body: >-
      В эндшпиле король с пешкой против короля побеждает или не побеждает в зависимости от
      оппозиции. Оппозиция это когда два короля стоят на одной вертикали через одну клетку. Тот,
      у кого сейчас ход, вынужден отступить, и его соперник занимает нужное поле.
    pointsTitle: Как работает оппозиция
    points:
      - Короли стоят друг против друга через одну клетку
      - Ход делает тот, кто не держит оппозицию, и ему приходится отступать
      - Король с пешкой проходит вперёд, когда сильнейшая сторона держит оппозицию
    board:
      fen: 4k3/8/4K3/4P3/8/8/8/8 b - - 0 1
      arrows:
        - { from: e6, to: e8, color: sun }
      caption: Белый король держит оппозицию, и чёрному королю приходится уступить
    remember: Держать оппозицию значит оставить сопернику ход, при котором он уступает.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как белый король проходит вперёд, а пешка ставит шах и идёт к ферзю.
    fen: 4k3/8/3K4/4P3/8/8/8/8 w - - 0 1
    moves: [d6e6, e8f8, e6d7, f8f7, e5e6]

  - type: move
    title: Займи оппозицию
    prompt: Поставь короля напротив чёрного, с одной клеткой между ними. Сходи королём на e6.
    fen: 4k3/8/3K4/4P3/8/8/8/8 w - - 0 1
    answers: [d6e6]
    hints:
      piece: Ходи королём, он стоит на d6.
      idea: Чёрный король на e8. Встань на ту же вертикаль через одну клетку, на e6.
    success: Оппозиция! Теперь чёрному королю приходится отступить, и пешка пройдёт.
    oops: Другие ходы королём теряют выигрыш. Нам нужна оппозиция, встань на e6 напротив чёрного короля.
    successArrows:
      - { from: d6, to: e6, color: sun }

  - type: move
    title: Ещё раз оппозиция
    prompt: Король с пешкой e4 против короля. Займи оппозицию, и поставь короля на e5 напротив чёрного.
    fen: 8/4k3/8/3K4/4P3/8/8/8 w - - 0 1
    answers: [d5e5]
    hints:
      piece: Ходи королём, он стоит на d5.
      idea: Чёрный король на e7. Встань на e5, через одну клетку от него на той же вертикали.
    success: Оппозиция! Теперь белые проходят вперёд, а чёрному королю приходится уступить.
    oops: Нам нужна оппозиция. Встань королём на ту же вертикаль, что и чёрный, через одну клетку.
    successArrows:
      - { from: d5, to: e5, color: sun }

  - type: quiz
    question: Что значит держать оппозицию?
    options:
      - text: Стоять королём напротив чужого через одну клетку, оставив ему ход
        correct: true
        explanation: Да! Тогда сопернику приходится отступать, и ты занимаешь нужное поле.
      - text: Стоять королём рядом с чужим королём
        correct: false
        explanation: Почти! Но короли никогда не стоят рядом, между ними должна быть клетка.
      - text: Закрывать королём свою пешку
        correct: false
        explanation: Это другое. Оппозиция относится к положению двух королей друг против друга.
