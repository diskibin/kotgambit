id: mates-lolli
track: mates
order: 5
access: free
piece: q
title: Мат Лолли
summary: Ферзь под защитой пешки f6 ставит мат королю, который спрятался за пешками.
minutes: 6
steps:
  - type: text
    title: Ферзь и пешка
    body: >-
      Этот мат называют матом Лолли. Белая пешка стоит на f6, а ферзь приходит на g7 и
      защищён этой пешкой. Король остаётся на g8, и всё поле вокруг него занято или
      простреливается. Приём встречается, когда у чёрных ослаблены поля вокруг короля.
    pointsTitle: Как выглядит мат Лолли
    points:
      - Белая пешка стоит на f6
      - Ферзь берёт пешку на g7
      - Король на g8 закрыт своими пешками f7 и h7
    board:
      fen: 6k1/5ppp/5P2/8/8/6Q1/8/6K1 w - - 0 1
      arrows:
        - { from: g3, to: g7, color: sun }
        - { from: f6, to: g7, color: mint }
      caption: Ферзь идёт на g7, пешка f6 его защищает
    remember: Пешка на f6 делает поле g7 недоступным для короля.

  - type: move
    title: Поставь мат Лолли
    prompt: Возьми ферзём пешку g7, которую защищает не чёрная, а твоя пешка f6.
    fen: 6k1/5ppp/5P2/8/8/6Q1/8/6K1 w - - 0 1
    answers: [g3g7, g3b8]
    hints:
      piece: Ходи ферзём, он стоит на g3.
      idea: Поднимись ферзём по вертикали g и возьми пешку g7 рядом с королём.
    success: Мат! Король не может взять ферзя, его защищает пешка f6.
    oops: Ферзь нужен рядом с королём, но так, чтобы его кто-то защищал. Бери пешку g7.
    successArrows:
      - { from: g3, to: g7, color: sun }

  - type: quiz
    question: Почему ферзь на g7 нельзя взять королём?
    options:
      - text: Его защищает пешка f6
        correct: true
        explanation: Да! Король не может брать защищённую фигуру, значит, это мат.
      - text: Потому что король уже под шахом от слона
        correct: false
        explanation: Слона тут нет. Ферзя защищает пешка f6.
      - text: Потому что это правила разрешают
        correct: false
        explanation: Король берёт любую незащищённую фигуру рядом, но ферзя на g7 защищает пешка.
