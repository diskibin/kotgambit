id: middlegame-open-files
track: middlegame
order: 10
access: free
piece: r
title: Открытые линии
summary: Ладьям нужен простор, поэтому им лучше всего на вертикалях без пешек.
minutes: 6
steps:
  - type: text
    title: Ладьи любят простор
    body: >-
      Открытая вертикаль это вертикаль, на которой нет пешек ни у тебя, ни у соперника. Ладья
      на такой линии нападает через всю доску и может проникнуть в лагерь соперника. Поэтому
      ладьи принято ставить именно туда.
    pointsTitle: Как использовать открытую линию
    points:
      - Поставь на неё ладью
      - Займи её раньше соперника
      - Если ладьи разменяют, проникни на седьмую горизонталь
    board:
      fen: 4k3/ppp2ppp/8/8/8/8/PPP2PPP/R3K3 w - - 0 1
      arrows:
        - { from: a1, to: d1, color: sun }
      caption: Вертикаль d открыта, на ней нет ни одной пешки
    remember: Ладья на открытой линии нападает через всю доску.

  - type: move
    title: Займи открытую линию
    prompt: Вертикаль d открыта. Поставь на неё ладью.
    fen: 4k3/ppp2ppp/8/8/8/8/PPP2PPP/R3K3 w - - 0 1
    answers: [a1d1]
    hints:
      piece: Ходи ладьёй, она стоит на a1.
      idea: Ладья идёт по горизонтали на d1, и тогда вертикаль d окажется в её власти.
    success: Ладья на открытой линии! Теперь она смотрит через всю доску.
    oops: Ладье тесно в углу. Выведи её на открытую вертикаль d.
    successArrows:
      - { from: a1, to: d1, color: sun }

  - type: quiz
    question: Какая вертикаль здесь открыта?
    board:
      fen: 6k1/pp1p1ppp/8/8/8/8/PP1P1PPP/6K1 w - - 0 1
    options:
      - text: Вертикаль c
        correct: true
        explanation: Да! На вертикали c нет ни белых, ни чёрных пешек.
      - text: Вертикаль a
        correct: false
        explanation: Почти! Но на вертикали a стоят пешки обеих сторон, значит она закрыта.
      - text: Вертикаль g
        correct: false
        explanation: Рядом с королями стоят пешки g7 и g2, значит вертикаль закрыта.

  - type: quiz
    question: Почему ладье лучше на открытой вертикали?
    options:
      - text: Там её ничто не закрывает, и она нападает через всю доску
        correct: true
        explanation: Да! Свободные линии это главное оружие ладьи.
      - text: Ладье можно ходить только по открытым линиям
        correct: false
        explanation: Почти! Ладья ходит и по закрытым, но на открытых она намного сильнее.
      - text: Там её нельзя взять
        correct: false
        explanation: Взять можно везде. Просто на открытой линии ладья нападает дальше.
