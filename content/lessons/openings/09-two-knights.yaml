id: openings-two-knights
track: openings
order: 9
access: free
piece: n
title: 'Защита двух коней'
summary: 'Чёрные отвечают на итальянскую партию острым ходом конём.'
minutes: 7
steps:
  - type: text
    title: 'Острый ответ на итальянскую партию'
    body: >-
      После итальянской партии 1.e4 e5 2.Nf3 Nc6 3.Bc4 чёрные могут сыграть 3...Nf6. Так получается защита двух коней. Чёрный конь сразу нападает на пешку e4 и предлагает белым острую игру.
    pointsTitle: 'Что нужно знать'
    points:
      - 'Чёрные развивают второго коня и нападают на e4'
      - 'Белые часто отвечают Ng5 и давят на слабое поле f7'
      - 'Чёрным важно не торопиться брать пешку d5 конём'
    remember: 'В острых дебютах точный ответ важнее быстрого.'

  - type: demo
    title: 'Защита двух коней'
    body: >-
      Белые играют итальянскую партию, а чёрные отвечают вторым конём. Теперь белая пешка e4 под ударом, и белым нужно что-то придумать.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, f1c4, g8f6]

  - type: move
    title: 'Нападение на f7'
    prompt: 'Белые хотят использовать слабое поле f7. Поставь коня так, чтобы он вместе со слоном давил на него.'
    fen: r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4
    answers: [f3g5]
    hints:
      piece: 'Ходи конём, он стоит на f3.'
      idea: 'Конь идёт на g5 и вместе со слоном c4 нацеливается на f7.'
    success: 'Конь и слон нацелились на f7. Чёрным нужно ответить точно.'
    oops: 'Ищи ход конём, после которого вместе со слоном c4 будет нападение на f7.'
    successArrows:
      - { from: f3, to: g5, color: sun }

  - type: demo
    title: 'Ответ чёрных'
    body: >-
      Чёрные отвечают 4...d5 и после 5.exd5 играют Na5, отгоняя слона. Брать на d5 конём неудобно, ведь тогда белые жертвуют коня на f7 и начинают опасную атаку.
    fen: r1bqkb1r/pppp1ppp/2n2n2/4p1N1/2B1P3/8/PPPP1PPP/RNBQK2R b KQkq - 5 4
    moves: [d7d5, e4d5, c6a5]

  - type: quiz
    question: 'Почему после 5.exd5 лучше играть Na5, а не Nxd5?'
    options:
      - text: 'Потому что конь на a5 ближе к королю'
        correct: false
        explanation: 'Нет, это не причина. Важно избежать атаки на f7.'
      - text: 'Потому что пешка d5 сильнее коня'
        correct: false
        explanation: 'Дело не в силе пешки, а в опасной жертве на f7.'
      - text: 'После Nxd5 белые жертвуют коня на f7 с опасной атакой'
        correct: true
        explanation: 'Да! Поэтому пешка d5 может подождать, а конь идёт на a5 и прогоняет слона.'

  - type: demo
    title: 'Что дальше'
    body: >-
      Белые ставят шах слоном, потом берут пешку на c6 и возвращают слона на e2. Чёрные получают быстрое развитие и забирают пешку e4. Игра идёт остро, и у каждой стороны есть шансы.
    fen: r1bqkb1r/ppp2ppp/5n2/n2Pp1N1/2B5/8/PPPP1PPP/RNBQK2R w KQkq - 1 6
    moves: [c4b5, c7c6, d5c6, b7c6, b5e2, h7h6, g5f3, e5e4]

  - type: quiz
    question: 'Что главное в защите двух коней?'
    options:
      - text: 'Только защита пешки e5'
        correct: false
        explanation: 'Это не главное. Чёрные стремятся к активной игре.'
      - text: 'Быстрое развитие и ответная игра в центре'
        correct: true
        explanation: 'Да! Чёрные отдают пешку, но получают развитие и активные фигуры.'
      - text: 'Ранний размен ферзей'
        correct: false
        explanation: 'Нет, в этом дебюте ферзи остаются на доске и усиливают атаку.'
