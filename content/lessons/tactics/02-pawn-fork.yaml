id: tactics-pawn-fork
track: tactics
order: 2
access: free
piece: p
title: Пешечная вилка
summary: Самая маленькая фигура иногда выигрывает самую большую добычу.
minutes: 6
steps:
  - type: text
    title: Пешка тоже умеет
    body: >-
      Вилку можно сделать не только конём. Пешка бьёт по диагонали вперёд на две клетки сразу. Если на этих клетках стоят две фигуры, пешка нападает на обе. Выиграть можно даже ферзя, если подойти пешкой правильно.
    pointsTitle: Как заметить пешечную вилку
    points:
      - Найди две фигуры соперника, стоящие через клетку друг от друга по одной горизонтали
      - Посмотри, может ли пешка встать посередине и чуть ниже
      - Проверь, что нужную клетку не бьёт чужая фигура
    board:
      fen: 4k3/8/2n1n3/8/3P4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: d5, color: sun }
      caption: Пешка на d5 нападёт сразу на двух коней
    remember: Пешка идёт вперёд, а бьёт по диагонали, это и есть её вилка.

  - type: demo
    title: Гамбит показывает вилку
    body: Пешка встаёт на d5, и один конь пропадает.
    fen: 4k3/8/2n1n3/8/3P4/8/8/4K3 w - - 0 1
    moves: [d4d5, c6e5, d5e6]

  - type: move
    title: Вилка пешкой
    prompt: Напади пешкой сразу на обоих коней.
    fen: 4k3/8/2n1n3/8/3P4/8/8/4K3 w - - 0 1
    answers: [d4d5]
    hints:
      piece: Ходи пешкой, она стоит на d4.
      idea: Шагни пешкой на d5. Оттуда она бьёт c6 и e6.
    success: Пешечная вилка! Один из коней обязательно пропадёт.
    oops: Пока пешка не нападает на обоих. Ищи клетку между конями, чуть ниже их.
    successArrows:
      - { from: d4, to: d5, color: sun }

  - type: move
    title: Вилка на ладью и коня
    prompt: Одним ходом пешки напади и на ладью, и на коня.
    fen: 4k3/8/8/1r1n4/8/2P5/8/4K3 w - - 0 1
    answers: [c3c4]
    hints:
      piece: Ходи пешкой, она стоит на c3.
      idea: Пешка на c4 бьёт сразу по диагоналям на b5 и d5.
    success: Отлично! Ладья и конь под ударом, и ладью придётся отдать за слабую пешку.
    oops: Подумай про клетку, с которой пешка бьёт и b5, и d5.
    successArrows:
      - { from: c3, to: c4, color: sun }

  - type: quiz
    question: Как бьёт пешка?
    options:
      - text: Прямо вперёд
        correct: false
        explanation: Вперёд пешка только ходит, а бьёт она по диагонали.
      - text: По диагонали вперёд на одну клетку
        correct: true
        explanation: Да! Поэтому с клетки между двумя фигурами пешка нападает сразу на обе.
      - text: Во все стороны
        correct: false
        explanation: Во все стороны бьёт король. Пешка бьёт только вперёд по диагонали.
