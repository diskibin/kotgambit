id: tactics-bishop-fork
track: tactics
order: 4
access: free
piece: b
title: Вилка слоном
summary: Слон бьёт по диагоналям издалека, и вилки получаются тихими и коварными.
minutes: 6
steps:
  - type: text
    title: Слон из засады
    body: >-
      Слон нападает на дальние клетки по диагонали, и его вилки соперник часто не видит. Один ход слона, и под ударом король и ещё одна фигура. Король должен уйти, а вторая цель остаётся без защиты.
    pointsTitle: Как найти вилку слоном
    points:
      - Посмотри, на какие клетки смотрит слон по диагонали
      - Найди клетку, откуда он видит короля и ещё одну фигуру
      - Убедись, что слона не побьют после хода
    board:
      fen: 6k1/8/8/8/8/8/r6P/3B1K2 w - - 0 1
      arrows:
        - { from: b3, to: g8, color: sun }
        - { from: b3, to: a2, color: mint }
      caption: Слон на b3 даёт шах и нападает на ладью a2
    remember: Слон бьёт далеко, поэтому его вилки лежат на других диагоналях, чем ты привык смотреть.

  - type: demo
    title: Гамбит показывает вилку
    body: Слон ставит шах, а потом забирает ладью.
    fen: 6k1/8/8/8/8/8/r6P/3B1K2 w - - 0 1
    moves: [d1b3, g8g7, b3a2]

  - type: move
    title: Вилка слоном
    prompt: Дай шах слоном и нападай на ладью.
    fen: 6k1/8/8/8/8/8/r6P/3B1K2 w - - 0 1
    answers: [d1b3]
    hints:
      piece: Ходи слоном, он стоит на d1.
      idea: Встань на b3, оттуда слон видит и короля g8, и ладью a2.
    success: Вилка слоном! Король ушёл, и ладья осталась без защиты.
    oops: Слон пока не нападает на обе цели. Найди клетку, откуда виден и король, и ладья.
    successArrows:
      - { from: d1, to: b3, color: sun }

  - type: quiz
    question: По каким линиям бьёт слон?
    options:
      - text: По диагоналям
        correct: true
        explanation: Да! Слон ходит и бьёт только по диагоналям, поэтому его вилки лежат на диагоналях.
      - text: По вертикалям и горизонталям
        correct: false
        explanation: Так ходит ладья. Слон ходит по диагонали.
      - text: Буквой Г
        correct: false
        explanation: Буквой Г ходит конь. Слон ходит по диагоналям.

  - type: quiz
    question: Почему после вилки слоном соперник теряет вторую цель?
    options:
      - text: Потому что слон сильнее ладьи
        correct: false
        explanation: Дело не в силе. Просто шах нужно отменить, и защитить вторую цель нет времени.
      - text: Потому что ходить второй раз можно
        correct: false
        explanation: Ходить подряд нельзя. Но шах заставляет ответить так, что на вторую цель времени нет.
      - text: Он должен отвечать на шах и не успевает её защитить
        correct: true
        explanation: Да! Шах требует немедленного ответа, поэтому второй ход спасти уже некогда.
