id: games-reti
track: games
order: 4
access: free
piece: b
title: 'Жертва ферзя за одиннадцать ходов'
summary: 'Рети жертвует ферзя на девятом ходу и ставит мат слоном.'
minutes: 7
steps:
  - type: text
    title: 'Короткая и красивая'
    body: >-
      Эту партию сыграли Рихард Рети и Савелий Тартаковер в Вене в 1910 году. Белые пожертвовали ферзя
      на девятом ходу и поставили мат на одиннадцатом. Хороший пример того, как открытая линия, шахи и
      защита ладьи слоном решают партию.
    pointsTitle: 'На что смотреть'
    points:
      - 'Белые рокируют на ферзевый фланг, и ладья смотрит на d-линию'
      - 'Жертва ферзя открывает путь слону и ладье'
      - 'Мат ставят слон и ладья, а ферзя уже нет'
    remember: 'Жертва оправдана, когда после неё мат нельзя остановить.'

  - type: demo
    title: 'Начало в защите Каро-Канн'
    body: >-
      Чёрные играют защиту Каро-Канн. Белые берут пешку, и в центре меняются фигуры.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, c7c6, d2d4, d7d5, b1c3, d5e4, c3e4, g8f6]

  - type: demo
    title: 'Длинная рокировка'
    body: >-
      Белые рокируются на ферзевый фланг, и ладья d1 смотрит на d-линию. Чёрные берут коня на e4 и
      ничего не подозревают.
    fen: rnbqkb1r/pp2pppp/2p2n2/8/3PN3/8/PPP2PPP/R1BQKBNR w KQkq - 1 5
    moves: [d1d3, e7e5, d4e5, d8a5, c1d2, a5e5, e1c1, f6e4]

  - type: move
    title: 'Жертва ферзя'
    prompt: 'Чёрные взяли коня. Дай шах ферзём, который король обязан взять.'
    fen: rnb1kb1r/pp3ppp/2p5/4q3/4n3/3Q4/PPPB1PPP/2KR1BNR w kq - 0 9
    answers: [d3d8]
    hints:
      piece: 'Ходи ферзём, он стоит на d3.'
      idea: 'Ферзь идёт на d8 с шахом. Король обязан его взять, и откроется путь слону.'
    success: 'Ферзь отдан, но чёрный король оказался на d8, и мат уже рядом.'
    oops: 'Нужен шах по вертикали d, который король вынужден принять.'
    successArrows:
      - { from: d3, to: d8, color: sun }

  - type: move
    title: 'Шах слоном'
    prompt: 'Король взял ферзя. Дай шах слоном, ведь ладья d1 уже смотрит на короля.'
    fen: rnbk1b1r/pp3ppp/2p5/4q3/4n3/8/PPPB1PPP/2KR1BNR w - - 0 10
    answers: [d2g5]
    hints:
      piece: 'Ходи слоном, он стоит на d2.'
      idea: 'Слон идёт на g5 и даёт шах по диагонали, а ладья давит по вертикали.'
    success: 'Шах! У короля только два хода, и оба ведут к мату.'
    oops: 'Слон должен дать шах по диагонали на d8. Подойдёт g5.'
    successArrows:
      - { from: d2, to: g5, color: sun }

  - type: move
    title: 'Мат слоном'
    prompt: 'Король ушёл на c7. Поставь мат слоном.'
    fen: rnb2b1r/ppk2ppp/2p5/4q1B1/4n3/8/PPP2PPP/2KR1BNR w - - 2 11
    answers: [g5d8]
    hints:
      piece: 'Ходи слоном, он стоит на g5.'
      idea: 'Слон идёт на d8 с шахом, а ладья d1 его защищает.'
    success: 'Мат! Если бы король пошёл на e8, мат поставила бы ладья на d8.'
    oops: 'Нужен шах рядом с королём, чтобы его защищала ладья. Подойдёт d8.'
    successArrows:
      - { from: g5, to: d8, color: sun }

  - type: quiz
    question: 'Почему белые смогли отдать ферзя на девятом ходу?'
    options:
      - text: 'После жертвы неизбежен мат, который чёрные не могут остановить'
        correct: true
        explanation: 'Да! Жертва оправдана, когда её результатом становится мат.'
      - text: 'Потому что ферзь белым был не нужен'
        correct: false
        explanation: 'Ферзь очень нужен. Белые отдали его, потому что увидели мат.'
      - text: 'Потому что чёрные тоже отдали ферзя'
        correct: false
        explanation: 'Нет, чёрный ферзь взял коня и остался без защиты.'
