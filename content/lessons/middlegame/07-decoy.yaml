id: middlegame-decoy
track: middlegame
order: 7
access: free
piece: n
title: Завлечение
summary: Заманить фигуру соперника на клетку, где она станет помехой самому королю.
minutes: 6
steps:
  - type: text
    title: Заманить на плохое поле
    body: >-
      Завлечение это приём, когда ты жертвуешь фигуру, чтобы заставить фигуру соперника встать на
      нужную тебе клетку. Часто она сама закрывает королю путь, и на этом строится мат.
    pointsTitle: Чем это отличается от отвлечения
    points:
      - При отвлечении фигуру уводят с важной клетки
      - При завлечении её ставят на клетку, где она мешает
      - Обычно за этим следует мат или выигрыш материала
    board:
      fen: 5r1k/6pp/7N/8/8/1Q6/8/6K1 w - - 0 1
      arrows:
        - { from: b3, to: g8, color: sun }
        - { from: h6, to: f7, color: sky }
      caption: Если ладья окажется на g8, королю будет некуда идти
    remember: Завлеки фигуру туда, где она закроет собственному королю путь.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как жертва ферзя ведёт к мату конём.
    fen: 5r1k/6pp/7N/8/8/1Q6/8/6K1 w - - 0 1
    moves: [b3g8, f8g8, h6f7]

  - type: move
    title: Пожертвуй ферзя
    prompt: Заставь ладью f8 встать на клетку g8. Для этого поставь ферзя на g8 с шахом.
    fen: 5r1k/6pp/7N/8/8/1Q6/8/6K1 w - - 0 1
    answers: [b3g8]
    hints:
      piece: Ходи ферзём, он стоит на b3.
      idea: Ферзь идёт по диагонали на g8. Его защищает конь h6, поэтому король ферзя не возьмёт.
    success: Ферзь на g8 с шахом! Король не может взять его, ведь его защищает конь, и ладья вынуждена взять.
    oops: Нам нужен шах ферзём на g8. Пройди по длинной диагонали, там его защитит конь.
    successArrows:
      - { from: b3, to: g8, color: sun }

  - type: move
    title: Поставь мат конём
    prompt: Ладья взяла ферзя на g8 и закрыла королю последнее поле. Поставь мат конём.
    fen: 6rk/6pp/7N/8/8/8/8/6K1 w - - 0 2
    answers: [h6f7]
    hints:
      piece: Мат поставит конь, он стоит на h6.
      idea: Король заперт своей ладьёй и пешками. Конь с f7 нападает на h8.
    success: Мат! Король заперт собственными фигурами, такой мат называют спёртым.
    oops: Нам нужен шах конём, а король заперт. Найди клетку, с которой конь бьёт по h8.
    successArrows:
      - { from: h6, to: f7, color: sun }

  - type: quiz
    question: Чем завлечение отличается от отвлечения?
    options:
      - text: Фигуру заставляют встать на клетку, где она мешает
        correct: true
        explanation: Да! Её жертвой заманивают на плохое поле, и ты пользуешься этим.
      - text: Ничем, это одно и то же
        correct: false
        explanation: Они похожи, но цели разные. Отвлечение уводит защитника, а завлечение ставит фигуру на нужное тебе поле.
      - text: Завлечение это когда ты берёшь фигуру без боя
        correct: false
        explanation: Такого нет. Завлечение всегда начинается с жертвы.
