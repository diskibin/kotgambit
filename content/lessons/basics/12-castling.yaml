id: basics-castling
track: basics
order: 12
access: free
piece: r
title: Рокировка
summary: Король и ладья меняются местами за один ход, чтобы король оказался в безопасности.
minutes: 6
steps:
  - type: text
    title: Особый ход короля
    body: >-
      Рокировка это единственный ход, которым двигаются сразу две фигуры. Король идёт на две
      клетки к ладье, а ладья перепрыгивает через него и встаёт рядом. Так король уходит в
      безопасное место, а ладья выходит в игру.
    pointsTitle: Можно рокироваться, если
    points:
      - Ни король, ни эта ладья ещё не ходили
      - Между королём и ладьёй нет других фигур
      - Король не под шахом
      - Король не проходит и не встаёт на клетки под боем
    board:
      fen: 4k3/8/8/8/8/8/8/R3K2R w KQ - 0 1
      arrows:
        - { from: e1, to: g1, color: sun }
        - { from: e1, to: c1, color: sky }
      caption: Рокировка в короткую сторону к ладье h1 и в длинную к ладье a1
    remember: Король на две клетки к ладье, ладья через короля.

  - type: demo
    title: Гамбит показывает рокировку
    body: 'Смотри: король идёт на g1, а ладья встаёт на f1.'
    fen: 4k3/8/8/8/8/8/8/R3K2R w KQ - 0 1
    moves: [e1g1]

  - type: move
    title: Рокируйся
    prompt: Сделай короткую рокировку, то есть в сторону ладьи h1.
    fen: r3k2r/8/8/8/8/8/PPPPPPPP/RN2K2R w KQkq - 0 1
    answers: [e1g1]
    hints:
      piece: Рокировку делают королём, он стоит на e1.
      idea: Короткая рокировка идёт в сторону ладьи h1. Король шагает на две клетки.
    success: Король спрятался, а ладья вышла в игру. Отличный ход!
    oops: Рокировку начинают с хода короля на две клетки. Сделай его в сторону ладьи h1 и давай ещё раз.
    successArrows:
      - { from: e1, to: g1, color: sun }

  - type: quiz
    question: В каком случае рокироваться нельзя?
    options:
      - text: Если король уже ходил или стоит под шахом
        correct: true
        explanation: Да! Король, который уже ходил, или король под шахом рокироваться не может.
      - text: Если у соперника больше фигур
        correct: false
        explanation: Количество фигур тут ни при чём. Важно, чтобы король не ходил и не был под шахом.
      - text: Если ты ещё не сделал десять ходов
        correct: false
        explanation: Таких ограничений нет. Рокироваться можно уже на пятом ходу, если ничто не мешает.
