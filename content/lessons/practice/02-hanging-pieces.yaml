id: practice-hanging
track: practice
order: 2
access: free
piece: b
title: Найди висящую фигуру
summary: Учимся замечать фигуры без защиты, свои и чужие.
minutes: 6
steps:
  - type: text
    title: Висящая фигура
    body: >-
      Висящей называют фигуру, которую можно взять даром, потому что её никто не защищает.
      Умение заметить такую фигуру сразу приносит победы, а пропустить её значит потерять
      материал. Проверяй обе стороны доски.
    board:
      fen: r4rk1/pp3ppp/2n1bn2/2bp4/3P4/2N1PN2/PP3PPP/R1BQ1RK1 w - - 0 1
      arrows:
        - { from: d4, to: c5, color: sun }
      caption: Чёрный слон c5 нападён пешкой и не защищён
    remember: Сначала ищи фигуры без защиты у соперника, потом у себя.

  - type: find-squares
    title: Чужие фигуры без защиты
    prompt: Отметь чёрные фигуры и пешки, которых никто не защищает.
    fen: r4rk1/pp3ppp/2n1bn2/2bp4/3P4/2N1PN2/PP3PPP/R1BQ1RK1 w - - 0 1
    squares: [b7, c5]
    success: Верно! Пешка b7 и слон c5 стоят без защиты.
    oops: Не страшно. Проверь каждую чёрную фигуру, есть ли рядом другая, которая может взять назад.
    hint: Две цели. Одна из них слон в центре, вторая пешка на краю.

  - type: move
    title: Возьми слона
    prompt: Чёрный слон на c5 без защиты. Забери его пешкой.
    fen: r4rk1/pp3ppp/2n1bn2/2bp4/3P4/2N1PN2/PP3PPP/R1BQ1RK1 w - - 0 1
    answers: [d4c5]
    hints:
      piece: Бери пешкой, она стоит на d4.
      idea: Пешка d4 бьёт по диагонали на c5, и слон ничем не защищён.
    success: Отлично! Слон забран даром, а ты ничего не потерял.
    oops: Пока ты не взял слона. Ищи способ взять его так, чтобы он оказался без защиты.
    successArrows:
      - { from: d4, to: c5, color: sun }

  - type: find-squares
    title: Свои фигуры без защиты
    prompt: Теперь отметь белые фигуры, которых никто не защищает.
    fen: r4rk1/pp3ppp/2n1bn2/2bp4/3P4/2N1PN2/PP3PPP/R1BQ1RK1 w - - 0 1
    squares: [a1]
    success: Верно! Ладья a1 никем не защищена. Пока её не атакуют, но так тоже бывает.
    oops: Проверь белые фигуры. Есть одна, у которой рядом нет защитников.
    hint: Это угловая фигура, и вокруг неё пусто.

  - type: quiz
    question: Твоя фигура висит. Что можно сделать?
    options:
      - text: Защитить её или увести
        correct: true
        explanation: Да! Либо поставь рядом защитника, либо отведи фигуру в безопасное место.
      - text: Ничего, соперник может не заметить
        correct: false
        explanation: Надеяться на ошибку опасно. Лучше сразу закрыть слабость.
      - text: Напасть на фигуру соперника, не обращая внимания
        correct: false
        explanation: Так можно играть, только если твоя атака сильнее. Обычно лучше сначала защититься.
