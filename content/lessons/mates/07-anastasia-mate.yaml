  - type: text
    title: Конь и ладья вместе
    body: >-
      Мат Анастасии ставят конь и ладья. Король стоит у края доски рядом со своей пешкой. Конь на e7 закрывает ему клетки g8 и g6, а ладья даёт шах по краевой вертикали h. Так королю просто некуда деться.
    pointsTitle: Что нужно для мата Анастасии
    points:
      - Король на h7, рядом с ним своя пешка g7
      - Конь на e7 закрывает поля g8 и g6
      - Ладья даёт шах по вертикали h
