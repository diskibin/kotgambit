id: basics-center
track: basics
order: 21
access: free
piece: n
title: Центр доски
summary: Четыре клетки в середине доски самые важные. Научись их занимать.
minutes: 6
steps:
  - type: text
    title: Четыре главные клетки
    body: >-
      В самой середине доски есть четыре клетки: d4, e4, d5 и e5. Это центр. Фигуры, которые
      стоят в центре, нападают на много клеток сразу и быстро приходят туда, где нужны.
    pointsTitle: Почему центр важен
    points:
      - Из центра фигуры действуют во все стороны
      - Фигуры в центре быстро переходят с одного фланга на другой
      - Тот, кто владеет центром, диктует ход игры
    board:
      fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
      caption: Центр доски, это клетки d4, e4, d5 и e5
    remember: Начинай партию с борьбы за центр.

  - type: find-squares
    title: Найди центр
    prompt: Отметь четыре центральные клетки.
    fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
    squares: [d4, e4, d5, e5]
    success: Верно! Это d4, e4, d5 и e5, самое сердце доски.
    oops: Не страшно. Центр это четыре клетки посередине, между вертикалями c и f и горизонталями 3 и 6.
    hint: Две клетки в четвёртом ряду и две в пятом, на вертикалях d и e.

  - type: find-squares
    title: Конь в центре
    prompt: Отметь все клетки, на которые может пойти конь с e4.
    fen: 4k3/8/8/8/4N3/8/8/4K3 w - - 0 1
    squares: [c3, c5, d2, d6, f2, f6, g3, g5]
    movesOf: e4
    success: Восемь клеток! Из центра конь действует сразу во все стороны.
    oops: Вспомни ход коня буквой Г. Из центра доски у него восемь ходов.
    hint: Считай два шага в одну сторону и один в другую, и так во все стороны.

  - type: find-squares
    title: Конь в углу
    prompt: Теперь отметь клетки, на которые конь может пойти с a1.
    fen: 4k3/8/8/8/8/8/8/N3K3 w - - 0 1
    squares: [b3, c2]
    movesOf: a1
    success: Всего две клетки! В углу конь почти ничего не контролирует.
    oops: В углу у коня мало места. Считай буквой Г от a1, ходов будет всего два.
    hint: Один ход идёт вверх на две клетки и вправо на одну, другой вправо на две и вверх на одну.

  - type: quiz
    question: Где конь сильнее, в центре или в углу?
    options:
      - text: В центре, он нападает на восемь клеток
        correct: true
        explanation: Да! Недаром говорят, что конь на краю это грусть, а в центре это сила.
      - text: В углу, там он в безопасности
        correct: false
        explanation: В углу ему безопасно, но он почти ничего не делает. Вспомни, из угла всего два хода.
      - text: Везде одинаково
        correct: false
        explanation: Нет, в центре у коня восемь ходов, а в углу всего два.

  - type: move
    title: Займи центр
    prompt: Начало партии. Сделай ход пешкой в центр доски.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    answers: [e2e4, d2d4]
    hints:
      piece: Ходи центральной пешкой, стоящей на e2 или d2.
      idea: Пешка выйдет на клетку центра, на e4 или на d4.
    success: Отлично! Пешка в центре освобождает дорогу слону и ферзю.
    oops: Ходить можно по-разному, но сейчас нам нужно занять центр пешкой с e2 или d2.
    successArrows:
      - { from: e2, to: e4, color: sun }
