id: endgame-queen-mate
track: endgame
order: 1
access: free
piece: q
title: Мат ферзём
summary: Как довести ферзя и короля до мата, не допустив пата.
minutes: 6
steps:
  - type: text
    title: Король помогает ферзю
    body: >-
      Если у тебя остались ферзь и король, а у соперника только король, выигрыш всегда есть.
      Ферзь сам оттесняет короля к краю, но поставить мат помогает твой король. Главное, не
      допустить пата.
    pointsTitle: Как это делается
    points:
      - Ферзь стоит на расстоянии коня от чужого короля и отрезает ему путь
      - Король приближается к ферзю, но не мешает ему
      - Перед каждым ходом проверь, что у соперника останется ход
    board:
      fen: 7k/6Q1/6K1/8/8/8/8/8 b - - 0 1
      arrows:
        - { from: g6, to: g7, color: sky }
      caption: Мат. Король g6 защищает ферзя g7, и взять его нельзя
    remember: Ферзь запирает, король защищает ферзя, а пата быть не должно.

  - type: demo
    title: Гамбит показывает мат
    body: Смотри, как ферзь прижимает короля к краю, а король не даёт ему уйти.
    fen: 7k/8/5K2/8/8/8/Q7/8 w - - 0 1
    moves: [a2a7, h8g8, a7g7]

  - type: move
    title: Поставь мат
    prompt: Белый король уже рядом. Поставь мат ферзём одним ходом.
    fen: 7k/8/6K1/8/8/8/8/Q7 w - - 0 1
    answers: [a1g7, a1a8]
    hints:
      piece: Мат поставит ферзь, он стоит на a1.
      idea: Король g6 уже закрывает клетки g7 и h7. Нужно, чтобы ферзь напал на короля и закрыл g8.
    success: Мат! Король заперт, и ферзь с королём довели дело до конца.
    oops: Мата пока нет. Король на h8 должен остаться без клеток и под шахом. Попробуй напасть на него по линии.
    successArrows:
      - { from: a1, to: g7, color: sun }

  - type: quiz
    question: Белые сыграли Фf7. Что получилось на доске?
    board:
      fen: 7k/5Q2/6K1/8/8/8/8/8 b - - 1 1
    options:
      - text: Пат, и партия закончилась вничью
        correct: true
        explanation: Да! Шаха нет, а ходить королю некуда. Это пат, и выигрыш потерян.
      - text: Мат, и белые победили
        correct: false
        explanation: Почти! Но чтобы был мат, король должен быть под шахом. Здесь шаха нет.
      - text: Чёрные просто ходят дальше
        correct: false
        explanation: Было бы так, если бы у короля был ход. Но все его клетки закрыты, а шаха нет.

  - type: quiz
    question: Что нужно проверить перед каждым ходом при игре на мат?
    options:
      - text: Что у соперника останется хотя бы один ход
        correct: true
        explanation: Да! Иначе, если шаха нет, получится пат и ничья.
      - text: Что ферзь стоит рядом с королём
        correct: false
        explanation: Почти! Но ферзь рядом с королём ещё не гарантирует хода. Сначала убедись, что пата не будет.
      - text: Что у тебя больше пешек
        correct: false
        explanation: Пешки тут ни при чём. Нужно проверить, что королю соперника есть куда пойти или он под шахом.
