# Local development services. Start with `pnpm services:up`.
# The defaults are throwaway development credentials, real ones live in .env outside of git.
name: kotgambit-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kotgambit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kotgambit}
      POSTGRES_DB: ${POSTGRES_DB:-kotgambit}
    # Bound to localhost so that the dev database is not exposed to the network
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kotgambit} -d ${POSTGRES_DB:-kotgambit}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends, so that the link of a confirmation or a password reset can be opened
  # without a mail server. The inbox is on http://localhost:8025, set SMTP_URL=smtp://localhost:1025 in .env
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
  redis-data:
