id: openings-famous-traps
track: openings
order: 13
access: free
piece: q
title: 'Дебютные ловушки'
summary: 'Известные ловушки, в которые попадают из спешки или жадности.'
minutes: 8
steps:
  - type: text
    title: 'Не будь жадным'
    body: >-
      В дебюте есть ловушки, в которые легко попасть, если спешить или хватать всё подряд. Мы посмотрим три известные. Они учат одному: перед взятием смотри, что последует за ним.
    pointsTitle: 'Три ловушки'
    points:
      - 'Мат дураком, самый быстрый мат в шахматах'
      - 'Ловушка Блэкберна, в которой белые жадничают'
      - 'Ловушка слона, в которой белые теряют фигуру'
    remember: 'Перед тем как взять, посмотри, чем ответит соперник.'

  - type: demo
    title: 'Мат за два хода'
    body: >-
      Белые двигают пешки f и g и открывают королю диагональ. Чёрный ферзь ставит мат. Это самый быстрый мат в шахматах.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [f2f3, e7e5, g2g4, d8h4]

  - type: demo
    title: 'Ловушка Блэкберна'
    body: >-
      Белые берут пешку e5, и чёрный ферзь нападает сразу на g2 и на коня e5. Кажется, белым выгодно взять ещё пешку, но это ошибка.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, f1c4, c6d4, f3e5, d8g5]

  - type: demo
    title: 'Мат конём'
    body: >-
      Белые берут пешку f7, а чёрные берут g2 и ставят шах. Потом конь ставит мат. Жадность наказана.
    fen: r1b1kbnr/pppp1ppp/8/4N1q1/2BnP3/8/PPPP1PPP/RNBQK2R w KQkq - 1 5
    moves: [e5f7, g5g2, h1f1, g2e4, c4e2, d4f3]

  - type: demo
    title: 'Ловушка слона'
    body: >-
      Белые берут пешку d5 и думают, что выигрывают. Но чёрные берут коня, белые берут ферзя, и чёрные отвечают шахом слоном. В конце чёрные выиграли фигуру.
    fen: r1bqkb1r/pppn1ppp/5n2/3p2B1/3P4/2N5/PP2PPPP/R2QKBNR w KQkq - 0 6
    moves: [c3d5, f6d5, g5d8, f8b4, d1d2, b4d2, e1d2, e8d8]

  - type: quiz
    question: 'Чему учат дебютные ловушки?'
    options:
      - text: 'Всегда брать пешки, которые дарят'
        correct: false
        explanation: 'Нет, подарок может быть ловушкой.'
      - text: 'Перед взятием проверять, что ответит соперник'
        correct: true
        explanation: 'Да! Ловушки ставят на тех, кто берёт всё подряд.'
      - text: 'Никогда не брать ничего'
        correct: false
        explanation: 'Нет, брать можно, если ты проверил последствия.'
