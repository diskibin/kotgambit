id: openings-slav
track: openings
order: 12
access: free
piece: p
title: 'Славянская защита'
summary: 'Чёрные надёжно защищают пешку d5 и не запирают слона.'
minutes: 7
steps:
  - type: text
    title: 'Прочная защита'
    body: >-
      В ответ на ферзевый гамбит 1.d4 d5 2.c4 чёрные могут сыграть 2...c6. Это славянская защита. Пешка c6 защищает d5, а слон c8 остаётся на свободе и может выйти до того, как чёрные сыграют e6.
    pointsTitle: 'Идеи славянской защиты'
    points:
      - 'Пешка c6 защищает центр, не закрывая слона c8'
      - 'Слон выходит за цепь пешек, например на f5'
      - 'Позиция надёжная и подходит тем, кто любит спокойную игру'
    remember: 'Выведи слона раньше, чем закроешь его своими пешками.'

  - type: demo
    title: 'Основные ходы'
    body: >-
      Чёрные защищают пешку d5 и развивают коня. Белые тоже развивают фигуры, и чёрные берут пешку c4.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [d2d4, d7d5, c2c4, c7c6, g1f3, g8f6, b1c3, d5c4]

  - type: move
    title: 'Не отпускай пешку'
    prompt: 'Чёрные взяли пешку на c4. Помешай им удержать её, сыграв пешкой a.'
    fen: rnbqkb1r/pp2pppp/2p2n2/8/2pP4/2N2N2/PP2PPPP/R1BQKB1R w KQkq - 0 5
    answers: [a2a4]
    hints:
      piece: 'Ходи пешкой, она стоит на a2.'
      idea: 'Пешка a4 не даёт чёрным поддержать пешку ходом b5.'
    success: 'Теперь чёрным будет трудно удержать пешку c4, и белые вернут её.'
    oops: 'Нужен ход пешкой, который не пустит b5. Это a4.'
    successArrows:
      - { from: a2, to: a4, color: sun }

  - type: demo
    title: 'Слон выходит'
    body: >-
      Чёрный слон выходит на f5, пока он не заперт пешкой e6. Белые играют e3, чёрные e6, и белый слон возвращает пешку. Чёрные связывают коня слоном b4.
    fen: rnbqkb1r/pp2pppp/2p2n2/8/P1pP4/2N2N2/1P2PPPP/R1BQKB1R b KQkq - 0 5
    moves: [c8f5, e2e3, e7e6, f1c4, f8b4]

  - type: quiz
    question: 'Почему в славянской защите слон выходит до хода e6?'
    options:
      - text: 'Потому что слон должен защищать короля'
        correct: false
        explanation: 'Слон выходит наружу, чтобы быть активным.'
      - text: 'Потому что так требуют правила'
        correct: false
        explanation: 'Это не правило, а хорошая идея.'
      - text: 'Чтобы слон не оказался запертым за своими пешками'
        correct: true
        explanation: 'Да! После e6 слон c8 был бы закрыт пешками, поэтому его выводят заранее.'
