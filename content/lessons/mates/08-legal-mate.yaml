id: mates-legal
track: mates
order: 8
access: free
piece: n
title: Мат Легаля
summary: Белые жертвуют ферзя и ставят мат двумя конями и слоном.
minutes: 7
steps:
  - type: text
    title: Жертва ради мата
    body: >-
      Мат Легаля это знаменитая ловушка. Чёрные берут белого ферзя, а белые отвечают шахом слоном и матом конём. Мат ставят двумя конями и слоном. Пример показывает, что жертва ферзя иногда оправдана, если за ней следует мат.
    pointsTitle: Как это бывает
    points:
      - Белый конь уходит с f3 на e5, и чёрный слон берёт ферзя d1
      - Белый слон берёт пешку f7 и ставит шах
      - Конь прыгает на d5, и это мат
    remember: Прежде чем взять ферзя, проверь, не готовит ли соперник мат.

  - type: demo
    title: Гамбит показывает ловушку
    body: Чёрный слон берёт ферзя, а белые отвечают шахом слоном и матом конём.
    fen: rn1qkbnr/ppp2p1p/3p2p1/4p3/2B1P1b1/2N2N2/PPPP1PPP/R1BQK2R w KQkq - 0 5
    moves: [f3e5, g4d1, c4f7, e8e7, c3d5]

  - type: move
    title: Заверши ловушку
    prompt: Чёрный король на e7, слон f7 даёт шах. Поставь мат конём.
    fen: rn1q1bnr/ppp1kB1p/3p2p1/4N3/4P3/2N5/PPPP1PPP/R1BbK2R w KQ - 1 7
    answers: [c3d5]
    hints:
      piece: Ходи конём, он стоит на c3.
      idea: Прыгни на d5, откуда конь даёт шах королю e7.
    success: Мат! Король не может уйти, его закрывают слон f7 и свои фигуры.
    oops: Нужен шах конём, после которого королю некуда идти. Попробуй клетку d5.
    successArrows:
      - { from: c3, to: d5, color: sun }

  - type: quiz
    question: Чему учит мат Легаля?
    options:
      - text: Что ферзя всегда нужно отдавать
        correct: false
        explanation: Ферзя отдавать нужно не всегда. Дело в том, что за жертвой следует мат.
      - text: Что кони сильнее ферзя
        correct: false
        explanation: По стоимости ферзь выше. Но мат дороже любых фигур.
      - text: Не стоит брать ферзя без проверки, если за ним может последовать мат
        correct: true
        explanation: Да! Жадность наказывается, когда нужно смотреть на угрозы.
