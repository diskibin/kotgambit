id: practice-time
track: practice
order: 5
access: free
piece: r
title: Играем на время
summary: Как распределять время, чтобы его хватило до конца партии.
minutes: 6
steps:
  - type: text
    title: Время это тоже фигура
    body: >-
      В партиях с часами время важно почти как материал. Можно выиграть позицию и проиграть на времени, а можно успеть всё обдумать и спокойно довести партию до конца. Поэтому полезно заранее решить, на что ты потратишь минуты.
    pointsTitle: Как не опоздать
    points:
      - Простые и очевидные ходы делай быстро
      - Долго думай только там, где позиция критическая
      - Не трать много времени на первые ходы дебюта
      - Если времени мало, играй проще и без лишнего риска
    remember: Время нужно тратить на трудные ходы, а не на очевидные.

  - type: move
    title: Очевидный ход
    prompt: Ферзь чёрных стоит под боем ладьи. Забери его быстро, не раздумывая.
    fen: 6k1/5ppp/8/3q4/8/8/5PPP/3R2K1 w - - 0 1
    answers: [d1d5]
    hints:
      piece: Бери ладьёй, она стоит на d1.
      idea: Ферзь стоит на той же вертикали, и его никто не защищает.
    success: Правильно, и очень быстро! Такие ходы нужно делать без долгих раздумий.
    oops: Тут всё просто. Ладья смотрит прямо на ферзя по вертикали.
    successArrows:
      - { from: d1, to: d5, color: sun }

  - type: quiz
    question: Над каким ходом стоит думать дольше всего?
    options:
      - text: Над первым ходом пешкой в дебюте
        correct: false
        explanation: Дебютные ходы лучше знать заранее, чтобы не тратить на них время.
      - text: Над взятием ферзя, который стоит без защиты
        correct: false
        explanation: Это очевидный ход, на него лучше потратить секунды.
      - text: Над тем, где есть шахи, жертвы или опасность для короля
        correct: true
        explanation: Да! В острых позициях легко ошибиться, поэтому там время стоит тратить.

  - type: quiz
    question: У тебя осталась минута, а у соперника пять. Какой совет лучше?
    options:
      - text: Думать долго над каждым ходом, чтобы не ошибиться
        correct: false
        explanation: Так время закончится быстрее. Лучше играть простыми ходами.
      - text: Играть быстро и безопасно, не пытаясь придумывать сложное
        correct: true
        explanation: Да! Без времени сложные планы опаснее. Простые ходы держат позицию.
      - text: Сразу предложить ничью
        correct: false
        explanation: Можно, но соперник может отказаться. Сначала постарайся играть быстро и надёжно.

  - type: quiz
    question: Почему не стоит долго думать над первыми ходами дебюта?
    options:
      - text: Их можно выучить, а время лучше сохранить на середину партии
        correct: true
        explanation: Да! Знакомые ходы дебюта экономят время для трудных решений позже.
      - text: Потому что они не важны
        correct: false
        explanation: Дебют важен, но его ходы можно знать заранее и не думать о них долго.
      - text: Потому что соперник всё равно ошибётся
        correct: false
        explanation: На ошибки соперника рассчитывать нельзя. Лучше сберечь время для сложных мест.
