id: mates-queen
track: mates
order: 1
access: free
piece: q
title: Мат ферзём в один ход
summary: Ферзь самая сильная фигура для мата. Научись искать мат в один ход.
minutes: 6
steps:
  - type: text
    title: Как ферзь ставит мат
    body: >-
      Ферзь ставит мат чаще всего. Чтобы мат получился, нужно три вещи: ферзь даёт шах, королю некуда уйти, и ферзя нельзя взять. Поэтому ферзь часто ставят рядом с королём, но под защитой другой фигуры.
    pointsTitle: Проверь три условия
    points:
      - Ферзь даёт шах королю
      - Все клетки вокруг короля закрыты ферзём, фигурами или собственными пешками
      - Ферзя нельзя побить, или он защищён
    remember: Перед каждым шахом ферзём спрашивай себя, куда пойдёт король.

  - type: move
    title: Мат на последней горизонтали
    prompt: Чёрный король закрыт собственными пешками. Поставь мат ферзём.
    fen: 6k1/5ppp/8/8/8/8/8/3QK3 w - - 0 1
    answers: [d1d8]
    hints:
      piece: Ходи ферзём, он стоит на d1.
      idea: Пройди ферзём по вертикали d до последней горизонтали, на d8.
    success: Мат! Король не может уйти, его закрывают свои же пешки.
    oops: Нужен шах, после которого королю некуда идти. Попробуй зайти на последнюю горизонталь.
    successArrows:
      - { from: d1, to: d8, color: sun }

  - type: move
    title: Мат с помощью короля
    prompt: Ферзь и король против короля. Поставь мат одним ходом.
    fen: k7/8/1K6/8/8/8/8/6Q1 w - - 0 1
    answers: [g1g8]
    hints:
      piece: Ходи ферзём, он стоит на g1.
      idea: Ферзь даёт шах, а белый король закрывает клетки вокруг чёрного. Ищи шах по восьмой горизонтали.
    success: Мат! Белый король помог ферзю закрыть все клетки.
    oops: Нужен шах, после которого королю некуда идти. Король b6 уже закрывает клетки a7 и b7.
    successArrows:
      - { from: g1, to: g8, color: sun }

  - type: move
    title: Мат с поддержкой слона
    prompt: Белые начали с ферзя и слона. Заверши партию.
    fen: r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4
    answers: [h5f7]
    hints:
      piece: Ходи ферзём, он стоит на h5.
      idea: Слон c4 защищает поле f7. Возьми пешку f7 ферзём.
    success: Мат! Слон защищает ферзя, и король не может его взять.
    oops: Посмотри на слабое место чёрных, пешку f7. Её защищает только король.
    successArrows:
      - { from: h5, to: f7, color: sun }

  - type: quiz
    question: Ферзь даёт шах, но король может взять его. Это мат?
    options:
      - text: Да, любой шах ферзём это мат
        correct: false
        explanation: Не любой. Ферзя часто можно взять королём, если он стоит рядом без защиты.
      - text: Нет, ферзь без защиты, король его просто побьёт
        correct: true
        explanation: Да! Для мата ферзь должен быть защищён или король не должен его достать.
      - text: Да, потому что ферзь сильнее короля
        correct: false
        explanation: Сила здесь ни при чём. Король бьёт всё, что стоит рядом и не защищено.
