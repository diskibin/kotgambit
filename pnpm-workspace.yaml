# Metro (React Native) does not follow pnpm symlinks, see PLAN.md section 4
nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - turbo@2.11.6
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
