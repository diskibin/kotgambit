id: basics-notation
track: basics
order: 18
access: free
piece: r
title: Как записывают ходы
summary: Короткие значки, с помощью которых читают шахматные книги и разборы партий.
minutes: 6
steps:
  - type: text
    title: Язык шахматных записей
    body: >-
      Каждый ход можно записать буквами и цифрами. Для этого берут букву фигуры и клетку, на
      которую она пошла. Так читают шахматные книги и разборы партий.
    pointsTitle: Как читать запись
    points:
      - 'Кр король, Ф ферзь, Л ладья, С слон, К конь'
      - 'У пешки буквы нет, пишут только клетку, например e4'
      - 'Знак x значит взятие, + значит шах, # значит мат'
      - 'Рокировка записывается как 0-0 и 0-0-0'
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/5N2/PPPPPPPP/RNBQKB1R b KQkq - 1 1
      caption: Конь пошёл на f3. Это записывают как Кf3
    remember: Буква фигуры плюс клетка, куда она пошла.

  - type: quiz
    question: Белый конь пошёл на клетку f3. Как это записать?
    options:
      - text: Кf3
        correct: true
        explanation: Да! К значит конь, а f3 это клетка.
      - text: Сf3
        correct: false
        explanation: Почти! Но С это слон, а у коня буква К.
      - text: f3
        correct: false
        explanation: Так записывают ход пешки, у неё буквы нет. Для коня нужна буква К.

  - type: quiz
    question: Что означает запись Фxh7+?
    options:
      - text: Ферзь берёт на h7 и ставит шах
        correct: true
        explanation: Да! Ф это ферзь, x значит взятие, а плюс значит шах.
      - text: Ферзь ходит на h7 и ставит мат
        correct: false
        explanation: Почти! Мат записывают знаком решётки, а плюс это просто шах.
      - text: Ладья идёт на h7
        correct: false
        explanation: Ладья пишется буквой Л. Буква Ф означает ферзя.

  - type: move
    title: Прочитай запись
    prompt: Сделай ход, записанный как Ла5.
    fen: 4k3/8/8/8/8/8/8/R3K3 w - - 0 1
    answers: [a1a5]
    hints:
      piece: Л значит ладья, она стоит на a1.
      idea: Ладья идёт на клетку a5. Поднимись по вертикали a на четыре клетки.
    success: Ты прочитал запись и сделал ход. Теперь можно читать разборы партий!
    oops: Ла5 значит, что ладья идёт на клетку a5. Поищи её на вертикали a.
    successArrows:
      - { from: a1, to: a5, color: sun }
