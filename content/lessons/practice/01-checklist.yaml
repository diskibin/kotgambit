id: practice-checklist
track: practice
order: 1
access: free
piece: p
title: Три вопроса перед ходом
summary: Простая привычка, которая спасает от глупых зевков.
minutes: 6
steps:
  - type: text
    title: Привычка сильных игроков
    body: >-
      Большинство партий новичков решают не хитрые комбинации, а зевки. Зевок это когда ты просто не заметил угрозу или подставил фигуру. Чтобы их избежать, перед каждым ходом задавай себе три вопроса.
    pointsTitle: Три вопроса
    points:
      - Что хочет сделать соперник своим последним ходом?
      - Какие мои фигуры сейчас висят без защиты?
      - Безопасен ли мой ход, не подставляю ли я что-нибудь?
    remember: Три вопроса занимают десять секунд и спасают целую партию.

  - type: move
    title: Что хочет соперник
    prompt: >-
      Белые поставили ферзя на h5, и они целятся в слабое поле f7. Защитись от мата одним из ходов.
    fen: r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3
    answers: [g7g6, d8e7, d8f6, g8h6]
    hints:
      piece: Подумай про пешку f7, на неё нападают ферзь и слон.
      idea: Либо защити f7, либо прогони ферзя. Например, пешкой g6 или ферзём на e7.
    success: Хорошо! Ты заметил угрозу мата на f7 и вовремя защитился.
    oops: Ферзь и слон целятся в f7, и мат уже рядом. Защити эту клетку или прогони ферзя.
    successArrows:
      - { from: h5, to: f7, color: sun }

  - type: quiz
    question: Какая из белых фигур висит, то есть нападена и не защищена?
    board:
      fen: 4k3/8/8/8/1b6/2N5/8/3R2K1 b - - 0 1
      caption: Чёрный слон нападает на коня
    options:
      - text: Конь c3
        correct: true
        explanation: Да! Слон нападает на коня, а защитить его некому. Конь висит.
      - text: Ладья d1
        correct: false
        explanation: Ладью никто не атакует, она в безопасности.
      - text: Король g1
        correct: false
        explanation: Король не под шахом, и его никто не атакует.

  - type: move
    title: Спаси коня
    prompt: Твой конь на c3 под боем. Уведи его в безопасное место.
    fen: 4k3/8/8/8/1b6/2N5/8/3R2K1 w - - 0 1
    answers: [c3d5, c3e4, c3b5, c3a4, c3e2]
    hints:
      piece: Ходи конём, он стоит на c3.
      idea: Найди клетку, где слон его не достанет. Например, d5, оттуда конь ещё и нападает на слона.
    success: Хорошо! Конь ушёл из-под боя, а ты ничего не потерял.
    oops: Конь пока остаётся под боем слона. Уведи его на клетку, куда слон не достаёт.
    successArrows:
      - { from: c3, to: d5, color: sun }

  - type: quiz
    question: Белые хотят взять ферзём пешку a7. Хороший ли это ход?
    board:
      fen: r3k3/p7/8/8/3Q4/8/8/4K3 w - - 0 1
      caption: Ладья a8 защищает пешку a7
    options:
      - text: Да, пешка бесплатная
        correct: false
        explanation: Пешка защищена ладьёй, и ферзь пропадёт за неё.
      - text: Да, потому что ферзь сильнее
        correct: false
        explanation: Сила фигуры не спасёт, если на её клетку можно взять и потерять ферзя за пешку.
      - text: Нет, ладья возьмёт ферзя за пешку
        correct: true
        explanation: Да! Проверка безопасности хода спасла бы ферзя. Пешка защищена.
