id: basics-principles
track: basics
order: 17
access: free
piece: n
title: Три принципа начала партии
summary: Центр, развитие фигур и безопасность короля помогают не запутаться в дебюте.
minutes: 6
steps:
  - type: text
    title: Что делать в начале партии
    body: >-
      Даже если ты не знаешь ни одного дебюта, три простых принципа помогут хорошо начать
      партию. Они работают всегда и у любого игрока.
    pointsTitle: Три принципа
    points:
      - Займи центр пешками, ведь из центра фигуры достают дальше
      - Выведи коней и слонов, пока ладьи и ферзь могут подождать
      - Спрячь короля рокировкой
    board:
      fen: r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3
      caption: Белые заняли центр пешкой e4 и вывели коня на f3
    remember: Центр, развитие, король в безопасности.

  - type: move
    title: Выведи коня
    prompt: Выведи белого коня на хорошее поле, ближе к центру.
    fen: rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
    answers: [g1f3, b1c3]
    hints:
      piece: Ходи конём, их у тебя два, на b1 и на g1.
      idea: Конь с края доски почти бесполезен. Выведи его на f3 или c3, откуда он смотрит на центр.
    success: Конь вышел в игру и смотрит на центр. Отличный ход!
    oops: Конь пока далеко от центра. Выведи его на клетку, откуда он смотрит на середину доски.
    successArrows:
      - { from: g1, to: f3, color: sun }

  - type: quiz
    question: Что полезнее сделать в начале партии?
    options:
      - text: Вывести слона или коня
        correct: true
        explanation: Да! Чем больше фигур в игре, тем сильнее позиция.
      - text: Много раз пойти одной и той же фигурой
        correct: false
        explanation: Почти! Но тогда остальные фигуры отстанут. Лучше выводить новые.
      - text: Сразу выпустить ферзя в атаку
        correct: false
        explanation: Смелый план! Но одинокого ферзя быстро прогонят, и ты потеряешь время.

  - type: quiz
    question: Зачем в дебюте нужна рокировка?
    options:
      - text: Прячет короля и выводит ладью в игру
        correct: true
        explanation: Да! Один ход решает сразу две задачи.
      - text: Она выигрывает фигуру
        correct: false
        explanation: Фигуры она не берёт. Зато делает короля безопаснее.
      - text: Она нужна, чтобы сделать ход пешкой
        correct: false
        explanation: С пешками рокировка не связана. Король и ладья меняются местами.
