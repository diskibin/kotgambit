id: strategy-passed-pawn
track: strategy
order: 6
access: free
piece: p
title: Проходная пешка
summary: Пешка, перед которой нет чужих пешек, опасна для соперника.
minutes: 6
steps:
  - type: text
    title: Путь к ферзю свободен
    body: >-
      Проходная пешка это пешка, на пути которой нет чужих пешек ни на её вертикали, ни на
      соседних. Остановить её могут только фигуры. Чем дальше пешка продвинулась, тем она
      опаснее, ведь до превращения остаётся всё меньше клеток.
    pointsTitle: Как играть с проходной пешкой
    points:
      - Сначала убедись, что пешка действительно проходная
      - Поддержи её фигурами или королём
      - Соперник старается поставить фигуру перед ней, это называется блокадой
    board:
      fen: 4k3/pp4pp/8/4P3/8/8/PP3PPP/4K3 w - - 0 1
      caption: Пешка e5 проходная, впереди неё нет чёрных пешек на вертикалях d, e и f
    remember: Проходная пешка нужна для победы, но ей нужна поддержка.

  - type: find-squares
    title: Найди проходную пешку
    prompt: Отметь белую пешку, которую не остановят чёрные пешки.
    fen: 4k3/pp4pp/8/4P3/8/8/PP3PPP/4K3 w - - 0 1
    squares: [e5]
    success: Верно! Перед пешкой e5 нет чёрных пешек на d, e и f, она проходная.
    oops: Проверь вертикали пешки и соседние с ними. У проходной пешки там нет чужих пешек впереди.
    hint: Это пешка в центре доски, далеко продвинувшаяся вперёд.

  - type: quiz
    question: Почему проходная пешка опасна?
    options:
      - text: Только фигуры могут её остановить, и она идёт к превращению
        correct: true
        explanation: Да! Чужие пешки на пути не мешают, и пешка может стать ферзём.
      - text: Потому что она сильнее других пешек
        correct: false
        explanation: Она ходит как все пешки, но ей не мешают чужие пешки.
      - text: Потому что её нельзя взять
        correct: false
        explanation: Её можно взять, как и любую пешку. Но защитить свои пешки соперник уже не успел.

  - type: quiz
    question: Как соперник чаще всего борется с проходной пешкой?
    options:
      - text: Ставит фигуру перед пешкой, это блокада
        correct: true
        explanation: Да! Блокирующая фигура держит пешку на месте. Твоя задача её выгнать или обойти.
      - text: Просто смотрит и ждёт
        correct: false
        explanation: Ждать он не будет, ведь пешка скоро превратится.
      - text: Предлагает ничью
        correct: false
        explanation: Предложить можно, но ты не обязан соглашаться, если у тебя проходная пешка.
