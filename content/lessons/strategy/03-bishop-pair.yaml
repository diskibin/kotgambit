id: strategy-bishop-pair
track: strategy
order: 3
access: free
piece: b
title: Пара слонов
summary: Два слона вместе контролируют клетки обоих цветов и очень сильны.
minutes: 6
steps:
  - type: text
    title: Два слона лучше, чем один
    body: >-
      У каждого слона свой цвет клеток. Если у тебя оба слона, ты нападаешь на клетки и светлые,
      и тёмные, а у соперника такого простора нет. Преимущество пары слонов особенно заметно,
      когда на доске становится просторнее.
    pointsTitle: Почему пара слонов сильна
    points:
      - Слоны дополняют друг друга и контролируют клетки обоих цветов
      - Они сильнее всего в открытой позиции
      - Соперник не может спрятаться на клетках одного цвета
    board:
      fen: 1n2k3/pp3ppp/2b5/8/8/8/PP3PPP/2B1KB2 w - - 0 1
      caption: У белых два слона против слона и коня
    remember: Пара слонов это ценное преимущество, даже когда пешек поровну.

  - type: quiz
    question: Чем хороша пара слонов?
    options:
      - text: Слоны вместе нападают на клетки обоих цветов
        correct: true
        explanation: Да! Один слон ходит по светлым клеткам, другой по тёмным, и вместе они покрывают всю доску.
      - text: Они вдвое сильнее ферзя
        correct: false
        explanation: Нет, но вместе они действительно очень эффективны.
      - text: Они не боятся пешек
        correct: false
        explanation: Пешки им мешают. Особенно сильны они, когда пешек немного.

  - type: quiz
    question: В какой позиции пара слонов раскрывается лучше всего?
    options:
      - text: В открытой, когда пешек немного
        correct: true
        explanation: Да! Свободные диагонали делают слонов опасными.
      - text: В закрытой, когда всё заперто
        correct: false
        explanation: Тогда диагонали закрыты, и слоны слабеют.
      - text: Когда ферзи на доске, а пешек много
        correct: false
        explanation: Пешки мешают слонам. Им нужно больше простора.

  - type: quiz
    question: Соперник может поменять твоего слона на коня. Стоит ли соглашаться, если у тебя пара слонов?
    options:
      - text: Лучше не торопиться, пара слонов ценнее
        correct: true
        explanation: Да! Если можешь, сохрани пару слонов, особенно в открытой позиции.
      - text: Нужно соглашаться, ведь конь не хуже
        correct: false
        explanation: Конь не хуже, но пары слонов у тебя уже не будет, а она ценна.
      - text: Нужно отказаться и сдаться
        correct: false
        explanation: Сдаваться рано. Просто взвесь, что для тебя важнее.
