id: middlegame-double-attack
track: middlegame
order: 4
access: free
piece: q
title: Двойной удар
summary: Ферзь и другие дальнобойные фигуры тоже умеют нападать на две цели сразу.
minutes: 6
steps:
  - type: text
    title: Не только конь
    body: >-
      Двойной удар это вилка, которую ставят не конём, а ферзём, ладьёй, слоном или пешкой. Принцип тот же, одна фигура нападает на две, и соперник успевает спасти только одну. Особенно сильны удары, при которых одна из целей король, ведь на шах надо отвечать сразу.
    pointsTitle: Где искать двойной удар
    points:
      - Ферзь ходит и по прямым, и по диагонали, поэтому у него много шансов
      - Ищи фигуры соперника без защиты
      - Шах заставляет соперника ответить, а потом ты забираешь вторую цель
    board:
      fen: 4k2b/8/8/7Q/8/8/8/4K3 b - - 1 1
      arrows:
        - { from: h5, to: e8, color: sun }
        - { from: h5, to: h8, color: sun }
      caption: Ферзь h5 нападает и на короля, и на слона h8
    remember: Шах плюс вторая цель, и соперник теряет фигуру.

  - type: demo
    title: Гамбит показывает двойной удар
    body: Смотри, как ферзь ставит шах и забирает слона.
    fen: 4k2b/8/8/8/8/8/8/3QK3 w - - 0 1
    moves: [d1h5, e8d7, h5h8]

  - type: move
    title: Сделай двойной удар
    prompt: Сходи ферзём так, чтобы он поставил шах и напал на слона h8.
    fen: 4k2b/8/8/8/8/8/8/3QK3 w - - 0 1
    answers: [d1h5]
    hints:
      piece: Ходи ферзём, он стоит на d1.
      idea: Найди клетку, откуда ферзь видит и короля e8, и слона h8. Ферзь пойдёт по диагонали.
    success: Двойной удар! Король под шахом, а слон остаётся без защиты. Отличный ход!
    oops: Ферзь пока нападает только на одну цель. Ищи клетку, откуда он видит и короля, и слона.
    successArrows:
      - { from: d1, to: h5, color: sun }

  - type: quiz
    question: Чем двойной удар отличается от вилки?
    options:
      - text: Двойной удар ставят только двумя фигурами
        correct: false
        explanation: Почти! Но нападает одна фигура. Просто цели у неё две.
      - text: Ничем, просто его ставит не конь, а другая фигура
        correct: true
        explanation: Да! Идея та же, одна фигура нападает на две цели.
      - text: Это ход, которым ты берёшь две фигуры
        correct: false
        explanation: Фигуру ты берёшь следующим ходом, а двойной удар её только подготавливает.
