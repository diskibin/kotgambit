id: basics-capture
track: basics
order: 9
access: free
piece: n
title: Взятие
summary: Как забрать фигуру соперника и почему не стоит торопиться.
minutes: 5
steps:
  - type: text
    title: Как брать фигуры
    body: >-
      Чтобы взять фигуру, поставь свою на её клетку. Взятая фигура уходит с доски навсегда. Берут фигуры так же, как ходят, а пешка берёт по диагонали.
    pointsTitle: Прежде чем брать, проверь
    points:
      - Ты можешь дойти до этой фигуры по своим правилам
      - Путь до неё свободен
      - Твою фигуру на новом месте не заберут в ответ
    board:
      fen: 4k3/8/8/8/3r4/8/8/3RK3 w - - 0 1
      arrows:
        - { from: d1, to: d4, color: sun }
      caption: Белая ладья может взять чёрную ладью на d4
    remember: Брать не обязательно, смотри, что будет после.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: ладья встаёт на клетку чужой ладьи и забирает её.'
    fen: 4k3/8/8/8/3r4/8/8/3RK3 w - - 0 1
    moves: [d1d4]

  - type: move
    title: Возьми фигуру
    prompt: Возьми белым слоном чёрного коня.
    fen: 4k3/8/5n2/8/3B4/8/8/4K3 w - - 0 1
    answers: [d4f6]
    hints:
      piece: Бери слоном, он стоит на d4.
      idea: Конь стоит на одной диагонали со слоном, через клетку e5.
    success: Конь взят! Слон встал на его место.
    oops: Слон берёт по диагонали. Посмотри, на какой диагонали стоит чёрный конь.
    successArrows:
      - { from: d4, to: f6, color: sun }

  - type: quiz
    question: Какую фигуру может взять белая ладья?
    board:
      fen: 4k3/8/8/n7/2b5/8/8/R3K3 w - - 0 1
    options:
      - text: Слона на c4
        correct: false
        explanation: Почти! Но ладья ходит по прямым, а слон стоит на диагонали от неё.
      - text: Коня на a5
        correct: true
        explanation: Да! Он на одной вертикали с ладьёй, и путь свободен.
      - text: Обе фигуры
        correct: false
        explanation: Хотелось бы, но ладья бьёт только по вертикали и горизонтали. Слон ей недоступен.
