id: middlegame-making-a-plan
track: middlegame
order: 12
access: free
piece: k
title: Как составить план
summary: Хороший ход начинается с вопроса, чего я хочу добиться.
minutes: 7
steps:
  - type: text
    title: Сначала оцени, потом решай
    body: >-
      В миттельшпиле нет готовых ходов, как в дебюте, поэтому нужен план. Он состоит из трёх вопросов, и их стоит задавать перед каждым ходом. Так ты не ходишь наугад.
    pointsTitle: Три вопроса
    points:
      - Что происходит на доске? Посмотри на фигуры, пешки и королей обеих сторон
      - Чего хочет соперник? Найди его угрозы
      - Чего хочу я? Выбери цель, например занять открытую линию или напасть на слабую пешку
    board:
      fen: 6k1/pp3ppp/8/8/8/8/PP3PPP/3R2K1 w - - 0 1
      arrows:
        - { from: d1, to: d7, color: sun }
      caption: Открытая вертикаль d есть, а целей для ладьи у чёрных на седьмой горизонтали много
    remember: Оцени позицию, найди угрозы, выбери цель.

  - type: move
    title: Выполни план
    prompt: План такой, занять открытую вертикаль d и проникнуть на седьмую горизонталь. Сходи ладьёй на d7.
    fen: 6k1/pp3ppp/8/8/8/8/PP3PPP/3R2K1 w - - 0 1
    answers: [d1d7]
    hints:
      piece: Ходи ладьёй, она стоит на d1.
      idea: Вертикаль d открыта, и ладья может проехать по ней до самой седьмой горизонтали.
    success: Ладья на седьмой горизонтали! Она нападает сразу на две пешки.
    oops: По плану нужна седьмая горизонталь. Проедь ладьёй по открытой вертикали d.
    successArrows:
      - { from: d1, to: d7, color: sun }

  - type: quiz
    question: На какие пешки теперь нападает ладья?
    board:
      fen: 6k1/pp1R1ppp/8/8/8/8/PP3PPP/6K1 b - - 1 1
    options:
      - text: На a7 и h7
        correct: false
        explanation: Почти! Но пешка b7 закрывает от ладьи пешку a7, а f7 закрывает h7.
      - text: На b7 и f7
        correct: true
        explanation: Да! Ладья на седьмой горизонтали нападает на пешки в обе стороны.
      - text: На g7 и h7
        correct: false
        explanation: Пешка f7 стоит на пути, и до g7 ладья не дотянется.

  - type: quiz
    question: Что нужно сделать перед выбором хода в миттельшпиле?
    options:
      - text: Оценить позицию и найти угрозы соперника
        correct: true
        explanation: Да! Только тогда ты понимаешь, чего хочешь добиться.
      - text: Сразу пойти фигурой в атаку
        correct: false
        explanation: Смело! Но без оценки позиции легко пропустить угрозу.
      - text: Повторить ход соперника
        correct: false
        explanation: Копировать соперника не всегда получается. Сначала составь свой план.
