id: openings-repertoire
track: openings
order: 14
access: free
piece: k
title: 'Как выбрать свой репертуар'
summary: 'Три-четыре дебюта хорошо знать полезнее, чем много дебютов поверхностно.'
minutes: 5
steps:
  - type: text
    title: 'Не учи всё сразу'
    body: >-
      Дебютов в шахматах очень много, но начинающему не нужно знать их все. Лучше выбрать несколько и
      играть их постоянно. Так ты узнаешь типичные позиции, идеи и ловушки и будешь чувствовать себя
      уверенно уже с первых ходов.
    pointsTitle: 'Из чего состоит репертуар'
    points:
      - 'Один дебют за белых'
      - 'Один ответ на 1.e4 за чёрных'
      - 'Один ответ на 1.d4 за чёрных'
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      caption: 'Твоя игра начинается здесь, и важно знать, как отвечать'
    remember: 'Лучше знать один дебют хорошо, чем десять поверхностно.'

  - type: quiz
    question: 'Ты хочешь играть за белых. С чего лучше начать?'
    options:
      - text: 'С одного простого дебюта, который ты будешь повторять'
        correct: true
        explanation: 'Да! Постоянство помогает понять идеи и быстро находить ходы.'
      - text: 'С самой сложной теории, чтобы удивить соперников'
        correct: false
        explanation: 'Сложная теория трудно запоминается и редко помогает новичку.'
      - text: 'С разных дебютов в каждой партии'
        correct: false
        explanation: 'Так ты не поймёшь ни один дебют до конца.'

  - type: quiz
    question: 'Что лучше выучить кроме ходов дебюта?'
    options:
      - text: 'Идеи, то есть зачем делается каждый ход'
        correct: true
        explanation: 'Да! Если ты понимаешь идею, соперник не собьёт тебя необычным ходом.'
      - text: 'Только последовательность ходов'
        correct: false
        explanation: 'Ходы без идей забываются. Лучше понимать, зачем они.'
      - text: 'Только ловушки'
        correct: false
        explanation: 'Ловушки полезны, но нужно понимать и обычную игру.'

  - type: quiz
    question: 'Соперник сыграл не по книге. Что делать?'
    options:
      - text: 'Развивать фигуры, занимать центр и проверять угрозы'
        correct: true
        explanation: 'Да! Общие принципы работают, даже когда теория закончилась.'
      - text: 'Растеряться и сдаться'
        correct: false
        explanation: 'Не нужно. Общие принципы дебюта помогут в любой позиции.'
      - text: 'Повторять ходы соперника'
        correct: false
        explanation: 'Так можно попасть в беду. Играй по принципам.'
