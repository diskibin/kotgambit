id: mates-epaulette
track: mates
order: 6
access: free
piece: q
title: Мат эполетами
summary: Король между двумя ладьями сам закрывает себе путь.
minutes: 6
steps:
  - type: text
    title: Король и две ладьи рядом
    body: >-
      Мат эполетами получается, когда король стоит на последней горизонтали, а по бокам от него
      свои ладьи. Эти ладьи как эполеты на плечах. Ферзь даёт шах спереди, и королю некуда
      уйти, ведь с боков стоят свои фигуры.
    pointsTitle: Как выглядит мат эполетами
    points:
      - Король на e8, ладьи на d8 и f8
      - Ферзь даёт шах по вертикали или с поля e6
      - Клетки d7, e7 и f7 попадают под удар ферзя
    board:
      fen: 3rkr2/8/8/8/8/7Q/8/4K3 w - - 0 1
      arrows:
        - { from: h3, to: e6, color: sun }
      caption: Ферзь идёт на e6, ладьи закрывают королю путь
    remember: Если по бокам от короля стоят свои ладьи, он легко попадает под мат спереди.

  - type: move
    title: Поставь мат эполетами
    prompt: Ладьи закрывают королю путь по бокам. Поставь мат ферзём.
    fen: 3rkr2/8/8/8/8/7Q/8/4K3 w - - 0 1
    answers: [h3e6]
    hints:
      piece: Ходи ферзём, он стоит на h3.
      idea: Ферзь на e6 даёт шах по вертикали e и закрывает клетки d7, e7 и f7.
    success: Мат! Королю не уйти, а ладьи не могут взять ферзя.
    oops: Нужен шах по вертикали e с клетки, которая закрывает все соседние клетки. Это e6.
    successArrows:
      - { from: h3, to: e6, color: sun }

  - type: quiz
    question: Почему в мате эполетами король не может уйти в стороны?
    options:
      - text: По бокам стоят его же ладьи
        correct: true
        explanation: Да! Свои фигуры занимают клетки, и король не может на них встать.
      - text: Потому что ферзь бьёт по всей доске
        correct: false
        explanation: Ферзь закрывает клетки впереди, а в стороны король не идёт из-за своих ладей.
      - text: Потому что король не ходит вбок
        correct: false
        explanation: Король ходит на любую соседнюю клетку, но по бокам стоят его ладьи.
