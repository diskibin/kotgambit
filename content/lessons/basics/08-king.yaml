id: basics-king
track: basics
order: 8
access: free
piece: k
title: Как ходит король
summary: Король ходит на одну клетку, но не может встать под бой.
minutes: 5
steps:
  - type: text
    title: Король ходит на одну клетку
    body: >-
      Король ходит на одну клетку в любую сторону: вперёд, назад, вбок и по диагонали. Он самая
      важная фигура, ведь если короля поймают, партия закончится.
    board:
      fen: 4k3/8/8/8/3K4/8/8/8 w - - 0 1
      arrows:
        - { from: d4, to: d5, color: sky }
        - { from: d4, to: e5, color: sun }
      caption: Король на d4 может сделать шаг на любую соседнюю клетку
    remember: Король ходит медленно, зато он главный.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: король делает один шаг по диагонали.'
    fen: 4k3/8/8/8/3K4/8/8/8 w - - 0 1
    moves: [d4e5]

  - type: move
    title: Сходи королём
    prompt: Сходи королём с d4 на клетку c5.
    fen: 4k3/8/8/8/3K4/8/8/8 w - - 0 1
    answers: [d4c5]
    hints:
      piece: Ходи королём, он стоит на d4.
      idea: Клетка c5 стоит рядом с королём, на одну клетку вверх и влево.
    success: Один шаг, и король на новом месте. Отличный ход!
    oops: Король ходит только на соседнюю клетку. Попробуй шагнуть вверх и влево.
    successArrows:
      - { from: d4, to: c5, color: sun }

  - type: find-squares
    title: Куда пойдёт король
    prompt: Отметь все клетки, куда белый король может пойти без опаски.
    fen: 7k/8/8/8/4r3/8/8/3K4 w - - 0 1
    movesOf: d1
    squares: [c1, c2, d2]
    success: Верно! Чёрная ладья держит под боем вертикаль e, и королю туда нельзя.
    oops: Не страшно. Король не может встать на клетку, которую бьёт фигура соперника. Проверь вертикаль e.
    hint: Посмотри, какие клетки рядом с королём бьёт ладья. На них он ходить не может.

  - type: quiz
    question: Может ли король встать на клетку, которую бьёт фигура соперника?
    options:
      - text: Нет, такой ход запрещён
        correct: true
        explanation: Да! Король не ходит под шах, поэтому такие клетки для него закрыты.
      - text: Да, если очень надо
        correct: false
        explanation: Было бы удобно, но нет. Король никогда не может встать под бой.
      - text: Да, но только один раз за партию
        correct: false
        explanation: Хитро! Но таких исключений нет, под бой король не ходит вообще.
