id: basics-protection
track: basics
order: 22
access: free
piece: b
title: Защита фигур
summary: Защищённую фигуру нельзя взять даром. Научись видеть защиту.
minutes: 7
steps:
  - type: text
    title: Что значит защищена
    body: >-
      Фигура защищена, когда другая твоя фигура может взять на её клетку, если соперник её
      заберёт. Если защиты нет, фигуру можно забрать даром. Поэтому перед каждым ходом
      проверяй, что висит без защиты, у тебя и у соперника.
    pointsTitle: Как проверить
    points:
      - Найди фигуру, которую хочешь взять
      - Посмотри, не стоит ли рядом фигура, которая её защищает
      - Если защиты нет, фигуру можно взять даром
    board:
      fen: 4k3/8/8/3n4/8/2N5/1B6/4K3 w - - 0 1
      arrows:
        - { from: b2, to: c3, color: mint }
        - { from: c3, to: d5, color: sun }
      caption: Конь c3 защищён слоном b2, а конь d5 никто не защищает
    remember: Фигура без защиты это подарок для того, кто заметит.

  - type: move
    title: Возьми конька
    prompt: Один из чёрных коней не защищён. Возьми его.
    fen: 4k3/8/8/3n4/8/2N5/1B6/4K3 w - - 0 1
    answers: [c3d5]
    hints:
      piece: Бери конём, он стоит на c3.
      idea: Чёрный конь на d5 не защищён, а твой конь его достаёт.
    success: Здорово! Конь d5 был без защиты, и ты забрал его даром.
    oops: Пока ты никого не взял. Ищи фигуру соперника, которую никто не защищает.
    successArrows:
      - { from: c3, to: d5, color: sun }

  - type: move
    title: Выбери верную цель
    prompt: Ферзь может напасть на две чужие фигуры, но одна из них защищена. Возьми ту, что без защиты.
    fen: 4k3/1p6/2n5/8/6b1/8/8/3QK3 w - - 0 1
    answers: [d1g4]
    hints:
      piece: Ходи ферзём, он стоит на d1.
      idea: Конь c6 защищён пешкой b7, а слон g4 никем не защищён.
    success: Верно! Слон g4 был без защиты, и ферзь забрал его даром.
    oops: Не торопись. Одна из фигур под защитой, а другая нет. Бери ту, что без защиты.
    successArrows:
      - { from: d1, to: g4, color: sun }

  - type: quiz
    question: Белый конь может взять пешку e5. Стоит ли это делать?
    board:
      fen: 4k3/8/3p4/4p3/8/2N5/8/4K3 w - - 0 1
      caption: Пешка e5 защищена пешкой d6
    options:
      - text: Нет, пешка защищена, и конь пропадёт за пешку
        correct: true
        explanation: Да! Конь стоит три пешки, а пешка защищена. Такой обмен тебе невыгоден.
      - text: Да, конь заберёт пешку и вернётся
        correct: false
        explanation: Вернуться не получится, пешка d6 возьмёт коня сразу после взятия.
      - text: Не важно, это всё равно ничья
        correct: false
        explanation: Тут не ничья. Ты просто потеряешь фигуру, а получишь всего одну пешку.

  - type: quiz
    question: Какая фигура считается защищённой?
    options:
      - text: Которую другая моя фигура может взять назад
        correct: true
        explanation: Да! Защита это когда за взятием последует ответное взятие.
      - text: Которая стоит рядом с королём
        correct: false
        explanation: Рядом с королём или нет, неважно. Важно, чтобы другая фигура могла взять назад.
      - text: Которая стоит на тёмной клетке
        correct: false
        explanation: Цвет клетки тут ни при чём. Защита зависит от других фигур.
