id: openings-scotch
track: openings
order: 10
access: free
piece: n
title: 'Шотландская партия'
summary: 'Белые сразу открывают центр ходом d4.'
minutes: 6
steps:
  - type: text
    title: 'Открываем центр'
    body: >-
      В шотландской партии белые бьют по центру ходом 3.d4 уже на третьем ходу. После размена пешек
      белый конь оказывается в центре, а открытые линии помогают развитию. Дебют простой, быстрый и
      очень поучительный.
    pointsTitle: 'Идеи шотландской партии'
    points:
      - 'Белые открывают центр и не дают чёрным спокойно развиться'
      - 'Конь стоит на d4 в центре и мешает чёрным фигурам'
      - 'Игра идёт быстро, и важно знать свои первые ходы'
    remember: 'Открытый центр выгоден тому, кто быстрее развил фигуры.'

  - type: demo
    title: 'Первые ходы'
    body: >-
      Белые играют d4, чёрные берут пешку, и белый конь берёт обратно. Чёрные развивают коня и
      нападают на e4.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, d2d4, e5d4, f3d4, g8f6]

  - type: move
    title: 'Размен на c6'
    prompt: 'Белый конь стоит в центре. Размень его на коня c6, чтобы испортить чёрным пешки.'
    fen: r1bqkb1r/pppp1ppp/2n2n2/8/3NP3/8/PPP2PPP/RNBQKB1R w KQkq - 1 5
    answers: [d4c6]
    hints:
      piece: 'Ходи конём, он стоит на d4.'
      idea: 'Конь берёт коня на c6, и чёрные ответят пешкой b, у них получатся сдвоенные пешки.'
    success: 'Размен нужен, чтобы испортить чёрным пешечную структуру. Теперь у них сдвоенные пешки.'
    oops: 'Нужно взять коня на c6. Это хороший размен в шотландской партии.'
    successArrows:
      - { from: d4, to: c6, color: sun }

  - type: demo
    title: 'Атака на коня'
    body: >-
      Белые двигают пешку e5 и прогоняют чёрного коня, потом ставят ферзя на e2. Чёрные получают
      сдвоенные пешки, но могут быстро развиваться.
    fen: r1bqkb1r/p1pp1ppp/2p2n2/8/4P3/8/PPP2PPP/RNBQKB1R w KQkq - 0 6
    moves: [e4e5, d8e7, d1e2, f6d5, c2c4, c8a6]

  - type: quiz
    question: 'Зачем белые играют 3.d4 в шотландской партии?'
    options:
      - text: 'Открыть центр и быстро развить фигуры'
        correct: true
        explanation: 'Да! Открытые линии помогают белым вывести фигуры раньше чёрных.'
      - text: 'Защитить пешку e4'
        correct: false
        explanation: 'Пешку e4 защищают другими способами. Ход d4 открывает центр.'
      - text: 'Приготовить длинную рокировку'
        correct: false
        explanation: 'Рокировка тут ни при чём. Белые хотят открыть центр.'
