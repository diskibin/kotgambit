id: middlegame-pawn-structure
track: middlegame
order: 9
access: free
piece: p
title: Пешечная структура
summary: Пешки определяют характер партии, так что полезно уметь их читать.
minutes: 6
steps:
  - type: text
    title: Пешки это скелет позиции
    body: >-
      Пешки не возвращаются назад, поэтому их расположение надолго определяет, где и как играть.
      Вот три вида пешек, которые стоит узнавать с первого взгляда.
    pointsTitle: Три вида пешек
    points:
      - Сдвоенные, две пешки одного цвета на одной вертикали, они мешают друг другу
      - Изолированная, у неё нет соседних пешек на соседних вертикалях, и её труднее защитить
      - Проходная, перед ней на её вертикали и на соседних нет пешек соперника
    board:
      fen: 4k3/pp5p/8/3P4/8/8/PP4PP/4K3 w - - 0 1
      arrows:
        - { from: d5, to: d8, color: sun }
      caption: Пешка d5 проходная, ей никто не мешает дойти до края
    remember: Проходная пешка сильна, а изолированная и сдвоенные слабы.

  - type: quiz
    question: Как называются пешки c2 и c3 белых?
    board:
      fen: 4k3/8/8/8/8/2P5/2P5/4K3 w - - 0 1
    options:
      - text: Сдвоенные
        correct: true
        explanation: Да! Две пешки одного цвета на одной вертикали мешают друг другу.
      - text: Проходные
        correct: false
        explanation: Проходная пешка это та, перед которой нет пешек соперника. А тут речь о двух пешках на одной вертикали.
      - text: Изолированные
        correct: false
        explanation: Изолированные пешки стоят без соседей. А эти стоят друг за другом.

  - type: quiz
    question: Какая пешка белых изолированная?
    board:
      fen: 4k3/8/8/8/3P4/8/PP3PPP/4K3 w - - 0 1
    options:
      - text: Пешка d4
        correct: true
        explanation: Да! На вертикалях c и e у белых пешек нет, так что d4 никто не защитит.
      - text: Пешка a2
        correct: false
        explanation: Почти! У неё рядом пешка b2, так что она не одна.
      - text: Пешка g2
        correct: false
        explanation: Рядом с ней стоят пешки f2 и h2, значит она не изолированная.

  - type: move
    title: Двинь проходную пешку
    prompt: Пешка d5 проходная, и ей никто не мешает. Продвинь её на d6.
    fen: 4k3/pp5p/8/3P4/8/8/PP4PP/4K3 w - - 0 1
    answers: [d5d6]
    hints:
      piece: Ходи пешкой, она стоит на d5.
      idea: Перед пешкой нет чёрных пешек, и она может идти вперёд на шаг.
    success: Проходная пешка шагает вперёд. Она нужна, чтобы дойти до края и стать ферзём!
    oops: Нам нужна пешка d5, ведь она проходная. Сделай ей шаг вперёд.
    successArrows:
      - { from: d5, to: d6, color: sun }
