id: basics-bishop
track: basics
order: 5
access: free
piece: b
title: Как ходит слон
summary: Слон скользит по диагонали и всю партию остаётся на клетках одного цвета.
minutes: 5
steps:
  - type: text
    title: Слон ходит по диагонали
    body: >-
      Слон ходит по диагонали на любое число клеток. Как и ладья, он не прыгает через фигуры:
      если на пути стоит другая фигура, слон останавливается.
    board:
      fen: 4k3/8/8/8/3B4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: a7, color: sky }
        - { from: d4, to: g7, color: sun }
      caption: Слон на d4 может скользить по двум диагоналям
    remember: Слон ходит только по диагонали и никогда не меняет цвет клеток.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: слон пролетает через три клетки по диагонали одним ходом.'
    fen: 4k3/8/8/8/3B4/8/8/4K3 w - - 0 1
    moves: [d4g7]

  - type: move
    title: Сходи слоном
    prompt: Сходи слоном с d4 на клетку a7.
    fen: 4k3/8/8/8/3B4/8/8/4K3 w - - 0 1
    answers: [d4a7]
    hints:
      piece: Ходи слоном, он стоит на d4.
      idea: Слон едет по диагонали вверх и влево, до самого края доски.
    success: Слон скользит по диагонали, как по льду. Отличный ход!
    oops: Слон ходит только по диагонали. Попробуй подняться вверх и влево и давай ещё раз.
    successArrows:
      - { from: d4, to: a7, color: sun }

  - type: find-squares
    title: Куда пойдёт слон
    prompt: Отметь все клетки, куда может пойти белый слон.
    fen: 4k3/8/8/8/8/4P3/8/2B1K3 w - - 0 1
    movesOf: c1
    squares: [d2, b2, a3]
    success: Верно! Свою пешку на e3 слон не прыгает, поэтому дальше d2 ему не пройти.
    oops: Не страшно. Слон едет по диагонали, пока его не остановит край доски или другая фигура.
    hint: У слона на c1 две диагонали. Одна упирается в пешку, другая идёт к краю доски.

  - type: quiz
    question: Слон стоит на тёмной клетке c1. На какие клетки он сможет пойти за всю партию?
    board:
      fen: 4k3/8/8/8/8/8/8/2B1K3 w - - 0 1
    options:
      - text: Только на тёмные
        correct: true
        explanation: Да! Диагональ не меняет цвет клеток, поэтому слон всегда остаётся на своём цвете.
      - text: Только на светлые
        correct: false
        explanation: Почти! Но по диагонали слон попадает на клетки того же цвета, на котором стоит.
      - text: На любые
        correct: false
        explanation: Было бы удобно, но нет. Каждый слон верен одному цвету клеток, поэтому у тебя их два.
