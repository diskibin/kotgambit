id: basics-trades
track: basics
order: 23
access: free
piece: q
title: Размены
summary: Когда обмен фигур выгоден, а когда его лучше избегать.
minutes: 6
steps:
  - type: text
    title: Что такое размен
    body: >-
      Размен это когда одна фигура берёт другую, и тут же берут её саму. Каждая сторона теряет по фигуре. Если фигуры стоят одинаково, размен равный. Смотри, как слон берёт коня, а пешка берёт слона.
    board:
      fen: 4k3/1p6/2n5/1B6/8/8/8/4K3 w - - 0 1
      arrows:
        - { from: b5, to: c6, color: sun }
        - { from: b7, to: c6, color: mint }
      caption: Слон берёт коня, пешка берёт слона, получился равный размен
    remember: Размен меняет фигуру на фигуру, а выгоду решает ценность того, что обменяли.

  - type: demo
    title: Гамбит показывает размен
    body: Слон за коня, три за три. Равный размен.
    fen: 4k3/1p6/2n5/1B6/8/8/8/4K3 w - - 0 1
    moves: [b5c6, b7c6]

  - type: text
    title: Когда размен выгоден
    body: >-
      Размен нужен не всегда. Если ты впереди по материалу, меняй фигуры, потому что преимущество растёт. Если ты отстал, лучше сохранять фигуры, чтобы у тебя были шансы.
    pointsTitle: Подумай о размене
    points:
      - Если ты выше по материалу, меняй фигуры
      - Если ты ниже по материалу, избегай размена
      - Меняй сильную фигуру соперника на свою слабую
      - Не меняй, если после обмена потеряешь защиту короля
    remember: Лидер меняет, отстающий усложняет.

  - type: move
    title: Размен, когда ты впереди
    prompt: >-
      У тебя лишняя ладья. Меняй ферзей, и преимущество станет ещё заметнее.
    fen: 3qk3/8/8/8/8/8/8/R2QK3 w - - 0 1
    answers: [d1d8]
    hints:
      piece: Ходи ферзём, он стоит на d1.
      idea: Возьми чёрного ферзя на d8, это шах. Королю придётся взять ферзя в ответ.
    success: Отлично! Ферзи ушли, а лишняя ладья осталась у тебя.
    oops: Подумай про размен. Ферзи стоят друг напротив друга на вертикали d.
    successArrows:
      - { from: d1, to: d8, color: sun }

  - type: quiz
    question: Ты выиграл ладью, и соперник предлагает поменять ферзей. Что лучше?
    options:
      - text: Отказаться, чтобы удержать ферзей
        correct: false
        explanation: Лидеру обмены выгодны. Без ферзей у соперника меньше шансов на хитрость.
      - text: Согласиться, ведь с равными силами лишняя ладья давит сильнее
        correct: true
        explanation: Да! Когда ты впереди, обмены тебе на пользу, и выигрыш становится проще.
      - text: Всё равно, оба варианта одинаковы
        correct: false
        explanation: Не совсем. Когда ты впереди, обмен сил делает победу легче.

  - type: quiz
    question: Ты отстал на фигуру. Что лучше делать с обменами?
    options:
      - text: Не спешить с обменами и оставлять шансы на ошибку соперника
        correct: true
        explanation: Да! Пока фигур много, у соперника больше возможностей ошибиться.
      - text: Менять всё подряд, чтобы стало проще
        correct: false
        explanation: Так отставание станет ещё заметнее, ведь пешки и фигуры закончатся.
      - text: Сразу сдаться
        correct: false
        explanation: Рано! Пока партия идёт, у тебя есть шансы, особенно если усложнять.
