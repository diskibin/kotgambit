id: openings-what-not-to-do
track: openings
order: 8
access: free
piece: k
title: Чего не делать в дебюте
summary: Типичные ошибки новичков, из-за которых партия проигрывается за несколько ходов.
minutes: 6
steps:
  - type: text
    title: Три частые ошибки
    body: >-
      Многие партии новичков заканчиваются в дебюте. Чаще всего причина в одной из трёх
      ошибок, и их легко избежать, если о них знать.
    pointsTitle: Чего лучше не делать
    points:
      - Ходить одной фигурой много раз подряд, пока остальные стоят
      - Рано выводить ферзя, его легко прогнать и потерять время
      - Двигать пешки перед королём без нужды, они открывают его
    board:
      fen: rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR w KQkq - 1 3
      caption: Пешки f3 и g4 открыли короля, и ему поставили мат
    remember: Развивай все фигуры и береги пешки возле короля.

  - type: demo
    title: Гамбит показывает мат
    body: Смотри, как всего два хода пешками рядом с королём закончились матом.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [f2f3, e7e5, g2g4, d8h4]

  - type: move
    title: Поставь мат
    prompt: Белые сыграли f3 и g4 и открыли своего короля. Поставь мат ферзём.
    fen: rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq - 0 2
    orientation: b
    answers: [d8h4]
    hints:
      piece: Мат поставит ферзь, он стоит на d8.
      idea: Диагональ от h4 к белому королю на e1 открыта, ведь пешки f2 и g2 ушли.
    success: Мат! Белый король остался на виду, и закрыться нечем.
    oops: Диагональ к белому королю открыта. Выведи ферзя на h4, чтобы поставить шах.
    successArrows:
      - { from: d8, to: h4, color: sun }

  - type: quiz
    question: Что плохого в том, чтобы ходить одной и той же фигурой в дебюте несколько раз подряд?
    options:
      - text: Остальные фигуры остаются в стороне, и соперник получает преимущество
        correct: true
        explanation: Да! Ты теряешь время, пока соперник выводит всех своих.
      - text: Это запрещено правилами
        correct: false
        explanation: Правила этого не запрещают, но на практике это невыгодно.
      - text: Фигура устанет
        correct: false
        explanation: Фигуры не устают! Дело в потерянном времени.

  - type: quiz
    question: Почему плохо рано выводить ферзя?
    options:
      - text: Его легко прогнать фигурами и потерять время
        correct: true
        explanation: Да! Соперник развивает фигуры с темпом, нападая на ферзя.
      - text: Ферзь слабая фигура
        correct: false
        explanation: Наоборот, ферзь самая сильная фигура. Именно поэтому его не стоит подставлять под удар.
      - text: Это запрещено правилами
        correct: false
        explanation: Правила не запрещают. Просто лучше сначала вывести коней и слонов.
