id: games-evergreen
track: games
order: 2
access: free
piece: r
title: 'Вечнозелёная партия'
summary: 'Белые отдают коня, ладью и ферзя, чтобы поставить мат слонами.'
minutes: 9
steps:
  - type: text
    title: 'Вечная красота'
    body: >-
      Эту партию сыграли Адольф Андерсен и Жан Дюфресн в Берлине в 1852 году. Её называют вечнозелёной за красоту. Белые жертвуют сначала коня, потом ладью, потом ферзя и ставят мат слонами. Главная идея в том, что открытые линии и активные фигуры решают партию.
    pointsTitle: 'На что смотреть'
    points:
      - 'Белые отдают пешку ради быстрого центра и открытых линий'
      - 'Чёрный король остаётся в центре и так и не рокируется'
      - 'Мат ставят два слона и пешка, а не ферзь'
    remember: 'Фигуры в игре важнее материала, особенно когда король соперника не прикрыт.'

  - type: demo
    title: 'Гамбит Эванса'
    body: >-
      Белые начинают итальянской партией, а потом играют b4 и предлагают пешку. Это называют гамбитом Эванса. Чёрные берут пешку слоном.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, f1c4, f8c5, b2b4, c5b4]

  - type: demo
    title: 'Центр и открытые линии'
    body: >-
      Белые строят центр ходами c3 и d4, рокируются и идут вперёд. Чёрные берут пешки, а ферзь уходит на f6, потом на g6.
    fen: r1bqk1nr/pppp1ppp/2n5/4p3/1bB1P3/5N2/P1PP1PPP/RNBQK2R w KQkq - 0 5
    moves: [c2c3, b4a5, d2d4, e5d4, e1g1, d4d3, d1b3, d8f6]

  - type: demo
    title: 'Давление на короля'
    body: >-
      Белые ставят пешку на e5 и вводят в игру ладью и слона. Слон a3 смотрит на слабое поле e7, где стоит чёрный конь.
    fen: r1b1k1nr/pppp1ppp/2n2q2/b7/2B1P3/1QPp1N2/P4PPP/RNB2RK1 w kq - 2 9
    moves: [e4e5, f6g6, f1e1, g8e7, c1a3, b7b5, b3b5, a8b8]

  - type: demo
    title: 'Развитие коней'
    body: >-
      Белые вводят в игру коней и слона, а чёрные тратят время на ферзя. Чёрный король остаётся в центре.
    fen: 1rb1k2r/p1ppnppp/2n3q1/bQ2P3/2B5/B1Pp1N2/P4PPP/RN2R1K1 w k - 1 13
    moves: [b5a4, a5b6, b1d2, c8b7, d2e4, g6f5, c4d3, f5h5]

  - type: demo
    title: 'Жертва коня и ладьи'
    body: >-
      Белые жертвуют коня на f6, потом ладью на e7. Каждая жертва открывает линию для следующей.
    fen: 1r2k2r/pbppnppp/1bn5/4P2q/Q3N3/B1PB1N2/P4PPP/R3R1K1 w k - 1 17
    moves: [e4f6, g7f6, e5f6, h8g8, a1d1, h5f3, e1e7, c6e7]

  - type: demo
    title: 'Жертва ферзя'
    body: >-
      Теперь белые отдают и ферзя. Два слона и пешка f6 не оставляют чёрному королю клеток.
    fen: 1r2k1r1/pbppnp1p/1b3P2/8/Q7/B1PB1q2/P4PPP/3R2K1 w - - 0 21
    moves: [a4d7, e8d7, d3f5, d7e8, f5d7, e8f8]

  - type: move
    title: 'Мат слонами'
    prompt: 'Белый слон d7 уже закрыл королю путь. Поставь мат вторым слоном.'
    fen: 1r3kr1/pbpBnp1p/1b3P2/8/8/B1P2q2/P4PPP/3R2K1 w - - 4 24
    answers: [a3e7]
    hints:
      piece: 'Ходи слоном, он стоит на a3.'
      idea: 'Возьми коня e7. Слон ставит мат, а король f8 зажат пешкой f6 и своей же ладьёй.'
    success: 'Мат! Два слона и пешка победили, хотя белые отдали ферзя и ладью.'
    oops: 'Нужно взять коня e7 слоном по диагонали. Слон a3 смотрит прямо на него.'
    successArrows:
      - { from: a3, to: e7, color: sun }

  - type: quiz
    question: 'Что общего у Бессмертной и Вечнозелёной партий?'
    options:
      - text: 'В обеих побеждали чёрные'
        correct: false
        explanation: 'Нет, в обеих выиграл Андерсен, а чёрные проиграли.'
      - text: 'В обеих партиях ферзи размениваются на первых ходах'
        correct: false
        explanation: 'Нет, ферзи остаются на доске до самой атаки.'
      - text: 'Белые жертвовали материал ради атаки на короля и мата'
        correct: true
        explanation: 'Да! Обе партии показывают, что активные фигуры и открытые линии могут решить всё.'
