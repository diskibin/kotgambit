id: middlegame-weak-squares
track: middlegame
order: 8
access: free
piece: n
title: Слабые поля
summary: Поле, которое не может защитить ни одна пешка соперника, удобно занять конём.
minutes: 6
steps:
  - type: text
    title: Поле без защиты пешек
    body: >-
      Слабое поле это клетка, которую не могут защитить пешки соперника. Когда пешки ушли вперёд
      или были разменены, на этой клетке можно закрепиться, и прогнать оттуда фигуру получится
      только разменом. Лучше всего на такое поле подходит конь.
    pointsTitle: Как найти слабое поле
    points:
      - Посмотри, какие пешки соперника уже ушли с соседних вертикалей
      - Найди клетку, которую они больше не могут атаковать
      - Поставь туда коня, чтобы его нельзя было прогнать пешкой
    board:
      fen: r1bq1rk1/pp3ppp/3p4/8/2P1P3/2N5/PP3PPP/R1BQ1RK1 w - - 0 1
      arrows:
        - { from: c3, to: d5, color: sun }
      caption: У чёрных нет пешек c и e, поэтому поле d5 никто не защитит пешкой
    remember: Конь на слабом поле сильнее, чем где-либо ещё.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как конь занимает поле, откуда его не прогнать пешкой.
    fen: r1bq1rk1/pp3ppp/3p4/8/2P1P3/2N5/PP3PPP/R1BQ1RK1 w - - 0 1
    moves: [c3d5]

  - type: move
    title: Займи слабое поле
    prompt: Поставь коня на слабое поле d5, куда не дотянется ни одна чёрная пешка.
    fen: r1bq1rk1/pp3ppp/3p4/8/2P1P3/2N5/PP3PPP/R1BQ1RK1 w - - 0 1
    answers: [c3d5]
    hints:
      piece: Ходи конём, он стоит на c3.
      idea: Поле d5 лежит в центре, и чёрные пешки c и e давно ушли, так что оно слабое.
    success: Конь закрепился на d5, и пешкой его теперь не прогнать. Отличный ход!
    oops: Конь пока стоит не на слабом поле. Найди клетку в центре, которую не атакует ни одна чёрная пешка.
    successArrows:
      - { from: c3, to: d5, color: sun }

  - type: quiz
    question: Какое поле слабое у чёрных?
    board:
      fen: r1bq1rk1/pp3ppp/3p4/8/2P1P3/2N5/PP3PPP/R1BQ1RK1 w - - 0 1
    options:
      - text: d5
        correct: true
        explanation: Да! Пешки c и e у чёрных нет, и поле d5 никто не сможет защитить пешкой.
      - text: b6
        correct: false
        explanation: Почти! Но это поле защищает пешка a7, значит оно не слабое.
      - text: f6
        correct: false
        explanation: Эту клетку охраняет пешка g7, так что она под защитой.

  - type: quiz
    question: Что такое слабое поле?
    options:
      - text: Клетка, которую не могут защитить пешки соперника
        correct: true
        explanation: Да! На ней удобно закрепить свою фигуру.
      - text: Любая клетка у края доски
        correct: false
        explanation: Почти! Дело не в крае, а в том, что пешки соперника не могут эту клетку атаковать.
      - text: Клетка, на которой стоит король
        correct: false
        explanation: Король тут ни при чём. Слабое поле определяют по пешкам соперника.
