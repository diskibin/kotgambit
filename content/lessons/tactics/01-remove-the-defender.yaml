id: tactics-remove-defender
track: tactics
order: 1
access: free
piece: b
title: Уничтожение защиты
summary: Забери защитника, и фигура, которую он держал, достанется тебе.
minutes: 7
steps:
  - type: text
    title: Убери того, кто защищает
    body: >-
      Иногда фигура соперника стоит под защитой, и просто так её не взять. Тогда подумай о
      защитнике. Если его можно забрать или прогнать, защита рухнет, и ты возьмёшь то, что
      он держал. Этот приём называют уничтожением защиты.
    pointsTitle: Как найти такой приём
    points:
      - Выбери цель, которая защищена
      - Найди фигуру, которая её защищает
      - Посмотри, нельзя ли взять защитника, пусть даже со сменой фигур
    board:
      fen: 6k1/1p6/2n5/1B2p3/8/5N2/8/4K3 w - - 0 1
      arrows:
        - { from: b5, to: c6, color: sun }
        - { from: f3, to: e5, color: mint }
      caption: Конь c6 защищает пешку e5. Если взять коня, пешка останется без защиты
    remember: Хочешь взять защищённое, убери защитника.

  - type: demo
    title: Гамбит показывает приём
    body: Слон берёт коня, пешка берёт слона, а потом конь забирает пешку, которую защищал чёрный конь.
    fen: 6k1/1p6/2n5/1B2p3/8/5N2/8/4K3 w - - 0 1
    moves: [b5c6, b7c6, f3e5]

  - type: move
    title: Начни с защитника
    prompt: Пешка e5 защищена конём c6. Забери защитника.
    fen: 6k1/1p6/2n5/1B2p3/8/5N2/8/4K3 w - - 0 1
    answers: [b5c6]
    hints:
      piece: Ходи слоном, он стоит на b5.
      idea: Слон может взять коня c6. Тогда пешка e5 останется без защиты.
    success: Верно! После обмена пешка e5 осталась без защиты, и ты её заберёшь.
    oops: Пешка e5 защищена конём. Сначала забери коня, и защита исчезнет.
    successArrows:
      - { from: b5, to: c6, color: sun }

  - type: move
    title: Теперь возьми пешку
    prompt: Чёрные взяли слона пешкой. Защитника больше нет, забери пешку e5.
    fen: 6k1/8/2p5/4p3/8/5N2/8/4K3 w - - 0 1
    answers: [f3e5]
    hints:
      piece: Бери конём, он стоит на f3.
      idea: Пешка e5 теперь никого не защищает и ничем не защищена.
    success: Здорово! Ты выиграл пешку, потому что сначала убрал защитника.
    oops: Пешка e5 осталась без защиты. Возьми её конём.
    successArrows:
      - { from: f3, to: e5, color: sun }

  - type: quiz
    question: Что значит уничтожить защиту?
    options:
      - text: Забрать или прогнать фигуру, которая защищает цель
        correct: true
        explanation: Да! Когда защитника нет, цель можно брать без потерь.
      - text: Закрыть свою фигуру от нападения
        correct: false
        explanation: Это скорее защита своей фигуры, а не уничтожение чужой защиты.
      - text: Поставить шах королю
        correct: false
        explanation: Шах может помочь, но уничтожение защиты это именно удар по защитнику.
