id: endgame-promotion
track: endgame
order: 8
access: free
piece: p
title: Превращение пешки
summary: Куда превращать пешку, чтобы выиграть, а не получить пат.
minutes: 7
steps:
  - type: text
    title: Пешка становится фигурой
    body: >-
      Когда пешка доходит до последней горизонтали, она превращается в ферзя, ладью, слона или коня на твой выбор. Чаще всего берут ферзя, ведь он сильнее всех. Но иногда лучше выбрать другую фигуру, например, чтобы не получился пат.
    pointsTitle: Что выбрать
    points:
      - Обычно превращай в ферзя
      - Проверь, нет ли после этого пата
      - Конь иногда нужен для шаха и вилки
    remember: Перед превращением проверь, останется ли у соперника ход.

  - type: move
    title: Превращение с матом
    prompt: Чёрный король в углу. Дойди пешкой до конца и поставь мат.
    fen: 7k/5P2/6K1/8/8/8/8/8 w - - 0 1
    answers: [f7f8q, f7f8r]
    hints:
      piece: Ходи пешкой, она стоит на f7.
      idea: Пешка идёт на f8 и превращается в ферзя или ладью, и это мат.
    success: Мат! Король g6 закрывает g7 и h7, а новая фигура даёт шах.
    oops: Пешка стоит на седьмой горизонтали. Сделай один шаг и выбери фигуру.
    successArrows:
      - { from: f7, to: f8, color: sun }

  - type: move
    title: Ферзь даст пат, выбери ладью
    prompt: Если превратить пешку в ферзя, у чёрных не останется ходов, и будет пат. Превратись в ладью.
    fen: 8/5P1k/5K2/8/8/8/8/8 w - - 0 1
    answers: [f7f8r]
    hints:
      piece: Ходи пешкой, она стоит на f7.
      idea: Дойди до f8 и выбери ладью. Король h7 получит ход, и ты сможешь выиграть.
    success: Верно! Ладья оставила чёрным ход, и белые выигрывают, а ферзь привёл бы к пату.
    oops: Ферзь на f8 даст пат, у чёрного короля тогда не будет хода. Выбери ладью.
    successArrows:
      - { from: f7, to: f8, color: sun }

  - type: quiz
    question: Почему в предыдущей позиции ферзь не подходит?
    options:
      - text: После него у чёрных не остаётся ходов, а шаха нет, и это пат
        correct: true
        explanation: Да! Пат это ничья. Поэтому мы выбрали ладью, которая оставляет королю ход.
      - text: Потому что ферзь слабее ладьи
        correct: false
        explanation: Нет, ферзь сильнее. Дело только в пате.
      - text: Потому что превращение в ферзя запрещено
        correct: false
        explanation: Запрета нет, но здесь ферзь привёл бы к ничьей.

  - type: quiz
    question: Во что чаще всего превращают пешку?
    options:
      - text: В слона, потому что он красивее
        correct: false
        explanation: Слон слабее ферзя. Его выбирают редко.
      - text: В короля
        correct: false
        explanation: Пешка не может превратиться в короля.
      - text: В ферзя, потому что он самая сильная фигура
        correct: true
        explanation: Да! Ферзь выбирают почти всегда, а другие фигуры нужны в особых случаях.
