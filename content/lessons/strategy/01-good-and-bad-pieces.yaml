id: strategy-good-bad-pieces
track: strategy
order: 1
access: free
piece: b
title: Хорошая и плохая фигура
summary: Одни и те же фигуры бывают сильными и слабыми. Всё зависит от пешек вокруг.
minutes: 6
steps:
  - type: text
    title: Фигура тоже бывает плохой
    body: >-
      Две одинаковые фигуры могут стоить по-разному. Если свои пешки закрывают фигуру со всех
      сторон, ей негде ходить, и такую фигуру называют плохой. Хорошая фигура свободна и
      нападает на много клеток.
    pointsTitle: Признаки плохой фигуры
    points:
      - Свои пешки стоят на клетках её цвета
      - У фигуры мало свободных ходов
      - Она не участвует в игре, пока другие работают
    board:
      fen: 2b3k1/5p2/4p3/3p4/8/8/8/6K1 b - - 0 1
      caption: Чёрный слон c8 закрыт своими пешками на светлых клетках
    remember: Плохого слона нужно либо вывести в игру, либо обменять.

  - type: quiz
    question: Почему слон c8 считается плохим?
    board:
      fen: 2b3k1/5p2/4p3/3p4/8/8/8/6K1 b - - 0 1
      caption: Слон c8 ходит по светлым клеткам
    options:
      - text: Свои пешки закрывают его диагонали
        correct: true
        explanation: Да! Пешки d5, e6 и f7 стоят на светлых клетках, как и слон, и мешают ему ходить.
      - text: Потому что слон вообще слабая фигура
        correct: false
        explanation: Слон сильная фигура, но ему нужна свобода.
      - text: Потому что на доске мало места
        correct: false
        explanation: Места хватает. Дело в том, что своим пешкам он мешает, а они ему.

  - type: move
    title: Выведи слона вовремя
    prompt: Пока слон не закрыт пешкой e6, выведи его за цепочку пешек.
    fen: 2b3k1/4p3/2p5/3p4/8/8/8/6K1 b - - 0 1
    answers: [c8f5, c8g4]
    hints:
      piece: Ходи слоном, он стоит на c8.
      idea: Выведи слона на f5 или g4, за границу пешек c6 и d5.
    success: Хорошо! Слон вышел за пешки и будет активным, а не запертым.
    oops: Пока слон остаётся за своими пешками. Выведи его по диагонали наружу.
    successArrows:
      - { from: c8, to: f5, color: sun }

  - type: quiz
    question: Что можно сделать с плохим слоном?
    options:
      - text: Вывести за цепь пешек или поменять на фигуру соперника
        correct: true
        explanation: Да! Так ты избавишься от слабой фигуры или оживишь её.
      - text: Оставить как есть
        correct: false
        explanation: Тогда фигура будет бездействовать, а соперник будет играть против неё.
      - text: Поставить ещё больше пешек на его цвет
        correct: false
        explanation: Это закроет слона ещё сильнее.
