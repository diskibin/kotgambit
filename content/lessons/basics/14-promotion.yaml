id: basics-promotion
track: basics
order: 14
access: free
piece: p
title: Превращение пешки
summary: Пешка, дошедшая до края доски, становится другой фигурой.
minutes: 5
steps:
  - type: text
    title: Пешка становится фигурой
    body: >-
      Когда пешка доходит до последней горизонтали, она обязательно превращается в ферзя, ладью,
      слона или коня. Выбираешь ты сам, и чаще всего берут ферзя, самую сильную фигуру. Цвет
      остаётся твоим.
    board:
      fen: 4k3/P7/8/8/8/8/8/4K3 w - - 0 1
      arrows:
        - { from: a7, to: a8, color: sun }
      caption: Пешке остался один шаг до последней горизонтали
    remember: Дошла до края, значит выбираешь новую фигуру, чаще всего ферзя.

  - type: demo
    title: Гамбит показывает превращение
    body: 'Смотри: пешка шагает на a8 и становится ферзём.'
    fen: 4k3/P7/8/8/8/8/8/4K3 w - - 0 1
    moves: [a7a8q]

  - type: move
    title: Преврати пешку
    prompt: Сделай шаг пешкой и преврати её в ферзя.
    fen: 4k3/P7/8/8/8/8/8/4K3 w - - 0 1
    answers: [a7a8q]
    hints:
      piece: Ходи пешкой, она стоит на a7.
      idea: Пешке остался один шаг вперёд. Когда она дойдёт, выбери ферзя.
    success: Была пешка, стал ферзь! Теперь у тебя огромная сила.
    oops: Пешка шагнула, но ферзём она ещё не стала. Дойди до последней горизонтали и выбери ферзя.
    successArrows:
      - { from: a7, to: a8, color: sun }

  - type: quiz
    question: Во что может превратиться пешка на последней горизонтали?
    options:
      - text: В ферзя, ладью, слона или коня
        correct: true
        explanation: Да! Выбор за тобой, а чаще всего берут ферзя.
      - text: Только в ферзя
        correct: false
        explanation: Ферзь самый сильный, но выбрать можно и другие фигуры. Иногда это даже полезно.
      - text: В короля
        correct: false
        explanation: Королей два на всю партию, и новых не бывает. Пешка становится ферзём, ладьёй, слоном или конём.
