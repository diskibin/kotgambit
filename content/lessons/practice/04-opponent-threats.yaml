id: practice-threats
track: practice
order: 4
access: free
piece: n
title: Что задумал соперник
summary: Каждый ход соперника что-то значит. Учимся читать его замыслы.
minutes: 6
steps:
  - type: text
    title: Прочитай последний ход
    body: >-
      После хода соперника остановись и спроси себя, зачем он так сыграл. Часто он создал угрозу, и если ты её не заметишь, придётся расплачиваться.
    pointsTitle: Что мог сделать ход
    points:
      - Напасть на твою фигуру
      - Освободить линию для дальней фигуры
      - Приготовить мат
      - Защитить свою слабую фигуру
    remember: Ход соперника это всегда сообщение, и надо его прочитать.

  - type: quiz
    question: Чёрная ладья стоит на e8, а у твоего короля нет свободных клеток. Что она готовит?
    board:
      fen: 4r1k1/5ppp/8/8/8/8/5PPP/6K1 w - - 0 1
      caption: Ладья на e8 смотрит на первую горизонталь
    options:
      - text: Ладья просто стоит
        correct: false
        explanation: Нет, у неё есть план. Вертикаль e открыта, и ладья пойдёт на e1.
      - text: Ладья готовится защищать короля
        correct: false
        explanation: Ладья нападает. Посмотри, куда она может пойти по открытой вертикали.
      - text: Ладья идёт на e1 и ставит мат
        correct: true
        explanation: Да! Король закрыт собственными пешками, и ладья на e1 поставит мат.

  - type: move
    title: Дай королю воздух
    prompt: Угроза мата на e1. Освободи королю клетку, сделав ход пешкой.
    fen: 4r1k1/5ppp/8/8/8/8/5PPP/6K1 w - - 0 1
    answers: [h2h3, g2g3, h2h4]
    hints:
      piece: Ходи пешкой перед королём, например h2 или g2.
      idea: После хода пешки у короля появится клетка, куда уйти от шаха.
    success: Хорошо! У короля есть воздух, и мата на e1 уже нет.
    oops: Мат на первой горизонтали всё ещё возможен. Нужно освободить клетку для короля.
    successArrows:
      - { from: h2, to: h3, color: sun }

  - type: quiz
    question: Чёрные только что поставили слона на c5. На какую белую пешку он теперь нацелен?
    board:
      fen: r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4
      caption: Слон c5 смотрит по диагонали в сторону белого короля
    options:
      - text: На пешку e4
        correct: false
        explanation: Слон ходит по диагоналям, и e4 не лежит на его диагонали.
      - text: На пешку f2, её защищает только король
        correct: true
        explanation: Да! Слон давит по диагонали c5, d4, e3, f2. Заметь это сразу.
      - text: На пешку h2
        correct: false
        explanation: До h2 слон c5 не достаёт. Его диагональ идёт к f2 и g1.

  - type: quiz
    question: Соперник сделал ход, и ты не понял, зачем. Что лучше всего?
    options:
      - text: Подумать, что изменилось на доске, и проверить угрозы
        correct: true
        explanation: Да! Загадочный ход часто скрывает угрозу, поэтому сначала разберись.
      - text: Сразу сделать свой ход, как задумал
        correct: false
        explanation: Так легко пропустить угрозу. Лучше сначала понять замысел соперника.
      - text: Сдаться
        correct: false
        explanation: Не нужно. Просто посмотри внимательно, и всё станет ясно.
