id: mates-in-two
track: mates
order: 4
access: free
piece: q
title: Мат в два хода
summary: Первым ходом лишаем короля воздуха, вторым ставим мат.
minutes: 7
steps:
  - type: text
    title: Подготовь мат
    body: >-
      Мат в два хода состоит из двух шагов. Первым ходом ты заставляешь короля сделать единственный
      ход или лишаешь его всех клеток. Вторым ходом ставишь мат. Важно проверить, что у
      соперника нет другого ответа.
    pointsTitle: Как искать мат в два хода
    points:
      - Найди ход, после которого у короля остаётся один ответ
      - Представь позицию после этого ответа
      - Проверь, есть ли там мат в один ход
    remember: Первый ход готовит мат, а не ставит его.

  - type: move
    title: Первый ход
    prompt: Чёрный король в углу. Сделай ход, после которого у него останется единственный ответ.
    fen: 7k/8/5K2/8/8/8/8/1Q6 w - - 0 1
    answers: [b1b7, f6g6, b1g1]
    hints:
      piece: Ходи ферзём, он стоит на b1.
      idea: Поставь ферзя на b7. Он отрежет королю седьмую горизонталь, и король сможет пойти только на g8.
    success: Хорошо! Королю остаётся только g8, и мат уже рядом.
    oops: Ферзь должен отрезать королю поле. Ищи ход, после которого у чёрных единственный ответ.
    successArrows:
      - { from: b1, to: b7, color: sun }

  - type: move
    title: Второй ход
    prompt: Король ушёл на g8, другого хода у него не было. Поставь мат.
    fen: 6k1/1Q6/5K2/8/8/8/8/8 w - - 2 2
    answers: [b7g7]
    hints:
      piece: Ходи ферзём, он стоит на b7.
      idea: Король f6 защищает поле g7. Поставь ферзя туда.
    success: Мат! Белый король защищает ферзя, и чёрному королю некуда идти.
    oops: Поставь ферзя рядом с королём, но так, чтобы король f6 его защищал.
    successArrows:
      - { from: b7, to: g7, color: sun }

  - type: quiz
    question: Что нужно проверить после своего первого хода в задаче на мат в два хода?
    options:
      - text: Нет ли у соперника другого ответа, кроме того, что ты рассчитал
        correct: true
        explanation: Да! Мат в два хода работает только тогда, когда он сильнее любого ответа соперника.
      - text: Сколько у тебя осталось времени
        correct: false
        explanation: Время важно, но задача решается проверкой ответов соперника.
      - text: Какой цвет у твоего ферзя
        correct: false
        explanation: Цвет ферзя здесь ни при чём. Нужно проверить, какие ответы есть у соперника.
