id: endgame-two-bishops
track: endgame
order: 7
access: free
piece: b
title: Мат двумя слонами
summary: Один слон мат не ставит, а два слона вместе с королём справляются.
minutes: 7
steps:
  - type: text
    title: Два слона и король
    body: >-
      Мы уже видели, что король и один слон не могут поставить мат. Но два слона вместе с королём
      справляются. Слоны стоят рядом на соседних диагоналях и закрывают чёрному королю клетки,
      пока белый король помогает им, и в конце загоняют короля в угол.
    pointsTitle: Как работает мат двумя слонами
    points:
      - Слоны ходят по клеткам разных цветов, поэтому вместе они закрывают всё
      - Белый король подходит к чужому королю, чтобы закрыть ему клетки
      - Мат ставят в углу доски
    board:
      fen: 7k/5B2/6K1/8/8/8/8/6B1 w - - 0 1
      arrows:
        - { from: g1, to: d4, color: sun }
        - { from: f7, to: g8, color: mint }
      caption: Слон f7 закрывает g8, король g6 закрывает g7 и h7, слон идёт на d4
    remember: Два слона и король в углу это мат, а один слон ничего не даст.

  - type: move
    title: Поставь мат двумя слонами
    prompt: Чёрный король в углу. Слон f7 и король уже закрыли ему клетки. Поставь мат вторым слоном.
    fen: 7k/5B2/6K1/8/8/8/8/6B1 w - - 0 1
    answers: [g1d4]
    hints:
      piece: Ходи слоном, он стоит на g1.
      idea: Поставь слона на длинную диагональ, на d4. Он даст шах королю h8.
    success: Мат! Слон f7 закрыл g8, а король g6 закрыл g7 и h7.
    oops: Нужен шах по диагонали, после которой королю некуда деться. Подойдёт d4.
    successArrows:
      - { from: g1, to: d4, color: sun }

  - type: quiz
    question: Почему нужны оба слона?
    options:
      - text: Они ходят по клеткам разных цветов и вместе закрывают больше клеток
        correct: true
        explanation: Да! Один слон видит только клетки одного цвета, а два видят все.
      - text: Потому что два слона сильнее ферзя
        correct: false
        explanation: Нет, но вместе они эффективны. Главное, что они дополняют друг друга.
      - text: Потому что слоны защищают друг друга
        correct: false
        explanation: Они часто защищают друг друга, но главная причина в цветах клеток.

  - type: quiz
    question: Нужна ли помощь короля при мате двумя слонами?
    options:
      - text: Да, король закрывает клетки и защищает слонов
        correct: true
        explanation: Да! Без помощи короля слоны не справятся.
      - text: Нет, слоны справятся сами
        correct: false
        explanation: Слоны сами не загонят короля в угол. Нужен ещё и король.
      - text: Только если пешек нет
        correct: false
        explanation: Пешки тут ни при чём. Королю помогать нужно всегда.
