id: endgame-extra-material
track: endgame
order: 5
access: free
piece: r
title: Лишний материал
summary: Когда ты впереди по материалу, нужно спокойно упрощать позицию.
minutes: 6
steps:
  - type: text
    title: Выигрыш надо довести до конца
    body: >-
      Лишняя фигура или пешка это ещё не победа, ею надо уметь воспользоваться. В эндшпиле лучше
      действовать просто, без риска и ненужных усложнений. Побеждает тот, кто не торопится и
      не даёт сопернику шансов.
    pointsTitle: Простые правила
    points:
      - Меняй фигуры, чем их меньше, тем заметнее лишний материал
      - Не меняй пешки, они нужны, чтобы создать проходную
      - Активно веди короля к центру и к пешкам, он сильная фигура в эндшпиле
      - Не спеши и проверяй угрозы соперника
    board:
      fen: 3qr1k1/5ppp/8/8/8/8/5PPP/R2QR1K1 w - - 0 1
      arrows:
        - { from: d1, to: d8, color: sun }
      caption: У белых лишняя ладья, и разменять ферзей будет просто
    remember: Если ты впереди, меняй фигуры и играй спокойно.

  - type: move
    title: Разменяй ферзей
    prompt: У тебя лишняя ладья. Разменяй ферзей и возьми чёрного ферзя на d8.
    fen: 3qr1k1/5ppp/8/8/8/8/5PPP/R2QR1K1 w - - 0 1
    answers: [d1d8]
    hints:
      piece: Бери ферзём, он стоит на d1.
      idea: Ферзи стоят друг против друга на вертикали d. Размен упростит позицию и сохранит твоё преимущество.
    success: Ферзи разменяны, а лишняя ладья осталась с тобой. Так и надо выигрывать!
    oops: Чем меньше фигур, тем заметнее лишняя ладья. Размен ферзей вернёт нас к простой позиции.
    successArrows:
      - { from: d1, to: d8, color: sun }

  - type: quiz
    question: Что полезно делать, когда ты впереди по материалу?
    options:
      - text: Менять фигуры и упрощать позицию
        correct: true
        explanation: Да! Чем меньше фигур, тем проще воспользоваться лишним материалом.
      - text: Бросаться в атаку любой ценой
        correct: false
        explanation: Смело! Но без нужды рисковать не стоит, ведь ты и так впереди.
      - text: Менять пешки
        correct: false
        explanation: Почти! Но пешки как раз нужны, чтобы создать проходную. Меняй фигуры, а не пешки.

  - type: quiz
    question: Какую роль в эндшпиле лучше всего отдать королю?
    options:
      - text: Активную, вести его к центру и к пешкам
        correct: true
        explanation: Да! Когда фигур мало, король почти ничем не рискует и сильно помогает.
      - text: Спрятать его в угол
        correct: false
        explanation: В дебюте так и делают, а в эндшпиле король нужен в игре.
      - text: Никуда не двигать
        correct: false
        explanation: Почти! Но в эндшпиле король очень пригодится, и стоять на месте ему незачем.
