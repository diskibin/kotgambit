name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:content
      - run: pnpm content-guard
      # The version and checksum are pinned: an engine that changes under us changes every evaluation
      - name: Install Stockfish
        env:
          STOCKFISH_VERSION: sf_19
          STOCKFISH_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
        run: |
          curl -fsSL -o stockfish.tar.gz "https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_VERSION}/stockfish-linux-x86-64-universal.tar.gz"
          echo "${STOCKFISH_SHA256}  stockfish.tar.gz" | sha256sum --check
          tar -xzf stockfish.tar.gz -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/stockfish/stockfish-linux-x86-64-universal"
          echo "ENGINE_PATH=$RUNNER_TEMP/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"
      - run: pnpm test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The action needs no license for personal repositories; organizations would
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
