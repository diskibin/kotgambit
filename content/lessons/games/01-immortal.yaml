id: games-immortal
track: games
order: 1
access: free
piece: b
title: 'Бессмертная партия'
summary: 'Белые отдали слона, обе ладьи и ферзя, но выиграли красивой атакой.'
minutes: 9
steps:
  - type: text
    title: 'Партия, которую помнят'
    body: >-
      Эту партию сыграли в Лондоне в 1851 году Адольф Андерсен за белых и Лионель Кизерицкий за
      чёрных. Белые отдали слона, обе ладьи и даже ферзя, но выиграли атакой оставшихся фигур. Нам
      важно не выучить ходы, а почувствовать идею. Атака и инициатива иногда ценнее материала.
    pointsTitle: 'На что смотреть'
    points:
      - 'Белые жертвуют материал ради быстрой атаки'
      - 'Чёрные берут всё подряд, а их король остаётся без защиты'
      - 'В конце три лёгкие фигуры ставят мат'
    remember: 'Материал нужен, чтобы выигрывать, но мат важнее любого материала.'

  - type: demo
    title: 'Королевский гамбит'
    body: >-
      Белые начинают королевским гамбитом и отдают пешку f4 ради быстрого развития. Чёрные берут её и
      ставят шах ферзём, из-за чего белый король теряет возможность рокироваться. Потом чёрные
      предлагают ещё одну пешку, b5.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, f2f4, e5f4, f1c4, d8h4, e1f1, b7b5]

  - type: demo
    title: 'Игра на обострение'
    body: >-
      Белые забирают пешку слоном и развивают коня. Чёрный ферзь много ходит по доске, а белые тем
      временем собирают фигуры рядом с чужим королём.
    fen: rnb1kbnr/p1pp1ppp/8/1p6/2B1Pp1q/8/PPPP2PP/RNBQ1KNR w kq - 0 5
    moves: [c4b5, g8f6, g1f3, h4h6, d2d3, f6h5, f3h4, h6g5]

  - type: demo
    title: 'Пешки идут вперёд'
    body: >-
      Белые двигают пешки g и h, чтобы прогнать ферзя, а ладья встаёт на g1. Чёрные забирают слона,
      которого белые отдали на b5.
    fen: rnb1kb1r/p1pp1ppp/8/1B4qn/4Pp1N/3P4/PPP3PP/RNBQ1K1R w kq - 3 9
    moves: [h4f5, c7c6, g2g4, h5f6, h1g1, c6b5, h2h4, g5g6]

  - type: demo
    title: 'Развитие фигур'
    body: >-
      Белые возвращают материал, берут пешку на f4 и вводят в игру коня. Чёрные так и не успевают
      рокироваться, и их король остаётся в центре.
    fen: rnb1kb1r/p2p1ppp/5nq1/1p3N2/4PpPP/3P4/PPP5/RNBQ1KR1 w kq - 1 13
    moves: [h4h5, g6g5, d1f3, f6g8, c1f4, g5f6, b1c3, f8c5]

  - type: demo
    title: 'Обе ладьи в подарок'
    body: >-
      Белые позволяют чёрным забрать обе ладьи. Слон d6 и пешка e5 уже окружают короля, и этим белые
      готовят мат.
    fen: rnb1k1nr/p2p1ppp/5q2/1pb2N1P/4PBP1/2NP1Q2/PPP5/R4KR1 w kq - 3 17
    moves: [c3d5, f6b2, f4d6, c5g1, e4e5, b2a1, f1e2, b8a6]

  - type: demo
    title: 'Шах конём'
    body: >-
      Конь берёт пешку g7 с шахом, и чёрный король вынужден уйти на d8.
    fen: r1b1k1nr/p2p1ppp/n2B4/1p1NPN1P/6P1/3P1Q2/P1P1K3/q5b1 w kq - 2 21
    moves: [f5g7, e8d8]

  - type: move
    title: 'Жертва ферзя'
    prompt: 'Ферзь белых пойдёт под бой коня, но мат уже виден. Найди этот ход.'
    fen: r1bk2nr/p2p1pNp/n2B4/1p1NP2P/6P1/3P1Q2/P1P1K3/q5b1 w - - 1 22
    answers: [f3f6]
    hints:
      piece: 'Ходи ферзём, он стоит на f3.'
      idea: 'Ферзь идёт на f6 с шахом, конь обязан его взять, а потом слон поставит мат.'
    success: 'Жертва ферзя, и мат неизбежен! Вот почему партию называют бессмертной.'
    oops: 'Белые ставят шах ферзём на f6, и после этого мат слоном. Ищи шах ферзём.'
    successArrows:
      - { from: f3, to: f6, color: sun }

  - type: move
    title: 'Мат слоном'
    prompt: 'Чёрные взяли ферзя конём. Поставь мат слоном.'
    fen: r1bk3r/p2p1pNp/n2B1n2/1p1NP2P/6P1/3P4/P1P1K3/q5b1 w - - 0 23
    answers: [d6e7]
    hints:
      piece: 'Ходи слоном, он стоит на d6.'
      idea: 'Слон идёт на e7 с шахом, его защищает конь d5, а королю некуда деться.'
    success: 'Мат! Слон и два коня довели атаку до конца, хотя ферзь и ладьи были отданы.'
    oops: 'Нужен шах слоном, после которого королю не уйти. Подойдёт клетка e7.'
    successArrows:
      - { from: d6, to: e7, color: sun }

  - type: quiz
    question: 'Чему учит Бессмертная партия?'
    options:
      - text: 'Инициатива и атака на короля иногда важнее материала'
        correct: true
        explanation: 'Да! Но жертвы хороши, когда ты видишь мат или большое преимущество.'
      - text: 'Ферзя нужно отдавать как можно скорее'
        correct: false
        explanation: 'Нет, ферзь очень ценная фигура. Его отдают, только когда за жертвой следует мат.'
      - text: 'Ладьи слабее коней'
        correct: false
        explanation: 'Ладьи сильнее, но здесь белые отдали их ради атаки.'
