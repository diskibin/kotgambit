id: basics-board
track: basics
order: 1
access: free
piece: k
title: Доска и фигуры
summary: Знакомимся с клетками, вертикалями и расстановкой фигур.
minutes: 8
steps:
  - type: text
    title: Шахматная доска
    body: >-
      Доска состоит из 64 клеток: 8 вертикалей и 8 горизонталей. Вертикали называют буквами
      от a до h, а горизонтали числами от 1 до 8. Так у каждой клетки появляется свой адрес,
      например e4.
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      caption: Белые стоят внизу, чёрные вверху
    remember: Адрес клетки состоит из буквы и цифры. Сначала буква, потом цифра.

  - type: text
    title: Фигуры
    body: У каждого игрока в начале партии 16 фигур. Давай познакомимся с ними.
    pointsTitle: Кто есть кто
    points:
      - Король самая важная фигура, его нельзя потерять.
      - Ферзь самая сильная фигура.
      - Ладьи, слоны и кони помощники, их по две.
      - Восемь пешек стоят в первом ряду перед фигурами.
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

  - type: find-squares
    title: Найди клетку
    prompt: Отметь на доске клетку e4.
    fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
    squares: [e4]
    success: Точно! Буква e это пятая вертикаль слева, а цифра 4 четвёртая горизонталь снизу.
    oops: Не страшно, адреса клеток запоминаются с практикой. Буква показывает вертикаль, цифра горизонталь.
    hint: Буква e пятая вертикаль слева. Подпись с буквами есть под доской, а с цифрами слева.

  - type: quiz
    question: Какого цвета клетка a1?
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    options:
      - text: Тёмная
        correct: true
        explanation: Верно. В левом нижнем углу всегда стоит тёмная клетка, а в правом светлая.
      - text: Светлая
        correct: false
        explanation: 'Почти. Запомни правило: слева внизу тёмная клетка, справа внизу светлая.'

  - type: text
    title: Король
    body: >-
      Король высокий, с крестом на макушке. В начале партии белый король стоит на e1, а чёрный на e8,
      прямо друг напротив друга.
    board:
      fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
      caption: Короли стоят на e1 и e8
    remember: Король один, и он стоит в середине задней горизонтали.

  - type: text
    title: Ферзь
    body: >-
      У ферзя корона с зубцами и шариками. Белый ферзь стоит на d1, чёрный на d8, каждый рядом со своим
      королём. Он занимает клетку своего цвета: белый на светлой, чёрный на тёмной.
    board:
      fen: 3qk3/8/8/8/8/8/8/3QK3 w - - 0 1
      caption: Ферзи стоят на d1 и d8
    remember: Ферзь стоит слева от короля, если смотреть со стороны белых.

  - type: text
    title: Ладья
    body: >-
      Ладья похожа на башню с зубцами. Ладьи стоят по углам доски: белые на a1 и h1, чёрные на a8 и h8.
    board:
      fen: r3k2r/8/8/8/8/8/8/R3K2R w - - 0 1
      caption: Ладьи стоят в углах
    remember: Две ладьи занимают углы, поэтому их легко найти.

  - type: text
    title: Слон
    body: >-
      У слона вытянутая голова с острой макушкой и косой полоской. Слоны стоят рядом с ферзём и королём:
      белые на c1 и f1, чёрные на c8 и f8.
    board:
      fen: 2b1kb2/8/8/8/8/8/8/2B1KB2 w - - 0 1
      caption: Слоны стоят на c1, f1, c8 и f8
    remember: Слоны стоят по обе стороны от пары король и ферзь.

  - type: text
    title: Конь
    body: >-
      Конь это голова лошади с гривой. Он совсем не похож на остальные фигуры, поэтому его трудно
      спутать. Кони стоят рядом с ладьями: белые на b1 и g1, чёрные на b8 и g8.
    board:
      fen: 1n2k1n1/8/8/8/8/8/8/1N2K1N1 w - - 0 1
      caption: Кони стоят на b1, g1, b8 и g8
    remember: Конь стоит второй от края, рядом с ладьёй.

  - type: text
    title: Пешка
    body: >-
      Пешка самая маленькая фигура, у неё круглая голова. Восемь белых пешек стоят на всей второй
      горизонтали, а восемь чёрных на седьмой. Они стоят перед фигурами, как стена.
    board:
      fen: 4k3/pppppppp/8/8/8/8/PPPPPPPP/4K3 w - - 0 1
      caption: Пешки занимают вторую и седьмую горизонтали
    remember: Пешек восемь, и они стоят в сплошном ряду.

  - type: find-squares
    title: Найди ладьи
    prompt: Отметь клетки, на которых в начале партии стоят белые ладьи.
    fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
    squares: [a1, h1]
    success: Верно! Белые ладьи стоят в углах, на a1 и h1.
    oops: Не страшно. Ладьи стоят в углах доски, там, где начинается первая горизонталь.
    hint: Первая горизонталь самая нижняя. Ладьи стоят на её краях, слева и справа.

  - type: quiz
    question: На какой клетке в начале партии стоит белый ферзь?
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    options:
      - text: d1
        correct: true
        explanation: Да! Белый ферзь стоит на d1, на светлой клетке. Ферзь любит свой цвет.
      - text: e1
        correct: false
        explanation: На e1 стоит король. Ферзь стоит рядом с ним, на d1.
      - text: d8
        correct: false
        explanation: На d8 стоит чёрный ферзь. Белый стоит внизу, на d1.
      - text: e8
        correct: false
        explanation: На e8 стоит чёрный король. Белый ферзь стоит на d1.
