id: strategy-bishop-vs-knight
track: strategy
order: 2
access: free
piece: n
title: Слон или конь
summary: Когда лучше слон, а когда конь, зависит от пешек на доске.
minutes: 6
steps:
  - type: text
    title: Две лёгкие фигуры
    body: >-
      Слон и конь стоят одинаково, по три пешки. Но играют они по-разному. Слон бьёт далеко по диагоналям, а конь прыгает на короткие расстояния, зато через любые фигуры. Поэтому выбор зависит от того, открыта позиция или закрыта.
    pointsTitle: Простое правило
    points:
      - В открытой позиции, где мало пешек, сильнее слон
      - В закрытой позиции, где пешки заперты, сильнее конь
      - Конь любит клетку в центре, которую нельзя выбить пешкой
    board:
      fen: 4k3/pp3ppp/3n4/8/8/8/PP3PPP/2B1K3 w - - 0 1
      caption: Открытая позиция, пешек мало, слон видит всю доску
    remember: Слону нужен простор, а коню нужны хорошие клетки.

  - type: quiz
    question: В какой позиции сильнее слон?
    options:
      - text: В закрытой, где пешки стоят цепочками
        correct: false
        explanation: В закрытой позиции диагонали слона перекрыты, и он слабеет.
      - text: Везде одинаково
        correct: false
        explanation: Нет, от пешечной структуры зависит многое.
      - text: В открытой, где много свободных диагоналей
        correct: true
        explanation: Да! Слон бьёт далеко, и в открытой позиции его возможности растут.

  - type: quiz
    question: Почему конь хорошо играет в закрытых позициях?
    board:
      fen: 4k3/3n4/2p1p3/2Pp1p2/3P1P2/4P3/8/2B1K3 w - - 0 1
      caption: Пешки заперты цепочками, белый слон c1 почти не может выйти
    options:
      - text: Потому что конь сильнее слона
        correct: false
        explanation: По силе они одинаковы. Просто здесь конь меньше зависит от пешек.
      - text: Он прыгает через пешки и не зависит от открытых диагоналей
        correct: true
        explanation: Да! Для коня закрытая позиция не помеха, а белый слон здесь почти заперт.
      - text: Потому что пешки помогают коню ходить
        correct: false
        explanation: Пешки не помогают, но и не мешают, ведь конь прыгает через них.

  - type: quiz
    question: У тебя слон, а соперник запер позицию пешками. Что стоит сделать?
    options:
      - text: Открыть игру, разменивая пешки, чтобы слон ожил
        correct: true
        explanation: Да! Открытые линии возвращают слону силу.
      - text: Закрыть позицию ещё больше
        correct: false
        explanation: Тогда слон станет совсем бесполезным.
      - text: Поменять слона на любую пешку
        correct: false
        explanation: Менять слона на пешку невыгодно. Лучше открыть игру.
