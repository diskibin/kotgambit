id: tactics-checks-captures-threats
track: tactics
order: 5
access: free
piece: r
title: Шахи, взятия, угрозы
summary: Простой порядок поиска хода, который помогает не пропустить главное.
minutes: 7
steps:
  - type: text
    title: Порядок для поиска хода
    body: >-
      Когда в позиции много возможностей, легко растеряться. Сильные игроки перебирают ходы по
      порядку. Сначала самые резкие, потому что у них меньше всего ответов и они чаще всего
      решают партию.
    pointsTitle: Шахи, взятия, угрозы
    points:
      - Сначала проверь все шахи
      - Потом посмотри все взятия
      - Затем найди ходы, которые создают угрозу
      - Только после этого думай о тихих ходах
    remember: Резкие ходы проверяй первыми, тихие потом.

  - type: move
    title: Начни с шахов
    prompt: Чёрный король заперт на последней горизонтали. Найди шах, который решает партию.
    fen: 4r1k1/5ppp/8/8/8/8/5PPP/3RR1K1 w - - 0 1
    answers: [e1e8]
    hints:
      piece: Ходи ладьёй, она стоит на e1.
      idea: Забери чёрную ладью с шахом. Королю некуда деться, его закрывают свои пешки.
    success: Мат! Первый же шах решил дело. Вот зачем нужно начинать с шахов.
    oops: Начни с шахов. Одним из них можно сразу поставить мат.
    successArrows:
      - { from: e1, to: e8, color: sun }

  - type: quiz
    question: В каком порядке стоит искать ход в сложной позиции?
    options:
      - text: Шахи, потом взятия, потом угрозы
        correct: true
        explanation: Да! Так ты сначала проверяешь самые резкие ходы и реже что-то пропускаешь.
      - text: Сначала тихие ходы, потом шахи
        correct: false
        explanation: Шахи лучше проверить первыми, они сильнее всего меняют позицию.
      - text: В любом порядке
        correct: false
        explanation: Порядок помогает ничего не забыть, поэтому лучше держаться одной схемы.

  - type: quiz
    question: Почему стоит начинать с шахов?
    options:
      - text: На шах у соперника мало ответов, и его легко рассчитать
        correct: true
        explanation: Да! Ответов на шах немного, поэтому расчёт получается быстрым и надёжным.
      - text: Потому что шахи всегда выигрывают
        correct: false
        explanation: Не всегда, но их нужно проверить, ведь они часто решают партию.
      - text: Потому что шах ничего не стоит
        correct: false
        explanation: Шах может стоить фигуры, если его сделать неудачно. Поэтому его стоит проверять первым.

  - type: quiz
    question: Тебе показалось, что тихий ход красив. Что делать?
    options:
      - text: Сначала проверить шахи, взятия и угрозы соперника, и только потом ходить
        correct: true
        explanation: Да! Красивый ход не стоит того, чтобы пропустить мат или потерять фигуру.
      - text: Играть сразу, красота обычно побеждает
        correct: false
        explanation: Красота не побеждает, если ты пропустил угрозу. Сначала проверь резкие ходы.
      - text: Спросить совета у соперника
        correct: false
        explanation: Так нельзя, партия идёт без подсказок. Проверь позицию сам по порядку.
