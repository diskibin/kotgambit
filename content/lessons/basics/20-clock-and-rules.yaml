id: basics-clock
track: basics
order: 20
access: free
piece: p
title: Часы и правила партии
summary: Как работают шахматные часы и что значит «тронул, значит ходи».
minutes: 6
steps:
  - type: text
    title: Шахматные часы
    body: >-
      В серьёзных партиях у каждого игрока свои часы. Пока ты думаешь, твоё время тает. Сделал ход и нажал кнопку, и время пошло у соперника.
    pointsTitle: Что нужно знать про часы
    points:
      - У каждого игрока одинаковое время на всю партию
      - После своего хода нажимай кнопку часов
      - Если твоё время вышло, ты проигрываешь
      - Если у соперника не хватает фигур для мата, будет ничья
    remember: Думай над ходом, но следи, чтобы времени хватило до конца партии.

  - type: quiz
    question: Что нужно сделать сразу после своего хода?
    options:
      - text: Подождать, пока соперник начнёт думать
        correct: false
        explanation: Так твоё время продолжит идти зря. Нажми кнопку сразу после хода.
      - text: Нажать кнопку часов, чтобы пошло время соперника
        correct: true
        explanation: Да! Часы нужны, чтобы думали оба по очереди.
      - text: Остановить оба таймера и подумать
        correct: false
        explanation: Часы останавливать нельзя, они идут у того, чей сейчас ход.

  - type: text
    title: Тронул, значит ходи
    body: >-
      За настоящей доской есть важное правило. Если ты дотронулся до своей фигуры, ходить нужно именно ею. А если дотронулся до фигуры соперника, ты обязан её взять, если это можно сделать.
    pointsTitle: Как не ошибиться
    points:
      - Сначала подумай, потом бери фигуру
      - Если нужно поправить фигуру на клетке, скажи «поправляю» до того, как тронешь
      - Ходи одной рукой, той же, которой нажимаешь часы
    remember: Рука не думает, думает голова, поэтому сначала реши, а потом трогай.

  - type: quiz
    question: Ты дотронулся до коня, но понял, что ход плохой. Что делать?
    options:
      - text: Ходить конём, ведь ты его тронул
        correct: true
        explanation: Да! Если у коня есть ход, ходить нужно им. Поэтому сначала думай.
      - text: Отпустить коня и пойти другой фигурой
        correct: false
        explanation: Так нельзя, правило «тронул, значит ходи» работает за настоящей доской.
      - text: Попросить соперника разрешить другой ход
        correct: false
        explanation: Разрешения тут не спрашивают. Правило просто обязывает ходить тронутой фигурой.

  - type: text
    title: Как предложить ничью или сдаться
    body: >-
      Ничью предлагают после своего хода, до того как нажата кнопка часов. Для этого говорят «предлагаю ничью» и ждут ответа. Если ты понял, что партия проиграна, можно сдаться. Для этого протягивают руку сопернику и говорят «сдаюсь». Это достойный поступок, а не слабость.
    remember: После партии пожми сопернику руку, как бы она ни закончилась.
