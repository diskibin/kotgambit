# Metro (React Native) does not follow pnpm symlinks, see PLAN.md section 4
nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
allowBuilds:
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - turbo@2.11.6
