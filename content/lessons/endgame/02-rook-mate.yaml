id: endgame-rook-mate
track: endgame
order: 2
access: free
piece: r
title: Мат ладьёй
summary: Ладья отрезает путь, король подходит, и мат ставится на последней линии.
minutes: 7
steps:
  - type: text
    title: Мат ладьёй и королём
    body: >-
      Ладья и король против короля тоже выигрывают, но тут понадобится терпение. Ладья отрезает королю путь, твой король подходит ближе, а мат ставят на краю доски, когда королю негде спрятаться.
    pointsTitle: Как это делается
    points:
      - Ладья отрезает чужого короля по горизонтали или вертикали
      - Твой король занимает позицию напротив чужого, через одну клетку
      - Когда они стоят так, ладья ставит шах на краю, и это мат
    board:
      fen: 6k1/R7/6K1/8/8/8/8/8 b - - 0 1
      arrows:
        - { from: a7, to: g7, color: sky }
      caption: Король g6 и ладья на седьмой горизонтали отрезали чёрного короля
    remember: Ладья отрезает, король подходит, мат ставится на краю.

  - type: demo
    title: Гамбит показывает мат
    body: Смотри, как король делает ход, и ладья ставит мат.
    fen: 7k/8/R4K2/8/8/8/8/8 w - - 0 1
    moves: [f6g6, h8g8, a6a8]

  - type: move
    title: Подведи короля
    prompt: Ладья уже отрезает короля. Подведи своего короля так, чтобы чёрному пришлось уйти на g8, и ладья поставила мат. Сходи королём на g6.
    fen: 7k/8/R4K2/8/8/8/8/8 w - - 0 1
    answers: [f6g6]
    hints:
      piece: Ходи королём, он стоит на f6.
      idea: Король на g6 закроет клетки g7 и h7, и чёрному останется один ход.
    success: Король занял нужное место, а чёрным остался единственный ход.
    oops: Нужен ход королём, который закроет клетки рядом с чёрным королём. Попробуй встать на g6.
    successArrows:
      - { from: f6, to: g6, color: sun }

  - type: move
    title: Поставь мат
    prompt: Чёрный король ушёл на g8. Поставь мат ладьёй.
    fen: 6k1/8/R5K1/8/8/8/8/8 w - - 2 2
    answers: [a6a8]
    hints:
      piece: Мат поставит ладья, она стоит на a6.
      idea: Король g6 закрывает клетки f7, g7 и h7. Ладье нужно напасть по последней горизонтали.
    success: Мат! Ладья на последней линии, а король не даёт ему уйти.
    oops: Нам нужен шах на последней горизонтали. Ладья поднимется по вертикали a.
    successArrows:
      - { from: a6, to: a8, color: sun }

  - type: quiz
    question: Белые сыграли Лg7. Что получилось на доске?
    board:
      fen: 7k/6R1/6K1/8/8/8/8/8 b - - 1 1
    options:
      - text: Мат, и белые победили
        correct: false
        explanation: Почти! Но шаха нет, значит мата тоже нет.
      - text: Чёрные ходят королём на g8
        correct: false
        explanation: Клетка g8 под боем ладьи g7, так что туда нельзя. Ходов нет, это пат.
      - text: Пат, и партия закончилась вничью
        correct: true
        explanation: Да! Шаха нет, а ходить королю некуда. Выигрыш потерян.
