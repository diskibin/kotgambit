id: endgame-active-king
track: endgame
order: 6
access: free
piece: k
title: Король в эндшпиле
summary: Когда фигур мало, король превращается из слабого места в сильную фигуру.
minutes: 6
steps:
  - type: text
    title: Король выходит в бой
    body: >-
      В начале партии короля прячут, ведь ему грозит мат. Но когда фигур почти не остаётся, мат
      уже не страшен, и король становится сильной фигурой. Он забирает пешки, поддерживает свои
      и мешает чужим.
    pointsTitle: Как играть королём в эндшпиле
    points:
      - Веди короля в центр доски, ближе к пешкам
      - Бери чужие слабые пешки и защищай свои
      - Не торопись с королём, если на доске ещё много фигур
    board:
      fen: 8/5k2/8/8/8/5K2/8/8 w - - 0 1
      caption: Короли идут к центру, и выигрывает тот, кто придёт первым
    remember: В эндшпиле король стоит почти как лёгкая фигура.

  - type: move
    title: Иди в центр
    prompt: Эндшпиль, на доске только короли. Сделай ход королём в центр доски.
    fen: 8/5k2/8/8/8/5K2/8/8 w - - 0 1
    answers: [f3e4]
    hints:
      piece: Ходи королём, он стоит на f3.
      idea: Центр это клетки d4, e4, d5 и e5. Ближайшая к тебе клетка e4.
    success: Хорошо! Король в центре действует во все стороны и первым придёт к пешкам.
    oops: Подумай о центре доски. Ближайшая клетка центра для твоего короля это e4.
    successArrows:
      - { from: f3, to: e4, color: sun }

  - type: quiz
    question: Когда стоит выводить короля в центр доски?
    options:
      - text: Когда ферзи размениваются и осталось мало фигур
        correct: true
        explanation: Да! Без ферзей мат королю уже не страшен, и король становится активным.
      - text: Сразу в дебюте
        correct: false
        explanation: В дебюте король в центре опасен, его лучше спрятать рокировкой.
      - text: Никогда, король всегда сидит в углу
        correct: false
        explanation: В эндшпиле король очень нужен в центре, чтобы работать с пешками.

  - type: quiz
    question: Чем король помогает в эндшпиле?
    options:
      - text: Берёт слабые пешки соперника и сопровождает свои проходные
        correct: true
        explanation: Да! Король это боевая единица, пока на доске мало фигур.
      - text: Он сидит в углу и ничего не делает
        correct: false
        explanation: В эндшпиле это только мешает. Лучше идти королём вперёд.
      - text: Он ходит только по горизонтали
        correct: false
        explanation: Король ходит на любую соседнюю клетку, что очень полезно.
