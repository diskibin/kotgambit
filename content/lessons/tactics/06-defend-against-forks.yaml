id: tactics-defend-forks
track: tactics
order: 6
access: free
piece: n
title: Как защититься от вилки
summary: Заметь вилку соперника заранее и не дай её сделать.
minutes: 6
steps:
  - type: text
    title: Смотри на ход соперника
    body: >-
      Мы учились делать вилки, а теперь научимся их не допускать. Перед ходом спроси себя, куда может пойти фигура соперника, чтобы напасть сразу на две мои. Если такая клетка есть, у тебя есть три способа справиться.
    pointsTitle: Как не попасть в вилку
    points:
      - Уведи одну из фигур с линии вилки
      - Закрой клетку, на которую хотел прыгнуть соперник
      - Побей фигуру, которая готовит вилку
    board:
      fen: r3k3/8/8/3N4/8/8/8/4K3 b - - 0 1
      arrows:
        - { from: c7, to: e8, color: sun }
        - { from: c7, to: a8, color: mint }
      caption: Белый конь готовит прыжок на c7 с шахом и ударом по ладье
    remember: Прежде чем ходить, найди клетки, с которых соперник может сделать вилку.

  - type: move
    title: Сойди с линии вилки
    prompt: Белый конь угрожает прыгнуть на c7. Спаси ладью, оставив её не там, где её ждёт вилка.
    fen: r3k3/8/8/3N4/8/8/8/4K3 b - - 0 1
    answers: [a8c8, a8d8, a8b8]
    hints:
      piece: Ходи ладьёй, она стоит на a8.
      idea: Ладья может уйти с линии удара коня, например на c8 или d8.
    success: Хорошо! Теперь вилка на c7 не даёт ничего, ладья в безопасности.
    oops: Конь на c7 нападёт на короля и ладью. Нужно убрать ладью с линии этой вилки.
    successArrows:
      - { from: a8, to: c8, color: sun }

  - type: quiz
    question: Как ещё можно справиться с угрозой вилки?
    options:
      - text: Поставить мат первым
        correct: false
        explanation: Мат бы всё решил, но он не всегда возможен. Проверь простые способы защиты.
      - text: Закрыть клетку, на которую собирается прыгнуть конь
        correct: true
        explanation: Да! Если клетка занята или под защитой, вилка не получится.
      - text: Ничего не делать, потому что вилка не страшна
        correct: false
        explanation: Вилка часто стоит фигуры, поэтому с ней нужно бороться.

  - type: quiz
    question: Что нужно сделать до хода, чтобы не пропустить вилку?
    options:
      - text: Посмотреть, куда может пойти конь или ферзь соперника и кого он увидит
        correct: true
        explanation: Да! Проверь клетки, откуда одна фигура достаёт до двух твоих.
      - text: Закрыть глаза и ходить смелее
        correct: false
        explanation: Смелость хороша, но сначала нужно смотреть на доску.
      - text: Разменять все фигуры
        correct: false
        explanation: Размены не всегда нужны. Лучше просто заметить угрозу и сделать правильный ход.
