id: openings-evans-gambit
track: openings
order: 11
access: free
piece: b
title: 'Гамбит Эванса'
summary: 'Белые отдают пешку ради быстрого центра и открытых линий.'
minutes: 7
steps:
  - type: text
    title: 'Пешка ради развития'
    body: >-
      Гамбит Эванса начинается ходом 4.b4 после итальянской партии. Белые отдают пешку, чтобы потом
      сыграть c3 и d4 и получить сильный центр. Эту идею сыграли в Вечнозелёной партии, которую ты уже
      видел.
    pointsTitle: 'Идеи гамбита'
    points:
      - 'Белые жертвуют пешку b4 ради быстрого центра'
      - 'Ходы c3 и d4 дают белым сильную пешечную пару'
      - 'Линии для слонов и ладей быстро открываются'
    remember: 'Отдав пешку, нужно получить за неё развитие.'

  - type: demo
    title: 'Предлагаем пешку'
    body: >-
      Белые играют итальянскую партию, а потом b4. Чёрные берут пешку слоном, и белые готовят удар в
      центре.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, b8c6, f1c4, f8c5, b2b4, c5b4]

  - type: move
    title: 'Строй центр'
    prompt: 'Белые отдали пешку. Теперь нужна пешка в центре. Сделай ход пешкой c, чтобы потом сыграть d4.'
    fen: r1bqk1nr/pppp1ppp/2n5/4p3/1bB1P3/5N2/P1PP1PPP/RNBQK2R w KQkq - 0 5
    answers: [c2c3]
    hints:
      piece: 'Ходи пешкой c, она стоит на c2.'
      idea: 'Ход c3 готовит d4 и прогоняет слона с b4.'
    success: 'Теперь у белых будет сильный центр, а чёрный слон под ударом.'
    oops: 'Нужна пешка, которая прогонит слона b4 и подготовит d4. Это c3.'
    successArrows:
      - { from: c2, to: c3, color: sun }

  - type: demo
    title: 'Центр белых'
    body: >-
      Слон отходит на a5, и белые играют d4. Чёрные берут пешку, белые рокируют и забирают пешку
      обратно. У белых сильный центр и хорошее развитие.
    fen: r1bqk1nr/pppp1ppp/2n5/4p3/1bB1P3/2P2N2/P2P1PPP/RNBQK2R b KQkq - 0 5
    moves: [b4a5, d2d4, e5d4, e1g1, d7d6, c3d4, a5b6]

  - type: quiz
    question: 'Зачем белые отдают пешку b4?'
    options:
      - text: 'Чтобы быстро получить центр и развитие'
        correct: true
        explanation: 'Да! Пешка стоит меньше, чем время, которое белые выигрывают.'
      - text: 'Чтобы упростить партию'
        correct: false
        explanation: 'Нет, гамбит делает партию острее.'
      - text: 'Чтобы защитить слона c4'
        correct: false
        explanation: 'Слона защищает не эта пешка. Цель гамбита другая.'
