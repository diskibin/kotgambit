id: middlegame-deflection
track: middlegame
order: 6
access: free
piece: q
title: Отвлечение
summary: Заставь защитника уйти с важного поста, и тогда его место займёт твоя атака.
minutes: 6
steps:
  - type: text
    title: Убери защитника
    body: >-
      Отвлечение это приём, когда ты заставляешь фигуру соперника покинуть пост. Чаще всего ей приходится брать твою фигуру, которой ты пожертвовал. Пока защитник занят, то, что он охранял, остаётся без защиты.
    pointsTitle: Как это работает
    points:
      - Найди фигуру, на которой держится защита
      - Предложи ей взять твою фигуру, да ещё и с шахом
      - Ударь по месту, которое она охраняла
    board:
      fen: r5k1/5ppp/8/3b4/8/8/5PPP/Q3R1K1 w - - 0 1
      arrows:
        - { from: a1, to: a8, color: sun }
        - { from: e1, to: e8, color: sky }
      caption: Ладья a8 охраняет последнюю горизонталь. Её нужно отвлечь
    remember: Если защитник занят, его пост остаётся пустым.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как ферзь жертвует собой, и ладья ставит мат.
    fen: r5k1/5ppp/8/3b4/8/8/5PPP/Q3R1K1 w - - 0 1
    moves: [a1a8, d5a8, e1e8]

  - type: move
    title: Предложи жертву
    prompt: Чёрная ладья a8 охраняет последнюю горизонталь. Отвлеки её, возьми ладью ферзём с шахом.
    fen: r5k1/5ppp/8/3b4/8/8/5PPP/Q3R1K1 w - - 0 1
    answers: [a1a8]
    hints:
      piece: Ходи ферзём, он стоит на a1.
      idea: Ферзь берёт ладью на a8 и ставит шах. Чёрным придётся ответить на него слоном.
    success: Ферзь взял ладью с шахом, и слон вынужден ответить. Теперь последняя горизонталь без защиты!
    oops: Прямо сейчас Ле8 не поможет, ладья a8 защищает горизонталь. Сначала отвлеки её ферзём на a8.
    successArrows:
      - { from: a1, to: a8, color: sun }

  - type: move
    title: Поставь мат
    prompt: Чёрный слон взял ферзя и ушёл на a8. Теперь на последней горизонтали никто не защищает короля. Поставь мат.
    fen: b5k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 2
    answers: [e1e8]
    hints:
      piece: Мат поставит ладья, она стоит на e1.
      idea: Король заперт своими пешками, а ладья идёт по вертикали e на последнюю горизонталь.
    success: Мат! Ферзь отвлёк защитника, и ладья довела дело до конца.
    oops: Нам нужен шах ладьёй на последней горизонтали. Подними её по вертикали e до самого края.
    successArrows:
      - { from: e1, to: e8, color: sun }

  - type: quiz
    question: Что такое отвлечение?
    options:
      - text: Отвлечь соперника разговором
        correct: false
        explanation: Так шахматы не играют! Отвлекают не человека, а фигуру, которая защищает.
      - text: Увести свою фигуру из-под удара
        correct: false
        explanation: Почти! Но отвлечение это про фигуру соперника, а не про твою.
      - text: Заставить защитника покинуть свой пост
        correct: true
        explanation: Да! Тогда то, что он защищал, остаётся без охраны.
