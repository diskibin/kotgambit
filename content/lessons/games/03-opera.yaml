id: games-opera
track: games
order: 3
access: free
piece: q
title: 'Партия в опере'
summary: 'Морфи побеждает за семнадцать ходов, развивая фигуры быстрее соперников.'
minutes: 8
steps:
  - type: text
    title: 'Партия в ложе оперы'
    body: >-
      Эту партию Пол Морфи сыграл в 1858 году в Париже против герцога Брауншвейгского и графа Изуара,
      которые играли вдвоём и советовались друг с другом. Партию играли в ложе оперного театра, отсюда
      название. Белые быстро развили фигуры, а чёрные отстали и расплатились.
    pointsTitle: 'Чему она учит'
    points:
      - 'Выводи фигуры раньше, чем начинаешь атаку'
      - 'Не трать время на лишние ходы пешками'
      - 'Открытые линии решают, когда король соперника в центре'
    remember: 'Побеждает тот, у кого все фигуры в игре.'

  - type: demo
    title: 'Начало партии'
    body: >-
      Морфи берёт пешку в центре. Чёрные меняют слона на коня и теряют время.
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [e2e4, e7e5, g1f3, d7d6, d2d4, c8g4, d4e5, g4f3]

  - type: demo
    title: 'Развитие и угроза'
    body: >-
      Белые выводят слона и ферзя, нацеливаясь на слабое поле f7. Чёрные защищаются ферзём и пешкой
      c6.
    fen: rn1qkbnr/ppp2ppp/3p4/4P3/4P3/5b2/PPP2PPP/RNBQKB1R w KQkq - 0 5
    moves: [d1f3, d6e5, f1c4, g8f6, f3b3, d8e7, b1c3, c7c6]

  - type: demo
    title: 'Жертва коня'
    body: >-
      Белые отдают коня на b5, чтобы открыть линию на чёрного короля, и берут пешку со шахом. Потом
      они рокируются на ферзевый фланг, и ладья встаёт на открытую вертикаль d.
    fen: rn2kb1r/pp2qppp/2p2n2/4p3/2B1P3/1QN5/PPP2PPP/R1B1K2R w KQkq - 0 9
    moves: [c1g5, b7b5, c3b5, c6b5, c4b5, b8d7, e1c1, a8d8]

  - type: demo
    title: 'Обмены на d-линии'
    body: >-
      Белые меняют ладьи и забирают коня слоном со шахом. Вся вертикаль d теперь в руках белых.
    fen: 3rkb1r/p2nqppp/5n2/1B2p1B1/4P3/1Q6/PPP2PPP/2KR3R w k - 3 13
    moves: [d1d7, d8d7, h1d1, e7e6, b5d7, f6d7]

  - type: move
    title: 'Жертва ферзя'
    prompt: 'Чёрный король почти беззащитен. Пожертвуй ферзя, чтобы заманить чёрного коня и дать мат ладьёй.'
    fen: 4kb1r/p2n1ppp/4q3/4p1B1/4P3/1Q6/PPP2PPP/2KR4 w k - 0 16
    answers: [b3b8]
    hints:
      piece: 'Ходи ферзём, он стоит на b3.'
      idea: 'Ферзь идёт на b8 с шахом. Конь обязан его взять, а потом ладья ставит мат на d8.'
    success: 'Блестяще! Конь взял ферзя, и мат уже неизбежен.'
    oops: 'Нужен шах ферзём, который заманит коня на b8. Ищи ход на восьмую горизонталь.'
    successArrows:
      - { from: b3, to: b8, color: sun }

  - type: move
    title: 'Мат ладьёй'
    prompt: 'Чёрные взяли ферзя конём. Поставь мат ладьёй.'
    fen: 1n2kb1r/p4ppp/4q3/4p1B1/4P3/8/PPP2PPP/2KR4 w k - 0 17
    answers: [d1d8]
    hints:
      piece: 'Ходи ладьёй, она стоит на d1.'
      idea: 'Ладья идёт на d8 с шахом, а слон g5 её защищает.'
    success: 'Мат! Слон g5 защищает ладью, а королю некуда уйти.'
    oops: 'Нужен шах по вертикали d, куда ладья может дойти до восьмой горизонтали.'
    successArrows:
      - { from: d1, to: d8, color: sun }

  - type: quiz
    question: 'Как Морфи выиграл эту партию так быстро?'
    options:
      - text: 'Он быстро развил все фигуры, открыл линии и пожертвовал ради мата'
        correct: true
        explanation: 'Да! Развитие и открытые линии сильнее лишнего материала.'
      - text: 'Он просто съел много пешек'
        correct: false
        explanation: 'Нет, он как раз отдавал материал ради быстрой атаки.'
      - text: 'Он ждал, пока соперники ошибутся сами'
        correct: false
        explanation: 'Морфи сам создал угрозы и нашёл красивые жертвы.'
