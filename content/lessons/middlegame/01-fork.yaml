id: middlegame-fork
track: middlegame
order: 1
access: free
piece: n
title: Вилка
summary: Одна фигура нападает сразу на две, и соперник может спасти только одну.
minutes: 6
steps:
  - type: text
    title: Один ход, две угрозы
    body: >-
      Вилка это когда одна твоя фигура нападает на две фигуры соперника сразу. Он может спасти
      только одну, а вторую ты заберёшь. Лучше всего вилки получаются у коня, ведь его ходы
      труднее всего заметить.
    pointsTitle: Как найти вилку
    points:
      - Посмотри, какие фигуры соперника стоят без защиты
      - Найди клетку, откуда конь достанет сразу две из них
      - Если одна из фигур король, соперник обязан спасать его
    board:
      fen: r3k3/2N5/8/8/8/8/8/4K3 b - - 1 1
      arrows:
        - { from: c7, to: e8, color: sun }
        - { from: c7, to: a8, color: sun }
      caption: Конь c7 нападает на короля и на ладью
    remember: Вилка нападает на две цели сразу, и обе спасти нельзя.

  - type: demo
    title: Гамбит показывает вилку
    body: Смотри, как конь ставит шах и забирает ладью.
    fen: r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1
    moves: [d5c7, e8d8, c7a8]

  - type: move
    title: Сделай вилку
    prompt: Сходи конём так, чтобы он напал сразу на короля и на ладью.
    fen: r3k3/8/8/3N4/8/8/8/4K3 w - - 0 1
    answers: [d5c7]
    hints:
      piece: Ходи конём, он стоит на d5.
      idea: Найди клетку, откуда конь достаёт и до короля e8, и до ладьи a8.
    success: Вилка! Король под шахом, а ладья остаётся без защиты. Ты выиграл ладью.
    oops: Конь пока нападает только на одну цель. Ищи клетку, откуда он видит и короля, и ладью.
    successArrows:
      - { from: d5, to: c7, color: sun }

  - type: move
    title: Вилка на ферзя
    prompt: Чёрный ферзь стоит рядом с твоим конём. Сделай вилку на короля и на ферзя.
    fen: 4k3/8/8/1N1q4/8/8/8/4K3 w - - 0 1
    answers: [b5c7]
    hints:
      piece: Ходи конём, он стоит на b5.
      idea: Найди клетку, откуда конь нападает и на короля, и на ферзя. Она на горизонтали 7.
    success: Вилка! Король обязан уйти, а ферзь достаётся тебе.
    oops: Конь пока нападает не на обе цели. Ищи клетку, откуда он видит и короля, и ферзя.
    successArrows:
      - { from: b5, to: c7, color: sun }

  - type: quiz
    question: Что такое вилка?
    options:
      - text: Одна фигура нападает сразу на две цели
        correct: true
        explanation: Да! Соперник не может спасти обе, поэтому одну ты заберёшь.
      - text: Ход, которым двигаются две фигуры сразу
        correct: false
        explanation: Почти! Так двигаются при рокировке. А вилка это нападение на две фигуры одним ходом.
      - text: Любое взятие
        correct: false
        explanation: Взятие бывает и без вилки. Вилка это нападение сразу на две цели.
