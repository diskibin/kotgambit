# Metro (React Native) does not follow pnpm symlinks, see PLAN.md section 4
nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
# Versions that fix advisories in packages that come only through tools (the Prisma CLI, Vite). Each line says
# what it is for; remove it when the tool that brings the package has a version that is not affected
overrides:
  # DoS in the indexed source maps, comes through postcss of Vite and Tailwind
  source-map-js: '>=1.2.2'
  # Leaks a password through a downgraded auth plugin and an unbounded inflate, comes through the Prisma CLI
  mysql2: '>=3.23.1'
  # Stack exhaustion on recursive objects, comes through the Prisma CLI
  deepmerge-ts: '>=8.0.0'
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  # Optional native speed-ups (ssh2 and cpu-features come with Testcontainers) and a version check
  # of protobufjs: none of them is needed, so their build scripts stay off
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - turbo@2.11.6
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
