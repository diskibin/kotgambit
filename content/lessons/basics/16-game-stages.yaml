title: Три стадии партии
summary: Дебют, миттельшпиль и эндшпиль. В каждой стадии свои цели.
minutes: 5
steps:
  - type: text
    title: Партия состоит из трёх частей
    body: >-
      Шахматная партия делится на три стадии. Границы между ними не жёсткие, но у каждой есть своя задача, и знать её очень полезно.
    pointsTitle: Три стадии партии
    points:
      - Дебют, начало. Выводи фигуры, занимай центр и прячь короля
      - Миттельшпиль, середина. Нападай, защищайся и составляй план
      - Эндшпиль, конец. Фигур мало, король становится активным
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      caption: Так выглядит начало партии
    remember: Дебют это развитие, миттельшпиль это борьба, эндшпиль это точность.

  - type: quiz
    question: На какой стадии партия на этой доске?
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    options:
      - text: В дебюте
        correct: true
        explanation: Да! Все фигуры стоят на местах и ещё не вышли в игру. Это самое начало.
      - text: В миттельшпиле
        correct: false
        explanation: Почти! До него ещё далеко, никто пока не сделал ни одного хода.
      - text: В эндшпиле
        correct: false
        explanation: До конца партии ещё далеко. Фигур пока полный комплект.

  - type: quiz
    question: А тут какая стадия?
    board:
      fen: r1bq1rk1/ppp2ppp/2np1n2/2b1p3/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1 w - - 0 8
    options:
      - text: Дебют
        correct: false
        explanation: Дебют уже почти закончился, ведь все фигуры вышли на хорошие позиции и короли рокировались.
      - text: Эндшпиль
        correct: false
        explanation: Фигур ещё очень много. В эндшпиле их остаётся совсем немного.
      - text: Миттельшпиль
        correct: true
        explanation: Да! Фигуры развиты, короли спрятаны, и начинается борьба.

  - type: quiz
    question: Какая это стадия?
    board:
      fen: 8/5k2/8/4p3/4P3/8/5K2/8 w - - 0 1
    options:
      - text: Дебют
        correct: false
        explanation: В дебюте фигур много, а тут остались только короли и пешки.
      - text: Эндшпиль
        correct: true
        explanation: Да! На доске остались только короли и пара пешек, и теперь король станет активной фигурой.
      - text: Миттельшпиль
        correct: false
        explanation: Почти! Но фигур почти не осталось, а так выглядит конец партии.
