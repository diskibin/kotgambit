id: middlegame-skewer
track: middlegame
order: 5
access: free
piece: r
title: Сквозной удар
summary: Ты нападаешь на ценную фигуру, она уходит, и ты берёшь ту, что стояла за ней.
minutes: 6
steps:
  - type: text
    title: Связка наоборот
    body: >-
      Сквозной удар похож на связку, только наоборот. Ты нападаешь на ценную фигуру, она вынуждена
      уйти, а за ней на той же линии стоит другая, и теперь её можно взять. Чаще всего впереди
      король или ферзь.
    pointsTitle: Чем он отличается от связки
    points:
      - При связке впереди менее ценная фигура, а позади более ценная
      - При сквозном ударе впереди более ценная, и она отходит
      - Ты берёшь фигуру, которая стояла сзади
    board:
      fen: 4r3/8/8/8/4k3/8/8/4R1K1 b - - 0 1
      arrows:
        - { from: e1, to: e4, color: sun }
        - { from: e4, to: e8, color: sky }
      caption: Ладья e1 шахует короля, а за ним на линии стоит ладья
    remember: Ценная фигура уходит, а та, что за ней, достаётся тебе.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как ладья шахует, король уходит, а чёрная ладья остаётся без защиты.
    fen: 4r3/8/8/8/4k3/8/8/R5K1 w - - 0 1
    moves: [a1e1, e4d4, e1e8]

  - type: move
    title: Сделай сквозной удар
    prompt: Поставь шах ладьёй так, чтобы за королём на той же линии оказалась чёрная ладья.
    fen: 4r3/8/8/8/4k3/8/8/R5K1 w - - 0 1
    answers: [a1e1]
    hints:
      piece: Ходи ладьёй, она стоит на a1.
      idea: Король и чёрная ладья стоят на вертикали e. Встань на неё с другой стороны, на e1.
    success: Шах! Король уйдёт, а ладья e8 останется без защиты, и ты её заберёшь.
    oops: Ладья пока не шахует. Найди клетку на вертикали e, откуда она видит короля, а за ним ладью.
    successArrows:
      - { from: a1, to: e1, color: sun }

  - type: quiz
    question: Чем сквозной удар отличается от связки?
    options:
      - text: Впереди стоит более ценная фигура, и она уходит
        correct: true
        explanation: Да! Потом ты берёшь ту, что стояла за ней.
      - text: Это одно и то же
        correct: false
        explanation: Они похожи, но порядок фигур разный. При сквозном ударе впереди самая ценная.
      - text: При сквозном ударе фигуры соперника ходить не могут
        correct: false
        explanation: Почти! Это про связку. А тут передняя фигура как раз уходит, и открывается задняя.
