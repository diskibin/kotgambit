id: basics-checkmate
track: basics
order: 10
access: free
piece: r
title: Мат королю
summary: Шах, от которого нельзя защититься, и есть мат. Так заканчивается партия.
minutes: 6
steps:
  - type: text
    title: Что такое мат
    body: >-
      Мат это шах, от которого нельзя защититься: король не может уйти, закрыться или забрать
      шахующую фигуру. Тот, кому поставили мат, проигрывает, а ты побеждаешь.
    board:
      fen: 4R1k1/5ppp/8/8/8/8/8/6K1 b - - 0 1
      arrows:
        - { from: e8, to: g8, color: sun }
      caption: Ладья шахует, а король заперт своими пешками. Это мат
    remember: Мат это шах без защиты, и на нём партия заканчивается.

  - type: demo
    title: Гамбит показывает мат
    body: 'Смотри: ладья встаёт на последнюю горизонталь, и королю некуда деться.'
    fen: 6k1/5ppp/8/8/8/8/8/4R1K1 w - - 0 1
    moves: [e1e8]

  - type: move
    title: Поставь мат
    prompt: Поставь мат одним ходом ферзя.
    fen: 7k/6pp/8/8/8/8/8/Q5K1 w - - 0 1
    answers: [a1a8]
    hints:
      piece: Мат поставит ферзь, он стоит на a1.
      idea: Король на h8 заперт своими пешками. Ферзю нужно напасть на него по 8-й горизонтали.
    success: Мат! Король в ловушке, и партия выиграна. Отличная работа!
    oops: Шах пока не получился, или король ещё сможет уйти. Подними ферзя так, чтобы он напал на короля по горизонтали.
    successArrows:
      - { from: a1, to: a8, color: sun }

  - type: quiz
    question: Это мат или король ещё может спастись?
    board:
      fen: 4k3/8/8/8/8/8/8/4R1K1 b - - 0 1
    options:
      - text: Не мат, король может уйти на d8 или f8
        correct: true
        explanation: Да! Ладья шахует по вертикали e, но рядом есть свободные клетки, куда король уйдёт.
      - text: Мат, ведь ладья нападает на короля
        correct: false
        explanation: Шах тут есть, но это ещё не мат. Посмотри на клетки рядом с королём, они свободны.
      - text: Это вообще не шах
        correct: false
        explanation: Шах есть, ладья нападает на короля по вертикали. Но от него можно уйти.

  - type: quiz
    question: Что происходит, когда одной стороне поставили мат?
    options:
      - text: Партия закончилась, победа за тем, кто поставил мат
        correct: true
        explanation: Да! Короля не берут, партия заканчивается раньше, на мате.
      - text: Король ходит дальше как обычно
        correct: false
        explanation: Почти! Но у короля нет ни одного хода, который спас бы его. Партия окончена.
      - text: Ничья
        correct: false
        explanation: Ничья бывает в других случаях. Мат всегда означает победу.
