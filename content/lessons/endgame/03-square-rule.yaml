id: endgame-square-rule
track: endgame
order: 3
access: free
piece: p
title: Правило квадрата
summary: Как быстро понять, догонит ли король пешку, и не считать ходы.
minutes: 6
steps:
  - type: text
    title: Квадрат пешки
    body: >-
      Когда пешка бежит к последней горизонтали, а король соперника далеко, можно не считать ходы. Достаточно мысленно нарисовать квадрат. Одна его сторона идёт от пешки до последней горизонтали, остальные стороны такой же длины в сторону чужого короля.
    pointsTitle: Как пользоваться квадратом
    points:
      - Нарисуй квадрат от пешки до последней горизонтали
      - Если король соперника, чей ход, может войти в квадрат, он догонит пешку
      - Если не может, пешка добежит и станет ферзём
    board:
      fen: 8/7k/8/2P5/8/8/8/K7 b - - 0 1
      arrows:
        - { from: c5, to: c8, color: sun }
        - { from: c8, to: f8, color: sky }
      caption: Квадрат пешки c5 это поля c5, c8, f8 и f5. Король h7 стоит за его пределами
    remember: Король в квадрате догонит пешку, а король вне квадрата нет.

  - type: quiz
    question: Чёрные ходят. Догонит ли король пешку c5?
    board:
      fen: 8/7k/8/2P5/8/8/8/K7 b - - 0 1
    options:
      - text: Нет, он вне квадрата
        correct: true
        explanation: Да! Король h7 не успевает, и пешка добежит до ферзя.
      - text: Да, он совсем рядом
        correct: false
        explanation: Почти! Но по квадрату видно, что король остаётся за его пределами.
      - text: Нельзя сказать без счёта ходов
        correct: false
        explanation: Можно! Правило квадрата как раз позволяет обойтись без счёта.

  - type: quiz
    question: А теперь король стоит на f6. Догонит ли он пешку?
    board:
      fen: 8/8/5k2/2P5/8/8/8/K7 b - - 0 1
    options:
      - text: Нет, он слишком далеко
        correct: false
        explanation: Почти! Но король f6 стоит на границе квадрата, так что он успевает.
      - text: Это зависит от белого короля
        correct: false
        explanation: Белый король далеко, и на исход он не влияет. Главное, что чёрный король в квадрате.
      - text: Да, он внутри квадрата
        correct: true
        explanation: Да! Король f6 стоит на стороне квадрата и успеет перехватить пешку.

  - type: move
    title: Беги к ферзю
    prompt: Король соперника вне квадрата. Двинь пешку c5 на c6.
    fen: 8/7k/8/2P5/8/8/8/K7 w - - 0 1
    answers: [c5c6]
    hints:
      piece: Ходи пешкой, она стоит на c5.
      idea: Король соперника не успевает, и пешка может спокойно бежать к последней горизонтали.
    success: Пешка бежит, и король её не догонит. Скоро будет ферзь!
    oops: Здесь нужно двигать пешку. Король вне квадрата, так что ей ничто не помешает.
    successArrows:
      - { from: c5, to: c6, color: sun }
