id: basics-queen
track: basics
order: 6
access: free
piece: q
title: Как ходит ферзь
summary: Ферзь ходит и как ладья, и как слон, поэтому он самая сильная фигура.
minutes: 5
steps:
  - type: text
    title: Ферзь умеет всё сразу
    body: >-
      Ферзь ходит по вертикали, по горизонтали и по диагонали на любое число клеток. Это ладья и слон в одной фигуре. Через другие фигуры он тоже не прыгает.
    pointsTitle: Куда ходит ферзь
    points:
      - Вперёд, назад, вправо и влево
      - По любой диагонали
    board:
      fen: 4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: d8, color: sky }
        - { from: d4, to: h8, color: sun }
      caption: Ферзь на d4 нападает по прямым и по диагоналям
    remember: Ферзь это ладья и слон вместе.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: ферзь едет по горизонтали через всю доску.'
    fen: 4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1
    moves: [d4h4]

  - type: move
    title: Сходи ферзём
    prompt: Сходи ферзём с d4 по диагонали на клетку a7.
    fen: 4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1
    answers: [d4a7]
    hints:
      piece: Ходи ферзём, он стоит на d4.
      idea: Сейчас ферзь ходит как слон, то есть по диагонали вверх и влево.
    success: Ферзь прошёл по диагонали, как слон. Отличный ход!
    oops: Ферзь умеет и больше, но сейчас нужна диагональ. Поднимись вверх и влево до края доски.
    successArrows:
      - { from: d4, to: a7, color: sun }

  - type: find-squares
    title: Куда пойдёт ферзь
    prompt: Отметь все клетки, куда может пойти белый ферзь.
    fen: 4k3/8/8/8/8/P7/1P6/Q3K3 w - - 0 1
    movesOf: a1
    squares: [a2, b1, c1, d1]
    success: Верно! Свои пешки закрывают ферзю две линии, и остаются короткие шаги.
    oops: Не страшно. Свои фигуры загораживают путь, а ферзь через них не прыгает.
    hint: Посмотри вверх по вертикали a, вправо по горизонтали 1 и по диагонали к b2.

  - type: quiz
    question: Как ходит ферзь?
    options:
      - text: Только по диагонали
        correct: false
        explanation: Так ходит слон. Ферзь умеет и это, и ещё ездит по прямым.
      - text: Как ладья и слон вместе
        correct: true
        explanation: Да! По прямым и по диагоналям, на любое число клеток.
      - text: На одну клетку в любую сторону
        correct: false
        explanation: Так ходит король. Ферзь может проехать хоть через всю доску.
