id: basics-piece-values
track: basics
order: 15
access: free
piece: n
title: Сколько стоит фигура
summary: Очки помогают понять, выгоден ли размен и какую фигуру стоит брать.
minutes: 5
steps:
  - type: text
    title: Очки фигур
    body: >-
      Чтобы быстро понять, выгодно ли взять фигуру или обменять, у каждой есть условная цена в очках. Короля не оценивают, ведь он бесценен.
    pointsTitle: Сколько очков стоит фигура
    points:
      - Пешка стоит 1 очко
      - Конь и слон по 3 очка
      - Ладья 5 очков
      - Ферзь 9 очков
    remember: Меняй дорогие фигуры на дорогие, а дешёвые отдавай за дорогие.

  - type: quiz
    question: Сколько очков стоит ладья?
    options:
      - text: 5 очков
        correct: true
        explanation: Да! Ладья стоит как пять пешек.
      - text: 3 очка
        correct: false
        explanation: Столько стоят конь и слон. Ладья сильнее и стоит дороже.
      - text: 9 очков
        correct: false
        explanation: Столько стоит ферзь. Ладья чуть слабее, у неё 5 очков.

  - type: move
    title: Возьми самое ценное
    prompt: Конь может взять ладью или пешку. Возьми ту фигуру, которая стоит дороже.
    fen: 4k3/8/3r1p2/8/4N3/8/8/4K3 w - - 0 1
    answers: [e4d6]
    hints:
      piece: Бери конём, он стоит на e4.
      idea: Ладья стоит 5 очков, а пешка только 1. Она стоит на d6.
    success: Ладья взята! Конь стоит 3 очка, а ты забрал 5.
    oops: Взять можно обе фигуры, но выгоднее забрать более дорогую. Ладья стоит гораздо больше пешки.
    successArrows:
      - { from: e4, to: d6, color: sun }

  - type: quiz
    question: Ты отдаёшь коня, а берёшь ладью. Выгоден ли такой обмен?
    options:
      - text: Нет, ведь ты потерял фигуру
        correct: false
        explanation: Потеря есть, но и приобретение тоже. Ладья стоит дороже коня, так что обмен в твою пользу.
      - text: Всё равно, фигуры стоят одинаково
        correct: false
        explanation: Они стоят по-разному. Конь это 3 очка, а ладья 5.
      - text: Да, ты отдаёшь 3 очка и получаешь 5
        correct: true
        explanation: Да! Ты остаёшься в плюсе на 2 очка.
