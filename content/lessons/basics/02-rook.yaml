id: basics-rook
track: basics
order: 2
access: free
title: Как ходит ладья
summary: Ладья ездит по прямой, как башня по рельсам.
minutes: 5
steps:
  - type: text
    title: Ладья ходит по прямой
    body: >-
      Ладья ходит по вертикали и по горизонтали на любое число клеток. Через другие
      фигуры она не прыгает: если на пути стоит фигура, ладья останавливается.
    board:
      fen: 4k3/8/8/8/3R4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: d7, color: sky }
        - { from: d4, to: a4, color: sun }
      caption: Ладья на d4 может ехать вдоль вертикали d и вдоль горизонтали 4
    remember: Ладья ходит только прямо, никогда по диагонали.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: ладья проезжает через всю горизонталь одним ходом.'
    fen: 4k3/8/8/8/3R4/8/8/4K3 w - - 0 1
    moves: [d4a4]

  - type: move
    title: Сходи ладьёй
    prompt: Сходи ладьёй с d4 на клетку a4.
    fen: 4k3/8/8/8/3R4/8/8/4K3 w - - 0 1
    answers: [d4a4]
    hints:
      piece: Ходи ладьёй, она стоит на d4.
      idea: Ладья едет прямо по горизонтали, нужно сдвинуться влево до края доски.
    success: Ладья едет прямо, как по рельсам. Отличный ход!
    oops: Ладья ходит только прямо. Попробуй проехать по горизонтали влево и давай ещё раз.
    successArrows:
      - { from: d4, to: a4, color: sun }

  - type: find-squares
    title: Куда пойдёт ладья
    prompt: Отметь все клетки, куда может пойти белая ладья.
    fen: 4k3/8/8/8/8/7P/8/4K2R w - - 0 1
    movesOf: h1
    squares: [f1, g1, h2]
    success: Верно! Ладью останавливают её собственный король и пешка.
    oops: Не страшно. Свои фигуры загораживают ладье путь, а через них она не прыгает.
    hint: Посмотри вдоль горизонтали 1 и вдоль вертикали h. Где ладью останавливают другие фигуры?

  - type: quiz
    question: Как ходит ладья?
    options:
      - text: По прямой, вверх, вниз, вправо и влево
        correct: true
        explanation: Да! Ладья ездит только по прямым линиям.
      - text: Буквой «Г»
        correct: false
        explanation: Так ходит конь. А ладья едет по прямой.
      - text: По диагонали
        correct: false
        explanation: Так ходит слон. Ладья ездит по вертикалям и горизонталям.
