id: basics-board
track: basics
order: 1
access: free
title: Доска и фигуры
summary: Знакомимся с клетками, вертикалями и расстановкой фигур.
minutes: 5
steps:
  - type: text
    title: Шахматная доска
    body: >-
      Доска состоит из 64 клеток: 8 вертикалей и 8 горизонталей. Вертикали называют буквами
      от a до h, а горизонтали числами от 1 до 8. Так у каждой клетки появляется свой адрес,
      например e4.
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      caption: Белые стоят внизу, чёрные вверху
    remember: Адрес клетки состоит из буквы и цифры. Сначала буква, потом цифра.

  - type: text
    title: Фигуры
    body: У каждого игрока в начале партии 16 фигур. Давай познакомимся с ними.
    pointsTitle: Кто есть кто
    points:
      - Король самая важная фигура, его нельзя потерять.
      - Ферзь самая сильная фигура.
      - Ладьи, слоны и кони помощники, их по две.
      - Восемь пешек стоят в первом ряду перед фигурами.
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

  - type: find-squares
    title: Найди клетку
    prompt: Отметь на доске клетку e4.
    fen: 4k3/8/8/8/8/8/8/4K3 w - - 0 1
    squares: [e4]
    success: Точно! Буква e это пятая вертикаль слева, а цифра 4 четвёртая горизонталь снизу.
    oops: Не страшно, адреса клеток запоминаются с практикой. Буква показывает вертикаль, цифра горизонталь.
    hint: Буква e пятая вертикаль слева. Подпись с буквами есть под доской, а с цифрами слева.

  - type: quiz
    question: Какого цвета клетка a1?
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    options:
      - text: Тёмная
        correct: true
        explanation: Верно. В левом нижнем углу всегда стоит тёмная клетка, а в правом светлая.
      - text: Светлая
        correct: false
        explanation: 'Почти. Запомни правило: слева внизу тёмная клетка, справа внизу светлая.'

  - type: quiz
    question: На какой клетке в начале партии стоит белый ферзь?
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    options:
      - text: d1
        correct: true
        explanation: Да! Белый ферзь стоит на d1, на светлой клетке. Ферзь любит свой цвет.
      - text: e1
        correct: false
        explanation: На e1 стоит король. Ферзь стоит рядом с ним, на d1.
      - text: d8
        correct: false
        explanation: На d8 стоит чёрный ферзь. Белый стоит внизу, на d1.
      - text: e8
        correct: false
        explanation: На e8 стоит чёрный король. Белый ферзь стоит на d1.
