  - type: quiz
    question: Какую роль играет конь в мате Анастасии?
    options:
      - text: Даёт шах королю
        correct: false
        explanation: Шах даёт ладья. Конь закрывает путь отхода.
      - text: Защищает ладью
        correct: false
        explanation: Ладье защита не нужна. Конь закрывает королю клетки.
      - text: Закрывает клетки g8 и g6, куда мог бы уйти король
        correct: true
        explanation: Да! Без коня король ушёл бы на g8 или g6 и мата не было бы.
