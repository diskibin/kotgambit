id: basics-check
track: basics
order: 4
access: free
title: Шах королю
summary: Что такое шах и как от него защититься.
minutes: 5
steps:
  - type: text
    title: Что такое шах
    body: >-
      Шах это нападение на короля. Королю нельзя оставаться под боем, поэтому на шах нужно
      ответить сразу.
    pointsTitle: Три способа защититься
    points:
      - Уйти королём на безопасное поле
      - Закрыться другой фигурой
      - Забрать фигуру, которая шахует
    board:
      fen: 4k3/8/8/1B6/8/8/8/4K3 b - - 0 1
      arrows:
        - { from: b5, to: e8, color: sun }
      caption: Слон b5 шахует короля e8
    remember: Уйти, закрыться, забрать.

  - type: quiz
    question: Какой ход ставит шах чёрному королю?
    board:
      fen: 6k1/5ppp/8/8/8/8/5PPP/4R1K1 w - - 0 1
    options:
      - text: Ле8
        correct: true
        explanation: Ура! Ладья на e8 нападает на короля, а уйти ему некуда, мешают свои пешки. Это даже мат.
      - text: Ле7
        correct: false
        explanation: Почти! Ладья на e7 нападает на пешку f7, но не на короля. Какая клетка на 8-й горизонтали рядом с ним?
      - text: Крf1
        correct: false
        explanation: Король ходит на f1, но чёрному королю это ничем не грозит. Шах ставят фигурой, которая нападает на короля.
      - text: h3
        correct: false
        explanation: Пешка идёт на h3, но она далеко от чёрного короля. Нужно найти фигуру, которая сможет напасть на него.

  - type: move
    title: Поставь шах
    prompt: Поставь шах чёрному королю одним ходом ладьи.
    fen: 7k/8/8/8/8/8/8/R3K3 w - - 0 1
    answers: [a1a8]
    hints:
      piece: Шах поставит ладья, она стоит на a1.
      idea: Король стоит на h8. Ладья нападает по горизонтали, нужна 8-я горизонталь.
    success: Шах! Король под ударом, и ему теперь придётся ответить.
    oops: Шаха пока нет, ладья не нападает на короля. Подними её на ту же горизонталь, где стоит король.
    successArrows:
      - { from: a1, to: a8, color: sun }

  - type: move
    title: Уйди от шаха
    prompt: Твоему королю на e1 шахует чёрная ладья. Уйди королём на безопасную клетку.
    fen: 4r2k/8/8/8/8/8/8/4K3 w - - 0 1
    answers: [e1d1, e1d2, e1f1, e1f2]
    hints:
      piece: Ходи королём, он стоит на e1.
      idea: Ладья нападает по вертикали e. Король должен сойти с неё.
    success: Король ушёл из-под шаха. Один из трёх способов сработал!
    oops: Эта клетка всё ещё под боем ладьи. Сойди с вертикали e в сторону и давай ещё раз.
    successArrows:
      - { from: e1, to: f1, color: mint }
