id: mates-rook
track: mates
order: 2
access: free
piece: r
title: Мат ладьёй в один ход
summary: Ладья ставит мат на краю доски, а королю помогают свои же фигуры.
minutes: 6
steps:
  - type: text
    title: Ладья на краю
    body: >-
      Ладья ходит по прямым линиям, и мат ею чаще всего получается на краю доски. Король
      закрыт своими пешками или стоит у самого края, а ладья даёт шах по горизонтали или
      вертикали. Ладье не нужна поддержка, если король не может её достать.
    pointsTitle: Когда ладья ставит мат
    points:
      - Король стоит на краю доски
      - Клетки перед ним закрыты своими пешками или контролируются твоим королём
      - Ладья даёт шах по краевой линии
    remember: Мат ладьёй это шах по краю, после которого король упирается в свои пешки.

  - type: move
    title: Мат на последней горизонтали
    prompt: Чёрный король спрятан за своими пешками. Поставь мат ладьёй.
    fen: 6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1
    answers: [a1a8]
    hints:
      piece: Ходи ладьёй, она стоит на a1.
      idea: Пройди по вертикали a на последнюю горизонталь, на a8.
    success: Мат! Король не может уйти, его запирают собственные пешки.
    oops: Подумай о последней горизонтали. Там у короля нет пути, он закрыт пешками.
    successArrows:
      - { from: a1, to: a8, color: sun }

  - type: move
    title: Мат с помощью короля
    prompt: Король и ладья против короля. Белый король уже подошёл, ставь мат.
    fen: 7k/8/6K1/8/8/8/8/R7 w - - 0 1
    answers: [a1a8]
    hints:
      piece: Ходи ладьёй, она стоит на a1.
      idea: Белый король закрывает клетки g7 и h7. Поставь шах по восьмой горизонтали.
    success: Мат! Белый король не пускает чёрного вперёд, а ладья держит край.
    oops: Нужен шах по краю, который не оставляет королю клеток. Ладья может пройти на a8.
    successArrows:
      - { from: a1, to: a8, color: sun }

  - type: quiz
    question: Где ладья чаще всего ставит мат?
    options:
      - text: На краю доски, на последней горизонтали или вертикали
        correct: true
        explanation: Да! На краю у короля меньше клеток, и ладья легко закрывает остальные.
      - text: В самом центре доски
        correct: false
        explanation: В центре у короля много клеток, ладье одной не справиться.
      - text: Только на a1
        correct: false
        explanation: Мат ладьёй бывает на разных клетках по краю доски.
