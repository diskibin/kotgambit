id: practice-review
track: practice
order: 6
access: free
piece: q
title: Как разбирать свои партии
summary: Работа над ошибками делает игрока сильнее быстрее, чем новые партии.
minutes: 6
steps:
  - type: text
    title: Ошибка это подсказка
    body: >-
      Сыграть партию полезно, а разобрать её ещё полезнее. Когда ты находишь свою ошибку и
      понимаешь, почему так вышло, ты перестаёшь повторять её. Разбор не обязан быть долгим,
      хватит нескольких минут после партии.
    pointsTitle: Как разобрать партию
    points:
      - Найди момент, где партия повернулась не в твою пользу
      - Спроси себя, что ты пропустил, угрозу, защиту или ход соперника
      - Подумай, какой ход был лучше
      - Запомни ошибку, чтобы не повторить её
    remember: Один разобранный проигрыш учит больше, чем три случайных победы.

  - type: quiz
    question: Ты проиграл партию. Что полезнее всего сделать сразу после неё?
    options:
      - text: Найти первую серьёзную ошибку и понять, почему она случилась
        correct: true
        explanation: Да! Первая серьёзная ошибка обычно и решает партию, поэтому ищи её.
      - text: Сразу начать новую партию, чтобы отыграться
        correct: false
        explanation: Так легко повторить те же ошибки. Сначала разберись, что пошло не так.
      - text: Решить, что шахматы не для тебя
        correct: false
        explanation: Не стоит. Каждый проигрыш показывает, над чем поработать.

  - type: quiz
    question: Какой ошибке стоит уделить больше внимания при разборе?
    options:
      - text: Той, которая повторяется из партии в партию
        correct: true
        explanation: Да! Повторяющаяся ошибка это твоя главная слабость, над ней и работай.
      - text: Любой, даже случайной
        correct: false
        explanation: Случайные промахи бывают у всех. Важнее найти то, что повторяется.
      - text: Той, которую совершил соперник
        correct: false
        explanation: Чужие ошибки тоже полезно замечать, но расти помогают твои собственные.

  - type: text
    title: Помощники в Гамбите
    body: >-
      После партии с ботом Гамбит предлагает разбор: он показывает ходы, где ты ошибся, и
      подсказывает лучшие. Ошибки можно превращать в задачи и решать их снова. Так ты закрепляешь
      правильный ход там, где раньше ошибся.
    remember: Разбирай свои партии, и ошибки превратятся в опыт.

  - type: quiz
    question: Зачем превращать свою ошибку в задачу?
    options:
      - text: Чтобы потренироваться находить правильный ход в таком же месте
        correct: true
        explanation: Да! Так ошибка превращается в урок, и в следующий раз ты не споткнёшься.
      - text: Чтобы забыть про неё
        correct: false
        explanation: Наоборот, мы хотим запомнить, как правильно, чтобы не повторять ошибку.
      - text: Чтобы расстроиться
        correct: false
        explanation: Расстраиваться не нужно. Ошибка это просто повод стать сильнее.
