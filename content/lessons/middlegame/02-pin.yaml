id: middlegame-pin
track: middlegame
order: 2
access: free
piece: b
title: Связка
summary: Фигура не может уйти с линии, потому что за ней стоит более ценная.
minutes: 6
steps:
  - type: text
    title: Фигура не может сойти с места
    body: >-
      Связка это когда твоя фигура нападает на фигуру соперника, а за ней на той же линии стоит
      более ценная. Если связанная фигура уйдёт, откроется удар по важной. Когда за ней стоит
      король, она вообще не может ходить.
    pointsTitle: Две связки
    points:
      - Полная связка, за фигурой король, ходить нельзя совсем
      - Неполная связка, за фигурой ферзь или ладья, ходить можно, но невыгодно
    board:
      fen: 4k3/8/2n5/1B6/8/8/8/4K3 b - - 0 1
      arrows:
        - { from: b5, to: e8, color: sun }
      caption: Слон b5 связал коня c6, ведь за ним стоит король
    remember: Связанная фигура стоит на месте, потому что за ней важная.

  - type: demo
    title: Гамбит показывает связку
    body: Смотри, как слон связывает коня, за которым стоит ферзь.
    fen: 3q2k1/5ppp/5n2/8/8/8/5PPP/2B3K1 w - - 0 1
    moves: [c1g5]

  - type: move
    title: Свяжи коня
    prompt: Сходи слоном так, чтобы чёрный конь f6 оказался связан с ферзём d8.
    fen: 3q2k1/5ppp/5n2/8/8/8/5PPP/2B3K1 w - - 0 1
    answers: [c1g5]
    hints:
      piece: Ходи слоном, он стоит на c1.
      idea: Слон должен встать на одну диагональ с конём f6 и ферзём d8. Для этого нужна клетка g5.
    success: Связка! Конь не может уйти, иначе ферзь окажется под ударом.
    oops: Слон пока не связывает коня. Встань на диагональ, где за конём f6 стоит ферзь d8.
    successArrows:
      - { from: c1, to: g5, color: sun }

  - type: quiz
    question: Может ли чёрный конь сойти с c6, если за ним на диагонали стоит король?
    board:
      fen: 4k3/8/2n5/1B6/8/8/8/4K3 b - - 0 1
    options:
      - text: Нет, иначе король окажется под шахом
        correct: true
        explanation: Да! Ходить, открывая шах своему королю, нельзя. Конь связан полностью.
      - text: Да, может на любую клетку
        correct: false
        explanation: Было бы удобно, но нет. Тогда слон поставил бы шах, а свой король под шах ставить нельзя.
      - text: Да, но только ходом назад
        correct: false
        explanation: Таких правил нет. Конь ходит так же, как всегда, но ему вообще нельзя уходить, пока он связан.

  - type: quiz
    question: Чем полная связка отличается от неполной?
    options:
      - text: При полной за фигурой стоит король, и ходить нельзя совсем
        correct: true
        explanation: Да! А при неполной ходить можно, но придётся отдать более ценную фигуру.
      - text: При полной связке связанных фигур больше
        correct: false
        explanation: Почти! Дело не в числе фигур, а в том, что стоит за связанной. Если король, то ходить нельзя.
      - text: Они ничем не отличаются
        correct: false
        explanation: Отличие есть. При полной связке фигура не может ходить совсем, при неполной может.
