id: basics-stalemate
track: basics
order: 11
access: free
piece: k
title: Пат
summary: Когда ходить нечем, а шаха нет, партия заканчивается вничью.
minutes: 5
steps:
  - type: text
    title: Что такое пат
    body: >-
      Пат это когда у игрока нет ни одного хода, но его король не под шахом. Партия сразу
      заканчивается вничью. Победы не получает никто, хотя у одной стороны может быть огромный
      перевес.
    board:
      fen: 7k/5Q2/6K1/8/8/8/8/8 b - - 0 1
      arrows:
        - { from: f7, to: g8, color: sun }
        - { from: f7, to: h7, color: sky }
      caption: Чёрным ходить некуда, но шаха нет. Это пат
    remember: Пат это ничья, даже если у тебя ферзь.

  - type: quiz
    question: Чёрные ходят, но все соседние клетки короля под боем, а шаха нет. Чем закончилась партия?
    board:
      fen: 7k/5Q2/6K1/8/8/8/8/8 b - - 0 1
    options:
      - text: Ничьей
        correct: true
        explanation: Да! Хода нет, шаха нет, значит пат и ничья.
      - text: Победой белых
        correct: false
        explanation: Почти! Для победы нужен мат, то есть шах без защиты. Тут шаха нет.
      - text: Победой чёрных
        correct: false
        explanation: Чёрным ходить нечем, но выигрыша это им не даёт. Партия просто заканчивается вничью.

  - type: move
    title: Поставь мат, а не пат
    prompt: Поставь мат одним ходом ферзя. Но смотри, чтобы не вышел пат!
    fen: 7k/Q7/6K1/8/8/8/8/8 w - - 0 1
    answers: [a7a8, a7h7]
    hints:
      piece: Мат поставит ферзь, он стоит на a7.
      idea: Королю на h8 нужен шах, а все клетки рядом с ним уже закрыты. Не оставляй его без шаха.
    success: Мат! Шах есть, уйти некуда. Ты победил, а не сыграл вничью.
    oops: Тут легко получить пат, когда ходов нет и шаха тоже нет. Выбери ход, при котором ферзь нападает на короля.
    successArrows:
      - { from: a7, to: a8, color: sun }

  - type: quiz
    question: Чем пат отличается от мата?
    options:
      - text: При пате шаха нет, при мате он есть
        correct: true
        explanation: Да! Мат это шах без защиты и победа, а пат это отсутствие ходов без шаха и ничья.
      - text: Это одно и то же
        correct: false
        explanation: Они похожи, но результат разный. Мат даёт победу, пат только ничью.
      - text: При пате выигрывает тот, кто его поставил
        correct: false
        explanation: Было бы славно, но нет. Пат всегда ничья, так что на перевесе в фигурах им не воспользуешься.
