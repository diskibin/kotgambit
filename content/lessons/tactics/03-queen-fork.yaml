id: tactics-queen-fork
track: tactics
order: 3
access: free
piece: q
title: Вилка ферзём
summary: Ферзь ходит далеко, поэтому вилки у него бывают самые неожиданные.
minutes: 6
steps:
  - type: text
    title: Шах и ещё одна цель
    body: >-
      Ферзь нападает по всем линиям, и с одной клетки он часто видит две цели. Сильнее всего,
      когда одна из целей король. Тогда сопернику приходится отвечать на шах, и ты забираешь
      вторую фигуру.
    pointsTitle: Где искать вилку
    points:
      - Ищи шах ферзём, после которого ферзь ещё смотрит на другую фигуру
      - Проверь, нельзя ли побить ферзя после шаха
      - Лучше всего работает против фигур без защиты
    board:
      fen: r5k1/8/8/8/8/8/8/3QK3 w - - 0 1
      arrows:
        - { from: d5, to: g8, color: sun }
        - { from: d5, to: a8, color: mint }
      caption: Ферзь на d5 даёт шах королю и нападает на ладью a8
    remember: Шах с нападением на вторую цель это самая любимая вилка ферзя.

  - type: demo
    title: Гамбит показывает вилку
    body: Ферзь ставит шах и забирает ладью.
    fen: r5k1/8/8/8/8/8/8/3QK3 w - - 0 1
    moves: [d1d5, g8h7, d5a8]

  - type: move
    title: Сделай вилку ферзём
    prompt: Поставь ферзя так, чтобы он дал шах королю и напал на ладью.
    fen: r5k1/8/8/8/8/8/8/3QK3 w - - 0 1
    answers: [d1d5]
    hints:
      piece: Ходи ферзём, он стоит на d1.
      idea: Найди клетку, откуда ферзь видит и короля g8, и ладью a8. Она в центре, это d5.
    success: Вилка! Король под шахом, а ладья остаётся без защиты. Ты выиграл ладью.
    oops: Ферзь пока нападает не на обе цели. Ищи клетку, откуда виден и король, и ладья.
    successArrows:
      - { from: d1, to: d5, color: sun }

  - type: quiz
    question: Ферзь даёт шах и нападает на ладью. Что может сделать соперник?
    options:
      - text: Отвечать на шах, а ладью придётся отдать
        correct: true
        explanation: Да! Шах обязателен, поэтому на защиту ладьи уже нет времени.
      - text: Сначала спасти ладью, а шах подождёт
        correct: false
        explanation: Шах обязательно нужно отменить, ничего другого ходить нельзя.
      - text: Поставить мат в ответ
        correct: false
        explanation: Мат ставить нечем. Ему остаётся только отвечать на шах.

  - type: quiz
    question: Какую вилку сделать труднее всего заметить?
    options:
      - text: Ту, где ферзь идёт на дальнюю клетку через всю доску
        correct: true
        explanation: Да! Ферзь ходит далеко, и такие ходы легко пропустить. Всегда проверяй шахи ферзём.
      - text: Ту, где конь бьёт рядом
        correct: false
        explanation: Рядом заметить проще. Дальние ходы ферзя пропускают чаще.
      - text: Любую, они все одинаково заметны
        correct: false
        explanation: Не совсем, дальние ходы заметить сложнее.
