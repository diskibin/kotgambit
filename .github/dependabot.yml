version: 2
updates:
  # One pnpm workspace, so one entry for all the packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      # Minor and patch updates of the same family arrive together, majors stay separate
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
