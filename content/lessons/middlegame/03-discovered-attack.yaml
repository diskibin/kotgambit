id: middlegame-discovered-attack
track: middlegame
order: 3
access: free
piece: r
title: Вскрытое нападение
summary: Фигура уходит с линии и открывает удар другой фигуры, а сама тоже нападает.
minutes: 6
steps:
  - type: text
    title: Две угрозы за один ход
    body: >-
      Вскрытое нападение возникает, когда одна твоя фигура стоит на линии другой и мешает ей. Ты
      уводишь первую фигуру, и вторая сразу начинает нападать. Если при этом первая тоже на что-то
      нападает, соперник не успеет ответить на оба удара.
    pointsTitle: Как это работает
    points:
      - Дальнобойная фигура стоит за своей
      - Передняя фигура уходит и сама создаёт угрозу
      - Открывшаяся линия даёт ещё одну, часто это шах
    board:
      fen: 3qk3/8/8/4N3/8/8/8/4RK2 w - - 0 1
      arrows:
        - { from: e1, to: e8, color: sky }
        - { from: e5, to: c6, color: sun }
      caption: Если конь уйдёт, ладья e1 нападёт на короля
    remember: Передняя фигура уходит с угрозой, а задняя вскрывается.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как конь открывает ладье путь к королю и забирает ферзя.
    fen: 3qk3/8/8/4N3/8/8/8/4RK2 w - - 0 1
    moves: [e5c6, e8f7, c6d8]

  - type: move
    title: Вскрой линию
    prompt: Сходи конём так, чтобы ладья поставила шах, а конь напал на чёрного ферзя.
    fen: 3qk3/8/8/4N3/8/8/8/4RK2 w - - 0 1
    answers: [e5c6]
    hints:
      piece: Ходи конём, он стоит на e5.
      idea: Уведи коня с вертикали e и пусть он нападёт на ферзя d8. Подойдёт клетка c6.
    success: Шах от ладьи и удар по ферзю! Ферзя спасти не получится, и ты заберёшь его в обмен на коня.
    oops: Конь пока нападает не на ферзя. Освободи ладье вертикаль и найди клетку, откуда конь бьёт по d8.
    successArrows:
      - { from: e5, to: c6, color: sun }

  - type: quiz
    question: Что такое вскрытое нападение?
    options:
      - text: Фигура уходит с линии и открывает удар другой фигуры
        correct: true
        explanation: Да! Сразу получаются две угрозы, и ответить на обе очень трудно.
      - text: Атака сразу всеми фигурами
        correct: false
        explanation: Почти! Но речь о том, что одна фигура убирается и открывает путь другой.
      - text: Взятие без боя
        correct: false
        explanation: Такого хода нет. Вскрытое нападение это уход фигуры с линии.
