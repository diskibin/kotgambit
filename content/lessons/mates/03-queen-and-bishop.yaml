id: mates-battery
track: mates
order: 3
access: free
piece: b
title: Ферзь и слон вместе
summary: Две фигуры на одной диагонали работают вместе и ставят мат.
minutes: 6
steps:
  - type: text
    title: Батарея
    body: >-
      Когда ферзь стоит позади слона или перед ним на одной диагонали, это называют батареей.
      Они давят на ту же точку, и если ферзь берёт фигуру перед королём, слон его защищает.
      Так получается мат, который трудно остановить.
    pointsTitle: Как работает батарея
    points:
      - Слон и ферзь стоят на одной диагонали
      - Ферзь бьёт вперёд, а слон его защищает
      - Мат ставится на клетке, которую слон держит под защитой
    board:
      fen: 7k/6pp/8/8/8/8/1B4Q1/6K1 w - - 0 1
      arrows:
        - { from: b2, to: g7, color: mint }
        - { from: g2, to: g7, color: sun }
      caption: Ферзь берёт пешку g7 под защитой слона b2
    remember: Слон на длинной диагонали защищает ферзя, и король не может его взять.

  - type: move
    title: Заверши батареей
    prompt: Слон защищает пешку g7 по диагонали. Возьми её ферзём и поставь мат.
    fen: 7k/6pp/8/8/8/8/1B4Q1/6K1 w - - 0 1
    answers: [g2g7, g2a8]
    hints:
      piece: Ходи ферзём, он стоит на g2.
      idea: Ферзь может взять пешку g7 под защитой слона. Король не сможет её побить.
    success: Мат! Слон защищает ферзя, и королю некуда идти.
    oops: Подумай о слабой пешке g7 перед королём. Её можно взять с поддержкой слона.
    successArrows:
      - { from: g2, to: g7, color: sun }

  - type: quiz
    question: Почему король не может взять ферзя на g7?
    options:
      - text: Ферзя защищает слон по диагонали
        correct: true
        explanation: Да! Король не имеет права брать защищённую фигуру, иначе он попал бы под шах.
      - text: Потому что король не берёт фигуры
        correct: false
        explanation: Король берёт фигуры, но только те, которые не защищены.
      - text: Потому что на g7 стоит пешка
        correct: false
        explanation: Ферзь уже взял эту пешку. Король не может его побить из-за защиты слона.

  - type: quiz
    question: Что такое батарея?
    options:
      - text: Две фигуры на одной линии, которые усиливают друг друга
        correct: true
        explanation: Да! Они давят вместе и защищают друг друга.
      - text: Все фигуры, собранные на одном фланге
        correct: false
        explanation: Батарея это не любое скопление, а две фигуры на одной линии.
      - text: Любые две фигуры рядом
        correct: false
        explanation: Они должны стоять на одной диагонали, вертикали или горизонтали.
