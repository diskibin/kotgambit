id: basics-en-passant
track: basics
order: 13
access: free
piece: p
title: Взятие на проходе
summary: Особое взятие пешки, которая прошла мимо двумя клетками.
minutes: 6
steps:
  - type: text
    title: Пешка берёт на проходе
    body: >-
      Если пешка соперника сделала ход на две клетки и встала рядом с твоей, ты можешь взять её,
      как будто она сделала только один шаг. Твоя пешка встаёт на клетку, которую та перепрыгнула.
      Сделать это можно только следующим ходом, потом право пропадает.
    board:
      fen: 4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 2
      arrows:
        - { from: e5, to: d6, color: sun }
      caption: Чёрная пешка прошла с d7 на d5. Белая пешка берёт её на d6
    remember: Брать на проходе можно только сразу, на следующем ходу.

  - type: demo
    title: Гамбит показывает взятие
    body: 'Смотри: чёрная пешка идёт на две клетки, а белая берёт её на проходе.'
    fen: 4k3/3p4/8/4P3/8/8/8/4K3 b - - 0 1
    moves: [d7d5, e5d6]

  - type: move
    title: Возьми на проходе
    prompt: Чёрная пешка только что прошла на d5. Возьми её на проходе.
    fen: 4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 2
    answers: [e5d6]
    hints:
      piece: Бери пешкой, она стоит на e5.
      idea: Чёрная пешка перепрыгнула клетку d6. Пойди на эту клетку по диагонали.
    success: Взятие на проходе! Чёрная пешка ушла с доски, хотя ты встал на другую клетку.
    oops: Пешка берёт по диагонали на клетку, которую перепрыгнул соперник. Подумай про d6.
    successArrows:
      - { from: e5, to: d6, color: sun }

  - type: quiz
    question: Когда можно взять пешку на проходе?
    options:
      - text: Только следующим ходом после её хода на две клетки
        correct: true
        explanation: Да! Если не успеешь сразу, возможность исчезнет.
      - text: В любой момент партии
        correct: false
        explanation: Было бы удобно, но право есть только на один ход, сразу после хода соперника.
      - text: Когда пешка соперника сделала шаг на одну клетку
        correct: false
        explanation: Почти! Но брать на проходе можно только после хода сразу на две клетки.
