id: basics-pawn
track: basics
order: 7
access: free
piece: p
title: Как ходит пешка
summary: Пешка идёт вперёд, а берёт по диагонали.
minutes: 6
steps:
  - type: text
    title: Пешка идёт только вперёд
    body: >-
      Пешка ходит вперёд на одну клетку. Из начального положения она может пройти сразу две клетки. Назад пешка не ходит, а если перед ней стоит фигура, она остановится.
    board:
      fen: 4k3/8/8/8/8/8/3P4/4K3 w - - 0 1
      arrows:
        - { from: d2, to: d3, color: sun }
        - { from: d2, to: d4, color: sky }
      caption: Со своего места пешка d2 может пойти на d3 или сразу на d4
    remember: Пешка идёт вперёд и никогда не возвращается.

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: первым ходом пешка прошла две клетки.'
    fen: 4k3/8/8/8/8/8/3P4/4K3 w - - 0 1
    moves: [d2d4]

  - type: move
    title: Сделай первый ход
    prompt: Сходи пешкой d2 вперёд. Можно на одну клетку, можно на две.
    fen: 4k3/8/8/8/8/8/3P4/4K3 w - - 0 1
    answers: [d2d3, d2d4]
    hints:
      piece: Ходи пешкой, она стоит на d2.
      idea: Пешка идёт прямо вперёд по вертикали d.
    success: Пешка сделала шаг вперёд. Отличный ход!
    oops: Пешка ходит только прямо вперёд. Попробуй пойти по вертикали d.
    successArrows:
      - { from: d2, to: d4, color: sun }

  - type: text
    title: Берёт пешка по-другому
    body: >-
      Ходит пешка прямо, а фигуры соперника берёт по диагонали на одну клетку вперёд. Вперёд прямо брать нельзя: если там стоит фигура, пешка просто упирается в неё.
    board:
      fen: 4k3/8/8/4p3/3P4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: e5, color: sun }
      caption: Пешка d4 может взять чёрную пешку на e5
    remember: Ходит прямо, берёт наискосок.

  - type: move
    title: Возьми пешкой
    prompt: Возьми белой пешкой чёрную пешку на e5.
    fen: 4k3/8/8/4p3/3P4/8/8/4K3 w - - 0 1
    answers: [d4e5]
    hints:
      piece: Бери пешкой, она стоит на d4.
      idea: Чёрная пешка стоит на одну клетку вперёд и вправо. Пешка берёт по диагонали.
    success: Взятие! Пешка шагнула по диагонали и забрала фигуру.
    oops: Пешка берёт не прямо, а наискосок вперёд. Посмотри на диагональ перед ней.
    successArrows:
      - { from: d4, to: e5, color: sun }

  - type: find-squares
    title: Куда пойдёт пешка
    prompt: Отметь все клетки, куда может пойти белая пешка.
    fen: 4k3/8/8/8/8/3p1p2/4P3/4K3 w - - 0 1
    movesOf: e2
    squares: [e3, e4, d3, f3]
    success: Верно! Вперёд на одну или две клетки, и взять обе чёрные пешки по диагонали.
    oops: Не страшно. Прямо пешка ходит, а по диагонали берёт, если там стоит фигура соперника.
    hint: Две клетки вперёд по вертикали e и две диагональные клетки, где стоят чёрные пешки.

  - type: quiz
    question: Как пешка берёт фигуры?
    options:
      - text: Прямо вперёд
        correct: false
        explanation: Почти! Прямо пешка только ходит. Если там стоит фигура, она упирается в неё.
      - text: По диагонали на одну клетку вперёд
        correct: true
        explanation: Да! Ходит прямо, а берёт наискосок.
      - text: Во все стороны, как король
        correct: false
        explanation: Так берёт король. А пешка смотрит только вперёд и наискосок.
