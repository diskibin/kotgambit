id: basics-draw
track: basics
order: 19
access: free
piece: k
title: Ничья
summary: Партия не всегда кончается победой. Узнай, как получается ничья.
minutes: 7
steps:
  - type: text
    title: Ничья это тоже результат
    body: >-
      Иногда никто не выигрывает, и партия заканчивается вничью. Это не поражение, а часто хороший способ спасти трудную позицию. Ничья получается в пяти случаях.
    pointsTitle: Пять способов сделать ничью
    points:
      - Пат, когда у игрока нет ходов, но его король не под шахом
      - Мало фигур, когда ни у кого не хватит сил для мата
      - Повторение, когда одна и та же позиция случилась три раза
      - Пятьдесят ходов без взятий и без ходов пешками
      - По согласию, когда игроки договорились
    remember: Ничья спасает, когда ты проигрываешь, и огорчает, когда ты выигрываешь.

  - type: quiz
    question: Можно ли поставить мат в этой позиции, у белых только король и слон?
    board:
      fen: 8/8/8/4k3/8/3K4/4B3/8 w - - 0 1
      caption: Король и слон против короля
    options:
      - text: Нет, королём и слоном мат поставить нельзя, это ничья
        correct: true
        explanation: Да! Одного слона и короля мало. Такую партию объявляют ничьей сразу.
      - text: Да, слон загонит короля в угол
        correct: false
        explanation: Хорошая мысль, но у слона не хватит сил. Для мата нужны ещё фигуры.
      - text: Да, но только если чёрные ошибутся
        correct: false
        explanation: Даже с ошибками соперника мат тут невозможен, ведь сил слишком мало.

  - type: demo
    title: Повторение позиции
    body: >-
      Смотри, как ладьи ходят туда и обратно. Когда одна и та же позиция случается три раза, можно получить ничью.
    fen: 1r4k1/8/8/8/8/8/8/1R4K1 w - - 0 1
    moves: [b1a1, b8a8, a1b1, a8b8, b1a1, b8a8, a1b1, a8b8]

  - type: text
    title: Пятьдесят ходов и согласие
    body: >-
      Если пятьдесят ходов подряд никто не брал фигуры и не двигал пешки, партия считается ничьей. Так игра не тянется бесконечно. А ещё один игрок может предложить ничью, и если соперник согласен, партия заканчивается.
    remember: Предлагай ничью после своего хода и только тогда, когда она тебя устраивает.

  - type: move
    title: Не ставь пат
    prompt: >-
      У тебя ферзь, а у чёрных остался один король. Поставь мат и не сделай пат.
    fen: 7k/8/5K2/8/8/8/8/6Q1 w - - 0 1
    answers: [g1g7]
    hints:
      piece: Ходи ферзём, он стоит на g1.
      idea: Поставь ферзя рядом с королём, но так, чтобы твой король его защищал. Подойдёт g7.
    success: Мат! Ферзь на g7 под защитой короля, и чёрным некуда деться.
    oops: Осторожно, так у чёрных может не остаться ходов, и получится пат. Ищи ход с шахом.
    successArrows:
      - { from: g1, to: g7, color: sun }

  - type: quiz
    question: Какой из этих результатов не считается ничьей?
    options:
      - text: Пат
        correct: false
        explanation: Пат как раз ничья, ведь у игрока нет ходов, а шаха нет.
      - text: Три одинаковые позиции
        correct: false
        explanation: Это ничья по повторению позиции.
      - text: Соглашение игроков
        correct: false
        explanation: Если оба согласны, партия заканчивается вничью.
      - text: Мат
        correct: true
        explanation: Да! Мат это победа одной из сторон, ничьей он не бывает.
