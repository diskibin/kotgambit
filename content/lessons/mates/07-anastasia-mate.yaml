        - { from: a1, to: h1, color: sun }
      caption: Конь e7 закрывает g8 и g6, ладья идёт на h1 с шахом
    remember: Конь закрывает соседние клетки, а ладья ставит мат по краю.

  - type: move
    title: Поставь мат Анастасии
    prompt: Конь уже закрыл королю нужные клетки. Поставь мат ладьёй.
    fen: 8/4N1pk/8/8/8/2K5/8/R7 w - - 0 1
    answers: [a1h1]
    hints:
      piece: Ходи ладьёй, она стоит на a1.
