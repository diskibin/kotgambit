id: middlegame-piece-activity
track: middlegame
order: 11
access: free
piece: n
title: Активность фигур
summary: Фигура в центре видит больше клеток, чем фигура на краю, поэтому она сильнее.
minutes: 6
steps:
  - type: text
    title: Чем больше клеток, тем сильнее
    body: >-
      Активная фигура это фигура, которая нападает на много клеток и мешает сопернику. Конь в
      центре доски может пойти на восемь клеток, а на краю только на четыре, в углу на две. Поэтому
      фигуры стараются вывести ближе к центру.
    pointsTitle: Как повысить активность
    points:
      - Выводи коней и слонов в центр, а не к краю
      - Найди свою самую пассивную фигуру и улучши её
      - Не загораживай слонов собственными пешками
    board:
      fen: 4k3/8/8/8/N2N4/8/8/4K3 w - - 0 1
      arrows:
        - { from: d4, to: f5, color: sun }
        - { from: a4, to: c5, color: sky }
      caption: Конь d4 бьёт по восьми клеткам, а конь a4 только по четырём
    remember: Фигура в центре работает лучше, чем на краю.

  - type: demo
    title: Гамбит показывает приём
    body: Смотри, как конь переезжает с края ближе к центру.
    fen: 4k3/pppp1ppp/8/8/4P3/7N/PPPP1PPP/4K3 w - - 0 1
    moves: [h3f4]

  - type: move
    title: Улучши коня
    prompt: Конь на h3 стоит на краю. Перевези его ближе к центру.
    fen: 4k3/pppp1ppp/8/8/4P3/7N/PPPP1PPP/4K3 w - - 0 1
    answers: [h3f4, h3g5]
    hints:
      piece: Ходи конём, он стоит на h3.
      idea: Конь на краю видит мало клеток. Выбери поле f4 или g5, откуда он смотрит на центр.
    success: Конь стал активнее, теперь он видит намного больше клеток. Отличный ход!
    oops: Конь пока остаётся на краю. Перевези его на клетку ближе к центру, например на f4.
    successArrows:
      - { from: h3, to: f4, color: sun }

  - type: quiz
    question: Какой из двух белых коней активнее?
    board:
      fen: 4k3/8/8/8/N2N4/8/8/4K3 w - - 0 1
    options:
      - text: Конь на d4, он бьёт по восьми клеткам
        correct: true
        explanation: Да! В центре у коня больше всего ходов.
      - text: Конь на a4, он бьёт по четырём клеткам
        correct: false
        explanation: Почти! У края у коня меньше возможностей, чем в центре.
      - text: Они одинаково активны
        correct: false
        explanation: Не совсем. Число клеток, которые видит конь, зависит от того, где он стоит.

  - type: quiz
    question: Что делать со своей самой пассивной фигурой?
    options:
      - text: Улучшать её, переводя на активное поле
        correct: true
        explanation: Да! Так ты каждым ходом делаешь позицию лучше.
      - text: Оставить на месте, она никому не мешает
        correct: false
        explanation: Пассивная фигура не помогает в игре. Её лучше вывести на активное поле.
      - text: Разменять на любую фигуру соперника
        correct: false
        explanation: Менять не всегда выгодно. Сначала попробуй найти ей лучшее поле.
