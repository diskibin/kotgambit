id: practice-check-answers
track: practice
order: 3
access: free
piece: k
title: Три ответа на шах
summary: Побить, закрыть или уйти. Выбирай быстро и спокойно.
minutes: 6
steps:
  - type: text
    title: Что делать под шахом
    body: >-
      Когда королю ставят шах, ты обязан его отменить. Для этого есть всего три способа, и важно
      помнить их все.
    pointsTitle: Три способа
    points:
      - Побить фигуру, которая даёт шах
      - Закрыть путь, поставив фигуру между шахующей и королём
      - Уйти королём на безопасную клетку
    board:
      fen: 4k3/n7/8/1B6/8/8/8/4K3 b - - 0 1
      arrows:
        - { from: b5, to: e8, color: sun }
      caption: Слон b5 шахует, а у чёрных есть все три ответа
    remember: Если ни один из трёх способов не помогает, это мат.

  - type: move
    title: Побей шахующего
    prompt: Слон дал шах. Побей его конём.
    fen: 4k3/n7/8/1B6/8/8/8/4K3 b - - 0 1
    answers: [a7b5]
    hints:
      piece: Ходи конём, он стоит на a7.
      idea: Слон стоит на b5, и конь достаёт до этой клетки.
    success: Хорошо! Шах снят, а слон потерян.
    oops: Тут нужен именно способ взять шахующую фигуру. Конь с a7 достаёт до слона.
    successArrows:
      - { from: a7, to: b5, color: sun }

  - type: move
    title: Закрой шах
    prompt: Ладья даёт шах по вертикали. Закрой шах слоном.
    fen: 2b1k3/5p2/8/8/8/8/8/4RK2 b - - 0 1
    answers: [c8e6]
    hints:
      piece: Ходи слоном, он стоит на c8.
      idea: Поставь слона на вертикаль e между ладьёй и королём, на e6. Его защищает пешка f7.
    success: Отлично! Слон закрыл короля, а ладья ничего не взяла.
    oops: Для этого шаха нужна фигура между ладьёй и королём. Слон может встать на e6.
    successArrows:
      - { from: c8, to: e6, color: sun }

  - type: move
    title: Уйди королём
    prompt: Конь дал шах, его нельзя закрыть. Уведи короля.
    fen: 4k3/8/5N2/8/8/8/8/4K3 b - - 0 1
    answers: [e8d8, e8e7, e8f8, e8f7]
    hints:
      piece: Ходи королём, он стоит на e8.
      idea: Выбери клетку, которую конь не атакует. Например, e7 или f8.
    success: Хорошо! Король ушёл из-под шаха на безопасную клетку.
    oops: Эту клетку ещё бьёт конь. Король должен уйти на клетку, на которую белые не нападают.
    successArrows:
      - { from: e8, to: e7, color: sun }

  - type: quiz
    question: От какой фигуры шах нельзя закрыть, только побить её или уйти королём?
    options:
      - text: От коня
        correct: true
        explanation: Да! Конь прыгает через фигуры, поэтому закрыться от него нельзя.
      - text: От ладьи
        correct: false
        explanation: От ладьи можно закрыться, поставив фигуру на линию между ней и королём.
      - text: От слона
        correct: false
        explanation: От слона тоже можно закрыться, поставив фигуру на диагональ.

  - type: quiz
    question: Тебе поставили шах, и ты не можешь ни побить, ни закрыться, ни уйти. Что это?
    options:
      - text: Мат, партия проиграна
        correct: true
        explanation: Да! Когда ни один из трёх способов не работает, это мат.
      - text: Пат
        correct: false
        explanation: Пат бывает, когда шаха нет, а ходов нет. Здесь шах есть.
      - text: Ничья
        correct: false
        explanation: Это не ничья, а проигрыш.
