id: strategy-isolated-pawn
track: strategy
order: 4
access: free
piece: p
title: Изолированная пешка
summary: Пешка без соседей это слабость, но у неё есть и сильные стороны.
minutes: 6
steps:
  - type: text
    title: Пешка без соседей
    body: >-
      Изолированная пешка это пешка, рядом с которой на соседних вертикалях нет твоих пешек. Её некому защитить, и защищать приходится фигурам. Но такая пешка даёт и простор для твоих фигур, поэтому всё зависит от позиции.
    pointsTitle: Что нужно знать про изолированную пешку
    points:
      - Её не защищают другие пешки
      - Клетка перед ней удобна для чужой фигуры, ведь пешкой её не прогнать
      - Поменяв фигуры, соперник легче нападает на слабую пешку
    board:
      fen: 4k3/pp3ppp/8/8/3P4/8/PP3PPP/4K3 w - - 0 1
      caption: Белая пешка d4 изолирована, на c и e нет белых пешек
    remember: Изолированная пешка слаба в эндшпиле, но может быть сильной в миттельшпиле.

  - type: find-squares
    title: Найди изолированную пешку
    prompt: Отметь белую пешку, у которой нет соседей на соседних вертикалях.
    fen: 4k3/pp3ppp/8/8/3P4/8/PP3PPP/4K3 w - - 0 1
    squares: [d4]
    success: Верно! У пешки d4 нет белых соседей на c и e.
    oops: Посмотри на соседние вертикали каждой белой пешки. У одной из них нет белого соседа.
    hint: Это единственная белая пешка в центре доски.

  - type: quiz
    question: Какая клетка удобна чёрным фигурам против изолированной пешки d4?
    board:
      fen: 4k3/pp3ppp/8/8/3P4/8/PP3PPP/4K3 w - - 0 1
      caption: Пешка d4 изолирована
    options:
      - text: Клетка a2
        correct: false
        explanation: Перед пешкой d4 нужная клетка это d5, на ней фигура стоит надёжнее всего.
      - text: Клетка d5, прямо перед пешкой
        correct: true
        explanation: Да! Её нельзя выбить пешкой, поэтому она отличный пост для чужого коня или слона.
      - text: Клетка h7
        correct: false
        explanation: Это чёрная клетка с пешкой, она не связана с изолированной пешкой.

  - type: quiz
    question: Что лучше делать, владея изолированной пешкой?
    options:
      - text: Действовать активно в миттельшпиле, пока фигуры на доске
        correct: true
        explanation: Да! С изолированной пешкой лучше атаковать, а не идти в эндшпиль, где она слабее.
      - text: Мечтать об эндшпиле
        correct: false
        explanation: В эндшпиле изолированная пешка обычно слабее.
      - text: Забыть о ней
        correct: false
        explanation: За слабой пешкой нужно присматривать.
