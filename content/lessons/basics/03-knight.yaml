id: basics-knight
track: basics
order: 3
access: free
piece: n
title: Как ходит конь
summary: Конь прыгает буквой «Г» и перепрыгивает через фигуры.
minutes: 6
steps:
  - type: text
    title: Конь ходит буквой «Г»
    body: >-
      Конь прыгает на две клетки в одну сторону и ещё на одну в сторону. Получается буква «Г».
      Он единственная фигура, которая умеет перепрыгивать через другие.
    board:
      fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      arrows:
        - { from: g1, to: f3, color: sun }
        - { from: g1, to: h3, color: sky }
      caption: С клетки g1 конь может прыгнуть на f3 или на h3
    remember: Две клетки в одну сторону и одна в сторону, вот и вся буква «Г».

  - type: demo
    title: Гамбит показывает ход
    body: 'Смотри: две клетки вверх и одна в сторону. Конь перепрыгивает через пешки!'
    fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
    moves: [g1f3]

  - type: move
    title: Твой ход
    prompt: Конь ходит буквой «Г». Сходи конём с g1 так, чтобы он смотрел на центр.
    fen: rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
    answers: [g1f3]
    hints:
      piece: Ходи конём, он стоит на g1.
      idea: Две клетки вверх и одна вбок. Смотри на голубую стрелку, вот куда я бы прыгнул.
    success: Вот это да! С f3 конь смотрит на центр и держит поля e5 и d4.
    oops: С края доски конь видит меньше клеток. Поставь его ближе к центру, и давай ещё раз.
    successArrows:
      - { from: f3, to: e5, color: sun }
      - { from: f3, to: d4, color: sky }

  - type: find-squares
    title: Куда пойдёт конь
    prompt: Отметь все клетки, куда может пойти белый конь.
    fen: 4k3/8/8/8/3N4/8/8/4K3 w - - 0 1
    movesOf: d4
    squares: [b3, b5, c2, c6, e2, e6, f3, f5]
    success: Отлично! Из центра конь может прыгнуть сразу на восемь клеток.
    oops: 'Не страшно. Представь букву «Г» во все стороны: две клетки в одну сторону и одна вбок.'
    hint: Начни с клеток, которые на две вверх от коня, и отметь клетки справа и слева от них.

  - type: move
    title: Возьми пешку
    prompt: Конь берёт так же, как ходит. Забери чёрную пешку на e5.
    fen: 4k3/8/8/4p3/8/5N2/8/4K3 w - - 0 1
    answers: [f3e5]
    hints:
      piece: Бери конём, он стоит на f3.
      idea: 'Пешка на e5 стоит как раз буквой «Г» от коня: две клетки вверх и одна влево.'
    success: Забрал! Конь встаёт на место пешки, так он берёт.
    oops: Пешка стоит на e5. Найди клетку на букву «Г» от коня и забери пешку.
    successArrows:
      - { from: f3, to: e5, color: mint }

  - type: quiz
    question: Какая фигура умеет перепрыгивать через другие?
    options:
      - text: Конь
        correct: true
        explanation: Да! Конь единственный умеет прыгать через фигуры, поэтому он может выйти из-за пешек уже на первом ходу.
      - text: Ладья
        correct: false
        explanation: Ладья ездит по прямой и упирается в первую же фигуру на пути.
      - text: Слон
        correct: false
        explanation: Слон ходит по диагонали и тоже останавливается перед фигурой.
